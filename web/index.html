function buildComparison(history, daysInCourse) {
  if (!history.length || daysInCourse < 7) return "";

  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  const chron = [...history].reverse();

  const first7 = chron.slice(0, 7);
  const last7  = chron.slice(-7);

  const avgFirst = first7.reduce((s, e) => s + getCharge(e), 0) / first7.length;
  const avgLast  = last7.reduce((s,  e) => s + getCharge(e), 0) / last7.length;
  const delta    = avgLast - avgFirst;
  const deltaStr = delta >= 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1);
  const deltaColor = delta >= 0 ? "var(--green)" : "#e07070";

  const bar = (val) => {
    const pct = Math.round((val / 5) * 100);
    return `<div style="background:var(--card);border-radius:6px;height:8px;margin-top:6px">
      <div style="background:var(--green);border-radius:6px;height:8px;width:${pct}%"></div></div>`;
  };

  return `
    <div class="card" style="margin-bottom:10px">
      <span class="label">До и после</span>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px">
        <div style="text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">НАЧАЛО</div>
          <div style="font-size:32px;font-weight:700;color:var(--text)">${avgFirst.toFixed(1)}</div>
          <div style="font-size:11px;color:var(--muted)">заряд</div>
          ${bar(avgFirst)}
        </div>
        <div style="text-align:center;padding:0 4px">
          <div style="font-size:22px;font-weight:800;color:${deltaColor}">${deltaStr}</div>
          <div style="font-size:10px;color:var(--muted)">балла</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">СЕЙЧАС</div>
          <div style="font-size:32px;font-weight:700;color:${deltaColor}">${avgLast.toFixed(1)}</div>
          <div style="font-size:11px;color:var(--muted)">заряд</div>
          ${bar(avgLast)}
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">
        ${delta >= 0.5 ? '🚀 Виден прогресс — курс работает!' : delta >= 0 ? 'Стабильно — продолжай' : 'Есть куда расти — следи за сном и едой'}
      </div>
    </div>`;
}

      <div class="ref-big">${ref_count}</div>
      <div class="ref-sub">Приглашено</div>

      <div class="ref-next">${nextRef ? `До следующей награды: ${nextRef.reward}` : "Все награды получены!"}</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <span class="label" style="margin-bottom:14px">Уровни наград</span>
      <ul class="ref-levels" style="margin-top:14px">
        ${REF_LEVELS.map(l => `
          <li>
            <span class="ref-lvl-badge ${ref_count >= l.count ? "done" : ""}">${l.count} чел.</span>
            <span style="flex:1">${l.reward}</span>
            ${ref_count >= l.count ? `<span style="color:var(--green);font-weight:700;font-size:14px">✓</span>` : ""}
          </li>`).join("")}
      </ul>
    </div>
    <span class="label">Твоя ссылка</span>
    <div class="ref-link-box" style="margin-top:8px;margin-bottom:12px">${refLink}</div>
    <button class="btn" onclick="window.open('${shareUrl}','_blank')">Поделиться ссылкой</button>
    <button class="btn outline" style="margin-top:8px" onclick="copyRef('${refLink}')">Скопировать</button>`;

  // ── Share progress card ───────────────────────────────────────────────
  const shareText = encodeURIComponent(
    `🌿 Я на курсе Biolar Organics уже ${course_days} дней!\n` +
    `Стрик: ${streak} дней подряд.\n` +

  const shareFull = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${shareText}`;

  const shareCardHtml = `

        <div class="share-prog-divider"></div>
        <div class="share-prog-item"><div class="share-prog-num">${level.name}</div><div class="share-prog-lbl">уровень</div></div>

  // ── PWA install card (всегда показываем) ─────────────────────────────
  const installHtml = `

      <div style="width:40px;height:40px;border-radius:1rem;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">📲</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;color:var(--text)">На рабочий стол</div>

  // ── Render all ────────────────────────────────────────────────────────
  setScreenHTML(screen, `

}

async function loadReminderSettings() {
  try {
    const data = await api("GET", "/api/settings/reminder");
    const timeEl  = document.getElementById("rem-time");
    const trackEl = document.getElementById("rem-track");
    const thumbEl = document.getElementById("rem-thumb");
    const lblEl   = document.getElementById("rem-lbl");
    if (timeEl && data.reminder_time) timeEl.value = data.reminder_time;
    if (data.enabled) {
      trackEl?.classList.add("on");
      thumbEl?.classList.add("on");
      if (lblEl) lblEl.textContent = "Вкл";
    }
  } catch(e) { console.error("loadReminderSettings:", e); }
}

function toggleReminder(wrap) {
  const track = document.getElementById("rem-track");
  const thumb = document.getElementById("rem-thumb");
  const lbl   = document.getElementById("rem-lbl");
  const on = !track?.classList.contains("on");
  track?.classList.toggle("on", on);
  thumb?.classList.toggle("on", on);
  if (lbl) lbl.textContent = on ? "Вкл" : "Выкл";
}

async function saveReminder() {
  const time    = document.getElementById("rem-time")?.value || null;
  const enabled = document.getElementById("rem-track")?.classList.contains("on") || false;
  try {
    await api("POST", "/api/settings/reminder", { reminder_time: time, enabled });
    toast(enabled ? `Напоминание в ${time} включено` : "Напоминание выключено");
  } catch(e) { toast("Ошибка: " + e.message); }
}

async function claimChallenge(challengeId, btn) {
  if (btn.classList.contains("claimed") || btn.classList.contains("locked")) return;
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/club/challenge/claim", { challenge_id: challengeId });
  if (data.already_claimed) { btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено"; return; }
  if (!data.ok) { btn.disabled = false; btn.textContent = "Забрать"; return; }
  btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено";
  toast(`+${data.reward} баллов! Всего: ${data.new_total}`);
  // Update level card points
  const lvlPtsEl = document.querySelector(".level-pts strong");
  if (lvlPtsEl) lvlPtsEl.textContent = data.new_total;
}

async function joinGiveaway(btn) {
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/giveaway/join");
  const el = document.getElementById("giveCount");
  if (el) el.textContent = data.total_participants;
  const card = document.createElement("div");
  card.className = "card"; card.style.cssText = "text-align:center;padding:18px";
  card.innerHTML = `<div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Итоги в конце месяца. Удачи.</div>`;
  btn.replaceWith(card);
  toast("Ты в розыгрыше");
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована"));
}
