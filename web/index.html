<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a7c59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biolar">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:     #f7f3ed;
    --card:   #ffffff;
    --green:  #2c4a2e;
    --green2: #4a7c59;
    --gold:   #c4965a;
    --gold2:  #dab07a;
    --text:   #1c1c1a;
    --muted:  #8c8070;
    --border: rgba(44,74,46,0.1);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(247,243,237,0.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .nav-btn {
    flex: 1; padding: 18px 4px 14px;
    font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: #c0b4a4; background: none; border: none; cursor: pointer;
    transition: color .15s; position: relative;
  }
  .nav-btn::before {
    content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 1.5px;
    background: linear-gradient(90deg, var(--green), var(--green2));
    opacity: 0; transition: opacity .2s;
  }
  .nav-btn.active { color: var(--green); }
  .nav-btn.active::before { opacity: 1; }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px 16px; animation: fadeIn .18s; }
  .screen.active { display: block; }
  #screen-ai.active {
    display: flex !important;
    flex-direction: column;
    height: calc(100dvh - 88px - env(safe-area-inset-bottom, 0px) - 16px);
    padding-bottom: 0;
    overflow: hidden;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* ── PRIMITIVES ── */
  .label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  }
  .serif { font-family: 'DM Serif Display', Georgia, serif; }

  .btn {
    display: block; width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    color: #f7f3ed; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { opacity: .82; transform: scale(.99); }
  .btn.outline {
    background: transparent; color: var(--green);
    border: 1.5px solid rgba(44,74,46,0.22);
  }
  .btn.gold-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
    color: #1c1c1a;
  }
  .btn + .btn { margin-top: 8px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(44,74,46,0.05);
  }

  .spinner { display: flex; justify-content: center; padding: 60px; }
  .spinner::after {
    content: ""; width: 24px; height: 24px;
    border: 2px solid rgba(44,74,46,0.12); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #f7f3ed;
    padding: 10px 22px; border-radius: 99px;
    font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ══ ГЛАВНАЯ ════════════════════════════════════════════════════════════════ */

  .home-greeting { margin-bottom: 20px; }
  .home-greeting .label { margin-bottom: 6px; }
  .home-greeting-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px; letter-spacing: -.3px; line-height: 1.1;
  }

  .streak-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 6px 24px rgba(44,74,46,0.18);
  }
  .streak-card-left .label { color: rgba(247,243,237,0.55); margin-bottom: 4px; }
  .streak-num {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 48px; color: #f7f3ed; line-height: 1; letter-spacing: -2px;
  }
  .streak-sub { font-size: 12px; color: rgba(247,243,237,0.65); margin-top: 2px; }
  .streak-card-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .stat-pill {
    background: rgba(247,243,237,0.15); border-radius: 99px;
    padding: 5px 12px; font-size: 11px; color: rgba(247,243,237,0.8);
    font-weight: 600; letter-spacing: .3px;
  }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head .label { color: var(--muted); }
  .section-link {
    font-size: 11px; font-weight: 700; color: var(--green);
    letter-spacing: .3px; background: none; border: none; cursor: pointer; padding: 0;
  }

  /* Мини-курс на главной */
  .mini-task {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 8px;
    box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .mini-check {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .mini-check.done {
    background: linear-gradient(135deg, var(--green), var(--green2));
    border-color: transparent; color: #f7f3ed;
  }
  .mini-task-name { font-size: 13px; font-weight: 600; flex: 1; }

  /* Wellness виджет на главной */
  .wellness-widget {
    background: linear-gradient(135deg, #fdf9f4 0%, #f0f5ef 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 10px;
  }
  .wellness-scores { display: flex; gap: 12px; margin-top: 12px; }
  .ws-item { flex: 1; text-align: center; }
  .ws-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px; line-height: 1; margin-bottom: 4px;
  }
  .ws-val.energy { color: #e8a020; }
  .ws-val.sleep  { color: var(--green2); }
  .ws-val.mood   { color: var(--gold); }
  .ws-label { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }

  /* Контент-карточки */
  .content-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 8px;
    box-shadow: 0 1px 8px rgba(44,74,46,0.04);
    cursor: pointer;
  }
  .content-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green2); margin-bottom: 8px; }
  .content-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .content-preview { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .content-body { font-size: 13px; color: var(--text); line-height: 1.7; margin-top: 10px; display: none; }
  .content-body.open { display: block; }
  .content-toggle {
    font-size: 11px; font-weight: 700; color: var(--green);
    background: none; border: none; cursor: pointer;
    margin-top: 10px; padding: 0; letter-spacing: .3px;
  }

  /* ══ ПРОГРАММА ══════════════════════════════════════════════════════════════ */

  /* 30-day progress */
  .course-banner {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(196,150,90,0.25);
    color: #1c1c1a;
  }
  .course-banner .label { color: rgba(28,28,26,0.55); margin-bottom: 4px; }
  .course-day-num {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 48px; line-height: 1; letter-spacing: -2px; margin-bottom: 8px;
  }
  .course-prog-wrap { height: 4px; background: rgba(28,28,26,0.15); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .course-prog-bar  { height: 100%; background: rgba(28,28,26,0.55); border-radius: 99px; transition: width .5s; }
  .course-prog-sub  { font-size: 11px; color: rgba(28,28,26,0.55); font-weight: 600; letter-spacing: .3px; }

  /* Quiz inside program */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .quiz-counter { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
  .quiz-prog-wrap { height: 2px; background: rgba(196,150,90,0.2); border-radius: 99px; margin-bottom: 32px; overflow: hidden; }
  .quiz-prog-bar  { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s; }
  .quiz-q {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; line-height: 1.2; letter-spacing: -.2px; margin-bottom: 24px;
  }
  .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .quiz-card {
    position: relative;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 18px 14px; font-size: 14px; font-weight: 500; text-align: center;
    cursor: pointer; color: var(--text); line-height: 1.35;
    transition: all .18s; box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .quiz-card:active { transform: scale(.97); }
  .quiz-card.selected {
    background: linear-gradient(135deg, var(--green) 0%, #3d6b4a 100%);
    border-color: transparent; color: #f7f3ed;
    box-shadow: 0 4px 16px rgba(44,74,46,0.22);
  }
  .quiz-card.selected::after {
    content: "✓"; position: absolute; top: 9px; right: 11px;
    font-size: 10px; color: rgba(247,243,237,0.6); font-weight: 700;
  }
  .quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .quiz-chip {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 99px;
    padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all .18s;
  }
  .quiz-chip.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; color: #f7f3ed; }
  .scale-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 13px 4px; text-align: center;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all .18s;
  }
  .scale-seg.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; box-shadow: 0 4px 14px rgba(44,74,46,0.2); }
  .scale-num { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: #f7f3ed; }
  .scale-lbl { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .scale-seg.selected .scale-lbl { color: rgba(247,243,237,0.7); }
  .back-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; margin-top: 16px; }

  /* Results */
  .results-hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 24px 22px; margin-bottom: 20px;
    box-shadow: 0 8px 28px rgba(44,74,46,0.2);
  }
  .results-hero .label { color: rgba(247,243,237,0.55); margin-bottom: 6px; }
  .results-hero-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 28px; color: #f7f3ed; line-height: 1.1; }

  .analysis-block {
    background: linear-gradient(135deg, #eef5ee 0%, #f7f3ed 100%);
    border: 1px solid rgba(44,74,46,0.1); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .analysis-block .label { color: var(--green); margin-bottom: 10px; }
  .analysis-list { list-style: none; margin-top: 10px; }
  .analysis-list li { font-size: 13px; padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .analysis-list li::before { content: ""; display: inline-block; flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin-top: 8px; }

  .product-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(44,74,46,0.06);
  }
  .product-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .product-tag  { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
  .product-reason-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .product-reason-txt { font-size: 13px; line-height: 1.6; padding-left: 12px; border-left: 2.5px solid var(--gold); margin-bottom: 16px; }
  .product-benefits { list-style: none; margin-bottom: 18px; }
  .product-benefits li { font-size: 13px; color: var(--muted); padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .product-benefits li::before { content: ""; display: inline-block; flex-shrink: 0; width: 3px; height: 3px; border-radius: 50%; background: #c8bfb2; margin-top: 9px; }
  .product-links { display: flex; gap: 8px; margin-bottom: 10px; }
  .product-links a { flex: 1; padding: 10px; text-align: center; border-radius: 9px; font-size: 12px; font-weight: 700; text-decoration: none; letter-spacing: .3px; }
  .link-wb   { background: rgba(203,17,171,.08); color: #b050a0; border: 1px solid rgba(203,17,171,.18); }
  .link-ozon { background: rgba(0,91,255,.07); color: #4070e0; border: 1px solid rgba(0,91,255,.18); }
  .btn-course {
    width: 100%; padding: 11px; background: transparent;
    border: 1.5px solid rgba(44,74,46,0.18); border-radius: 9px;
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: all .18s;
  }
  .btn-course.added { background: linear-gradient(135deg, #eef5ee, #f7f3ed); border-color: var(--green2); color: var(--green); }

  /* Tracker list */
  .course-item {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 10px rgba(44,74,46,0.04);
  }
  .course-check {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .course-check.done { background: linear-gradient(135deg, var(--green), var(--green2)); border-color: transparent; color: #f7f3ed; box-shadow: 0 3px 10px rgba(44,74,46,0.2); }
  .course-info { flex: 1; }
  .course-name   { font-size: 14px; font-weight: 600; }
  .course-streak { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .course-del { background: none; border: none; color: #c0b4a4; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

  /* ══ ДНЕВНИК ════════════════════════════════════════════════════════════════ */

  /* ── Check-in (charge) ── */
  .checkin-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 22px; margin-bottom: 12px;
    box-shadow: 0 6px 24px rgba(44,74,46,0.18);
  }
  .checkin-card .label { color: rgba(247,243,237,0.55); margin-bottom: 8px; }
  .charge-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 24px; color: #f7f3ed; line-height: 1.2; margin-bottom: 6px; }
  .charge-sub { font-size: 12px; color: rgba(247,243,237,0.52); margin-bottom: 26px; line-height: 1.55; }
  .charge-dots { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .charge-dot { border-radius: 50%; background: rgba(247,243,237,0.13); cursor: pointer; transition: all .18s; flex-shrink: 0; }
  .charge-dot.d1 { width: 26px; height: 26px; }
  .charge-dot.d2 { width: 34px; height: 34px; }
  .charge-dot.d3 { width: 42px; height: 42px; }
  .charge-dot.d4 { width: 50px; height: 50px; }
  .charge-dot.d5 { width: 58px; height: 58px; }
  .charge-dot.lit { background: rgba(247,243,237,0.65); }
  .charge-dot.lit.d4 { background: rgba(247,243,237,0.82); }
  .charge-dot.lit.d5 { background: #f7f3ed; box-shadow: 0 0 16px rgba(247,243,237,0.32); }
  .charge-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: rgba(247,243,237,0.48); text-align: center; margin-bottom: 18px; min-height: 14px; transition: opacity .2s; }
  .charge-done-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .charge-done-text { font-family: 'DM Serif Display', Georgia, serif; font-size: 22px; color: #f7f3ed; }
  .checkin-edit-btn { font-size: 11px; color: rgba(247,243,237,0.55); background: none; border: none; cursor: pointer; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; margin-top: 14px; display: block; }

  /* ── Supplement timeline ── */
  .suppl-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .suppl-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .suppl-day-lbl { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .suppl-phasebar { position: relative; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(44,74,46,0.08); margin-bottom: 6px; }
  .suppl-dates { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin-bottom: 10px; }
  .suppl-status { font-size: 12px; color: var(--text); line-height: 1.55; padding: 10px 12px; background: rgba(44,74,46,0.05); border-radius: 8px; border-left: 2px solid var(--green2); }
  .suppl-badge { font-size: 10px; font-weight: 700; border-radius: 99px; padding: 4px 10px; }

  /* ── Insight card ── */
  .insight-card { background: linear-gradient(135deg, #1e3a20 0%, var(--green) 100%); border-radius: var(--radius); padding: 20px; margin-bottom: 10px; color: #f7f3ed; }
  .insight-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(247,243,237,0.45); margin-bottom: 8px; }
  .insight-heading { font-family: 'DM Serif Display', Georgia, serif; font-size: 22px; line-height: 1.25; margin-bottom: 4px; }
  .insight-sub { font-size: 12px; color: rgba(247,243,237,0.6); line-height: 1.55; margin-bottom: 14px; }
  .insight-nums { display: flex; align-items: center; gap: 16px; }
  .insight-num-block { text-align: center; }
  .insight-num-val { font-family: 'DM Serif Display', Georgia, serif; font-size: 36px; line-height: 1; }
  .insight-num-lbl { font-size: 9px; color: rgba(247,243,237,0.45); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-top: 4px; }
  .insight-arr { font-size: 20px; color: rgba(247,243,237,0.3); }
  .insight-note { font-size: 11px; color: rgba(247,243,237,0.55); margin-top: 12px; line-height: 1.55; }

  /* ── Food log ── */
  .food-cam-btn {
    width: 100%; padding: 14px; border-radius: var(--radius);
    border: 1.5px dashed rgba(44,74,46,0.25); background: none;
    cursor: pointer; color: var(--green); font-size: 13px; font-weight: 700;

<script>
const tg = window.Telegram?.WebApp || { ready(){}, expand(){}, initData: "", initDataUnsafe: {} };
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── PWA install ────────────────────────────────────────────────────────────

function updateManifest(token) {
  const el = document.querySelector('link[rel="manifest"]');
  if (el && token) el.href = `/manifest.json?t=${encodeURIComponent(token)}`;
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

async function installPWA() {
  // Вариант 1: нативный Chrome промпт (Android Chrome вне Telegram)
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-pwa-card')?.remove();
    return;
  }

  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const isInTelegram = !!initData;

  // Строим ссылку с токеном — чтобы браузер/PWA узнал тот же аккаунт
  const token = localStorage.getItem("biolar_token");
  const installUrl = token ? `${location.origin}/?t=${token}` : location.origin;

  let msg = '';
  if (isInTelegram) {
    msg = `Скопируй эту ссылку и открой в браузере (Safari или Chrome):\n\n${installUrl}\n\nЗатем нажми меню браузера → "Добавить на главный экран". Войдёшь как тот же пользователь.`;
  } else if (isIOS) {
    msg = 'Нажми кнопку Поделиться (квадрат со стрелкой вверх) внизу Safari, затем выбери "На экран «Домой»"';
  } else {
    msg = 'Нажми ⋮ в правом верхнем углу браузера, затем "Добавить на главный экран" или "Установить приложение"';
  }

  showInstallModal(msg, isInTelegram ? installUrl : null);
}

function showInstallModal(msg, link) {
  const existing = document.getElementById('install-modal');
  if (existing) existing.remove();

  const lines = msg.split('\n').map(l => l ? `<div>${l}</div>` : '<div style="height:6px"></div>').join('');
  const linkHtml = link ? `<button class="btn" style="margin-top:12px;width:100%" onclick="navigator.clipboard?.writeText('${link}').then(()=>toast('Ссылка скопирована'));return false;">Скопировать ссылку</button>` : '';

  const el = document.createElement('div');
  el.id = 'install-modal';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:flex-end;padding:16px';
  el.innerHTML = `
    <div style="background:#fff;border-radius:20px;padding:24px;width:100%;box-sizing:border-box">
      <div style="font-weight:700;font-size:17px;margin-bottom:14px">Как установить приложение</div>
      <div style="font-size:14px;line-height:1.6;color:#333">${lines}</div>
      ${linkHtml}
      <button class="btn outline" style="margin-top:10px;width:100%" onclick="document.getElementById('install-modal').remove()">Закрыть</button>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
}

// ── Auth ───────────────────────────────────────────────────────────────────

function authHeaders() {
  if (initData) return { "X-Telegram-Init-Data": initData };
  const token = localStorage.getItem("biolar_token");
  if (token) return { "X-Session-Token": token };
  return {};
}

// ── Utils ──────────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...authHeaders() },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status}: ${txt}`);
  }
  return r.json();
}

function toast(msg, ms = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "home")    loadHome();
  if (name === "program") loadProgram();
  if (name === "diary")   loadDiary();
  if (name === "ai")      loadAI();
  if (name === "club")    loadClub();
}

const urlParams = new URLSearchParams(location.search);

// Если пришли по ссылке из Telegram с токеном — сохраняем и чистим URL
const installToken = urlParams.get("t");
if (installToken) {
  localStorage.setItem("biolar_token", installToken);
  updateManifest(installToken);
  history.replaceState({}, "", location.pathname);
}

// Если токен уже был в localStorage — тоже обновляем манифест сразу
const existingToken = localStorage.getItem("biolar_token");
if (existingToken) updateManifest(existingToken);

const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;
api("POST", "/api/user/init", { ref }).then(d => {
  if (d.session_token) {
    localStorage.setItem("biolar_token", d.session_token);
    updateManifest(d.session_token);
  }
}).catch(() => {});

async function openCatalogSheet() {
  const trackerData = await api("GET", "/api/tracker");
  const addedIds = new Set((trackerData.products || []).map(p => p.product_id));

  const overlay = document.createElement("div");
  overlay.className = "catalog-sheet-overlay";
  overlay.id = "catalog-overlay";
  overlay.onclick = e => { if (e.target === overlay) closeCatalogSheet(); };

  overlay.innerHTML = `
    <div class="catalog-sheet">
      <div class="catalog-sheet-handle"></div>
      <div class="catalog-sheet-head">
        <div class="serif" style="font-size:18px">Каталог продуктов</div>
        <button onclick="closeCatalogSheet()" style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1">×</button>
      </div>
      <input class="catalog-search" id="catalog-search" placeholder="Поиск продукта..." type="text" oninput="filterCatalog(this.value,'${[...addedIds].join(',')}')">
      <div class="catalog-list" id="catalog-list">
        ${renderCatalogItems(CATALOG, addedIds)}
      </div>
    </div>`;

  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById("catalog-search")?.focus(), 100);
}

function renderCatalogItems(items, addedIds) {
  return items.map(p => {
    const isAdded = addedIds.has(p.id);
    return `
      <div class="catalog-item" onclick="${isAdded ? '' : `addProductFromCatalog('${p.id}',this)`}">
        <div class="catalog-item-emoji">${p.emoji}</div>
        <div class="catalog-item-info">
          <div class="catalog-item-name" style="${isAdded ? 'color:var(--muted)' : ''}">${p.name}</div>
          <div class="catalog-item-tagline">${p.tagline}</div>
        </div>
        <div class="catalog-item-add ${isAdded ? 'added' : 'available'}">${isAdded ? '✓' : '+'}</div>
      </div>`;
  }).join('');
}

function filterCatalog(query, addedStr) {
  const addedIds = new Set(addedStr ? addedStr.split(',') : []);
  const q = query.toLowerCase().trim();
  const filtered = q ? CATALOG.filter(p => p.name.toLowerCase().includes(q) || p.tagline.toLowerCase().includes(q)) : CATALOG;
  const list = document.getElementById("catalog-list");
  if (list) list.innerHTML = renderCatalogItems(filtered, addedIds);
}

async function addProductFromCatalog(productId, el) {
  el.querySelector('.catalog-item-add').textContent = '...';
  try {
    await api("POST", "/api/tracker/add", { product_id: productId });
    el.querySelector('.catalog-item-add').className = 'catalog-item-add added';
    el.querySelector('.catalog-item-add').textContent = '✓';
    el.querySelector('.catalog-item-name').style.color = 'var(--muted)';
    el.onclick = null;
    toast("Добавлено в курс");
    // обновляем строку addedIds в поиске
    const search = document.getElementById("catalog-search");
    if (search) {
      const cur = search.getAttribute("oninput") || '';
      const match = cur.match(/'([^']*)'\)/);
      if (match) {
        const ids = match[1] ? match[1].split(',') : [];
        ids.push(productId);
        search.setAttribute("oninput", `filterCatalog(this.value,'${ids.join(',')}')`);
      }
    }
  } catch(e) {
    el.querySelector('.catalog-item-add').textContent = '+';
    toast("Ошибка: " + e.message);
  }
}

function closeCatalogSheet() {
  const overlay = document.getElementById("catalog-overlay");
  if (overlay) overlay.remove();
  loadProgram();
}

      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             onclick="selectCard('${step.id}','${o.id}',this)">${o.text}</div>`).join("") + `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chips">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}',this)">${o.text}</div>`).join("") +
      `</div><button class="btn" onclick="advanceQuiz()">Продолжить</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-row">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}',${o.id},this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-lbl">${o.label}</div>
        </div>`).join("") + `</div>`;
  }

  const backBtn = quizStepIdx > 0
    ? `<button class="back-btn" onclick="backQuiz()">← Назад</button>`
    : `<button class="back-btn" onclick="loadProgram()">← Назад</button>`;

  document.getElementById("screen-program").innerHTML = `
    <div class="quiz-head">
      <span class="label">Анализ</span>
      <span class="quiz-counter">${String(current).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
    </div>
    <div class="quiz-prog-wrap"><div class="quiz-prog-bar" style="width:${pct}%"></div></div>
    <div class="quiz-q">${step.title}</div>
    ${body}
    ${backBtn}
  `;
}

function selectCard(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".quiz-grid").querySelectorAll(".quiz-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 220);
}
function toggleChip(id, el) {
  if (quizSymptoms.has(id)) { quizSymptoms.delete(id); el.classList.remove("selected"); }
  else                       { quizSymptoms.add(id);    el.classList.add("selected"); }
}
function selectScale(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".scale-row").querySelectorAll(".scale-seg").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 270);
}
function advanceQuiz() {
  const step = quizActiveSteps[quizStepIdx];
  if (step.type !== "multiselect" && !quizAnswers[step.id]) { toast("Выбери один из вариантов"); return; }
  quizStepIdx++;
  quizActiveSteps = getActiveSteps();
  if (quizStepIdx >= quizActiveSteps.length) showSmartResults();
  else renderQuiz();
}
function backQuiz() { if (quizStepIdx > 0) { quizStepIdx--; renderQuiz(); } }

async function showSmartResults() {
  const screen = document.getElementById("screen-program");
  screen.innerHTML = '<div class="spinner"></div>';

  const payload = {
    gender: quizAnswers.gender || "female", age: quizAnswers.age || "26-35",
    goal: quizAnswers.goal || "energy", symptoms: [...quizSymptoms],
    stress: quizAnswers.stress || 1, sleep_q: quizAnswers.sleep_q || 4,
    diet: quizAnswers.diet || "balanced", women_health: quizAnswers.women_health || null,
  };

  const data = await api("POST", "/api/quiz/smart-result", payload);
  const products = data.products || [], analysis = data.analysis || [];

  const analysisHtml = analysis.length ? `
    <div class="analysis-block">
      <span class="label" style="color:var(--green)">Что мы выявили</span>
      <ul class="analysis-list" style="margin-top:10px">${analysis.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>` : "";

  const productsHtml = products.map(p => {
    const benefits = (p.benefits || []).map(b => `<li>${b}</li>`).join("");
    const added = addedToTracker.has(p.id);
    return `
      <div class="product-card">
        <div class="product-name">${p.name}</div>
        <div class="product-tag">${p.tagline}</div>
        <div class="product-reason-lbl">Почему тебе это нужно</div>
        <div class="product-reason-txt">${p.reason}</div>
        <ul class="product-benefits">${benefits}</ul>
        <div class="product-links">
          <a class="link-wb" href="${p.wb_url}" target="_blank">Wildberries</a>
          <a class="link-ozon" href="${p.ozon_url}" target="_blank">Ozon</a>
        </div>
        <button class="btn-course ${added ? 'added' : ''}" id="add-btn-${p.id}" onclick="addToTracker('${p.id}')">
          ${added ? "Добавлено в курс" : "+ Добавить в курс"}
        </button>
      </div>`;
  }).join("");

  screen.innerHTML = `
    <div class="results-hero">
      <span class="label">Персональный анализ</span>
      <div class="results-hero-title">Твоя программа<br>готова.</div>
    </div>
    ${analysisHtml}
    ${productsHtml}
    <button class="btn outline" onclick="loadProgram()" style="margin-top:8px">← Вернуться в программу</button>
  `;
}

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "Добавлено в курс"; btn.classList.add("added"); }
  toast("Добавлено в курс");
}

async function logIntake(productId, btn) {
  if (btn.classList.contains("done")) { toast("Уже отмечено сегодня"); return; }
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) { toast("Уже отмечено сегодня"); return; }
  btn.classList.add("done"); btn.textContent = "✓";
  const s = data.streak;
  const row = btn.closest(".course-item");
  if (row) row.querySelector(".course-streak").textContent = `${s} ${s===1?'день':s<5?'дня':'дней'} подряд`;
  toast("Отмечено");
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено из курса");
}

    { max: Infinity, label: "Полный курс",color: "var(--green)",   border: "rgba(44,74,46,0.2)",         text: "Полный курс пройден. Сравни свой заряд в начале и сейчас — видна разница?" },
  ];
  const s = STATUSES.find(x => days <= x.max) || STATUSES[STATUSES.length - 1];

  return `
    <div class="suppl-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div class="suppl-name">${product.product_name}</div>

      </div>
      <div class="suppl-phasebar">
        <div style="position:absolute;left:0;top:0;height:100%;width:47%;background:#d0cabc"></div>
        <div style="position:absolute;left:47%;top:0;height:100%;width:23%;background:var(--gold2,#e8c87a)"></div>
        <div style="position:absolute;left:70%;top:0;height:100%;width:30%;background:var(--green2)"></div>
        <div style="position:absolute;left:0;top:0;height:100%;width:${pct}%;background:rgba(0,0,0,0.18)"></div>
        <div style="position:absolute;left:${dotPct}%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;background:#fff;border-radius:50%;border:2px solid rgba(44,74,46,0.6);box-shadow:0 1px 4px rgba(0,0,0,0.2)"></div>

}

function buildInsight(history, daysInCourse) {
  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  if (history.length < 7) {
    const left = Math.max(0, 7 - history.length);
    return `
      <div class="card" style="text-align:center;padding:20px;margin-bottom:10px">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">Пока нет данных для инсайта</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">Ещё ${left} ${left===1?'день':left<5?'дня':'дней'} — и появится твой первый<br>персональный прогресс-инсайт</div>
      </div>`;
  }
  const chron   = [...history].reverse();
  const w1      = chron.slice(0, 7).map(getCharge);
  const wLast   = chron.slice(-7).map(getCharge);
  const avg1    = (w1.reduce((a,b) => a+b, 0) / w1.length).toFixed(1);
  const avgNow  = (wLast.reduce((a,b) => a+b, 0) / wLast.length).toFixed(1);
  const diff    = (parseFloat(avgNow) - parseFloat(avg1)).toFixed(1);
  const up      = parseFloat(diff) > 0.2;
  const flat    = Math.abs(parseFloat(diff)) <= 0.2;

  return `
    <div class="insight-card">
      <div class="insight-eyebrow">Прогресс · ${daysInCourse} дней курса</div>
      <div class="insight-heading">${up ? 'Заряд растёт' : flat ? 'Стабильный заряд' : 'Продолжаем курс'}</div>
      <div class="insight-sub">${up
        ? `За ${daysInCourse} дней средний заряд вырос на ${diff} п.`
        : flat
          ? 'Твой уровень стабилен — накопительный эффект продолжается'
          : 'Добавки работают накопительно — первый эффект появится на 3-4 неделе'
      }</div>
      <div class="insight-nums">
        <div class="insight-num-block">
          <div class="insight-num-val">${avg1}</div>
          <div class="insight-num-lbl">Начало</div>
        </div>
        <div class="insight-arr">→</div>
        <div class="insight-num-block">
          <div class="insight-num-val">${avgNow}</div>
          <div class="insight-num-lbl">Сейчас</div>
        </div>
      </div>
    </div>`;
}

function buildTrend30(history, courseStart) {
  if (!history.length) {
    return `<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0;line-height:1.7">Начни фиксировать заряд каждый день —<br>здесь появится твой тренд</div>`;
  }
  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  const chron = [...history].reverse(); // oldest → newest

  const bars = chron.map(e => {
    const c = getCharge(e);
    const h = Math.round((c / 5) * 58) + 4;
    return `<div class="tb c${c}" style="height:${h}px" title="${e.date}: ${c}/5"></div>`;
  });

  return `<div class="trend30-bars">${bars.join("")}</div>`;
}

function buildChat() {
  const msgsHtml = CHAT_MESSAGES.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-bubble">${m.text}</div>
    </div>`).join("");

  return `

      <span style="font-size:16px;flex-shrink:0">🔧</span>
      <span>Функция в разработке — скоро AI ответит на любой вопрос о нутриентах</span>
    </div>
    <div class="chat-suggestions">
      <div class="chat-sug" onclick="sendChat(this.textContent)">Можно совмещать D3 и магний?</div>
      <div class="chat-sug" onclick="sendChat(this.textContent)">У меня ферритин 12, что делать?</div>
      <div class="chat-sug" onclick="sendChat(this.textContent)">Как принимать железо правильно?</div>
    </div>
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-msgs">${msgsHtml}</div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" placeholder="Спроси о нутриентах..." type="text">
        <button class="chat-send" onclick="sendChatFromInput()">→</button>
      </div>
    </div>`;
}

function bindChat() {
  const inp = document.getElementById("chat-input");
  if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") sendChatFromInput(); });
}

async function sendChatFromInput() {
  const inp = document.getElementById("chat-input");
  if (!inp || !inp.value.trim()) return;
  await sendChat(inp.value.trim());
  inp.value = "";
}

async function sendChat(text) {
  const msgs = document.getElementById("chat-msgs");
  if (!msgs) return;
  msgs.insertAdjacentHTML("beforeend", `<div class="msg user"><div class="msg-bubble">${text}</div></div>`);
  msgs.scrollTop = msgs.scrollHeight;

  const data = await api("POST", "/api/ai/chat", { message: text });
  msgs.insertAdjacentHTML("beforeend", `<div class="msg bot"><div class="msg-bubble">${data.message}</div></div>`);
  msgs.scrollTop = msgs.scrollHeight;
  CHAT_MESSAGES.push({ role:"user", text }, { role:"bot", text: data.message });
}

  { role:"bot", text:"Привет! Я Биа — твой личный архитектор здоровья. Помогу выстроить систему: разберём дефициты, подберём протокол, расскажу как всё работает в связке. Спрашивай." }
];
let aiLoaded = false;

const AI_SUGGESTIONS = [
  "Можно совмещать D3 и магний?",
  "У меня ферритин 12, что делать?",
  "Как правильно принимать железо?",
  "Какие витамины нужны зимой?",
  "Когда лучше пить омега-3?",
  "Чем отличается цитрат от оксида магния?",
];

function loadAI() {
  const screen = document.getElementById("screen-ai");
  if (aiLoaded) return; // не перерисовывать — чат уже там
  aiLoaded = true;

  const msgsHtml = AI_MESSAGES.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-bubble">${m.text}</div>
    </div>`).join("");

  const suggestHtml = AI_SUGGESTIONS.map(s =>
    `<div class="chat-sug" onclick="sendAI(this.textContent)">${s}</div>`
  ).join("");

  screen.innerHTML = `
    <div style="flex-shrink:0;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">✦</div>
      <div>
        <div class="serif" style="font-size:22px;letter-spacing:-.2px;line-height:1.1">Биа</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Личный архитектор здоровья</div>
      </div>
    </div>

    <div id="ai-msgs" style="flex:1;overflow-y:auto;padding-bottom:8px">${msgsHtml}</div>

    <div class="chat-input-row" style="flex-shrink:0;padding:8px 0 4px;background:var(--bg)">
      <input class="chat-input" id="ai-input" placeholder="Напиши Биа..." type="text">
      <button class="chat-send" onclick="sendAIFromInput()">→</button>
    </div>
  `;

  const inp = document.getElementById("ai-input");
  if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") sendAIFromInput(); });
}

async function sendAIFromInput() {
  const inp = document.getElementById("ai-input");
  if (!inp || !inp.value.trim()) return;
  const text = inp.value.trim();
  inp.value = "";
  await sendAI(text);
}

async function sendAI(text) {
  const msgs = document.getElementById("ai-msgs");
  if (!msgs) return;

  // Показать вопрос пользователя
  msgs.insertAdjacentHTML("beforeend",
    `<div class="msg user"><div class="msg-bubble">${text}</div></div>`
  );
  msgs.scrollIntoView({ behavior: "smooth", block: "end" });

  // Показать индикатор набора
  const typingId = "ai-typing-" + Date.now();
  msgs.insertAdjacentHTML("beforeend",
    `<div class="msg bot" id="${typingId}"><div class="msg-bubble" style="color:var(--muted)">...</div></div>`
  );

  const data = await api("POST", "/api/ai/chat", { message: text });

  // Заменить точки на ответ
  const typingEl = document.getElementById(typingId);
  if (typingEl) typingEl.querySelector(".msg-bubble").textContent = data.message;

  AI_MESSAGES.push({ role:"user", text }, { role:"bot", text: data.message });

  // Скрыть саджесты после первого вопроса
  const sugsEl = document.getElementById("ai-sugs");
  if (sugsEl) sugsEl.style.display = "none";
}

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let calMonth = null; // "2026-06"
let calSel   = null; // "2026-06-14"

async function initCalendar() {
  if (!calMonth) {
    const now = new Date();
    calMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  await loadCalendar();
}

async function loadCalendar() {
  const lbl = document.getElementById("cal-month-lbl");
  const wrap = document.getElementById("cal-grid-wrap");
  if (!lbl || !wrap) return;

  const [y, m] = calMonth.split('-').map(Number);
  lbl.textContent = `${MONTHS_RU[m-1]} ${y}`;

  try {
    const data = await api("GET", `/api/diary/food/month?month=${calMonth}`);
    renderCalGrid(y, m, data.days || {});
  } catch(e) {
    console.error("Calendar load error:", e);
    if (wrap) wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0">Ошибка: ${e.message}</div>`;
  }
}

function renderCalGrid(year, mon, days) {
  const wrap = document.getElementById("cal-grid-wrap");
  if (!wrap) return;

  const daysInMonth = new Date(year, mon, 0).getDate();
  const firstDow    = (new Date(year, mon - 1, 1).getDay() + 6) % 7; // Mon=0
  const today       = new Date().toISOString().slice(0, 10);

  const calColor = cal => {
    if (!cal) return 'c0';
    if (cal < 500)  return 'c1';
    if (cal < 1000) return 'c2';
    if (cal < 1500) return 'c3';
    if (cal < 2000) return 'c4';
    return 'c5';
  };

  let cells = Array(firstDow).fill('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const ds  = `${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cal = days[ds]?.calories || 0;
    const cls = [
      'cal-cell', calColor(cal),
      ds === today  ? 'is-today' : '',
      ds === calSel ? 'is-sel'   : '',
    ].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" data-date="${ds}" onclick="selectCalDay('${ds}')">${d}</div>`);
  }

  wrap.innerHTML = `<div class="cal-grid">${cells.join('')}</div>`;
}

async function selectCalDay(ds) {
  calSel = ds;
  // обновить визуальный выбор
  document.querySelectorAll('.cal-cell[data-date]').forEach(el => {
    el.classList.toggle('is-sel', el.dataset.date === ds);
  });

  const detail = document.getElementById("cal-day-detail");
  if (!detail) return;
  detail.innerHTML = `<div style="padding:10px 0;color:var(--muted);font-size:12px">Загружаю...</div>`;

  const data = await api("GET", `/api/diary/food?date=${ds}`);
  const logs = data.logs || [];
  const d    = new Date(ds + 'T12:00:00');
  const lbl  = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });

  if (!logs.length) {
    detail.innerHTML = `<div class="cal-day-detail"><div class="cal-day-title">${lbl}</div><div style="font-size:12px;color:var(--muted)">Нет записей</div></div>`;
    return;
  }

  const t = logs.reduce((a,l) => ({cal:a.cal+l.calories,p:a.p+l.protein,f:a.f+l.fat,c:a.c+l.carbs}),{cal:0,p:0,f:0,c:0});
  const items = logs.map(l => `
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600">${l.food_name}</div>
      <div style="font-size:12px;color:var(--muted);flex-shrink:0;margin-left:8px">${l.calories} ккал</div>
    </div>`).join('');

  detail.innerHTML = `
    <div class="cal-day-detail">
      <div class="cal-day-title">${lbl}</div>
      ${items}
      <div class="food-total" style="margin-top:10px">
        <div class="food-total-item"><div class="food-total-val">${Math.round(t.cal)}</div><div class="food-total-lbl">ккал</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.p.toFixed(1)}г</div><div class="food-total-lbl">белки</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.f.toFixed(1)}г</div><div class="food-total-lbl">жиры</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.c.toFixed(1)}г</div><div class="food-total-lbl">углев.</div></div>
      </div>
    </div>`;
}

function calChangeMonth(dir) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + dir, 1);
  const nm = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if (nm > new Date().toISOString().slice(0,7)) return; // не в будущее
  calMonth = nm;
  calSel = null;
  document.getElementById("cal-day-detail").innerHTML = "";
  loadCalendar();
}

async function onFoodPhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const previewWrap = document.getElementById("food-preview-wrap");
  const previewImg  = document.getElementById("food-preview-img");
  if (previewWrap && previewImg) {
    previewImg.src = URL.createObjectURL(file);
    previewWrap.style.display = "block";
  }

  const resultDiv = document.getElementById("food-result");
  if (resultDiv) resultDiv.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">Определяю блюдо...</div>`;

  try {
    const b64 = await compressImage(file);
    const data = await api("POST", "/api/diary/food/analyze", { image_b64: b64 });
    foodPending = data;
    if (resultDiv) resultDiv.innerHTML = buildFoodResult(data);
  } catch (e) {
    const msg = e?.message || String(e);
    if (resultDiv) resultDiv.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:8px 0">Ошибка: ${msg}</div>`;
  }
}

function buildFoodResult(data) {
  return `
    <div style="margin-top:12px">
      <div style="font-size:15px;font-weight:700;margin-bottom:10px">${data.food}</div>
      <div class="kbju-row">
        <div class="kbju-item"><div class="kbju-val">${data.calories}</div><div class="kbju-lbl">ккал</div></div>
        <div class="kbju-item"><div class="kbju-val">${data.protein}г</div><div class="kbju-lbl">белки</div></div>

}

async function saveFoodLog() {
  if (!foodPending) return;
  try {
    await api("POST", "/api/diary/food/save", {
      food_name: foodPending.food,
      calories:  foodPending.calories,
      protein:   foodPending.protein,
      fat:       foodPending.fat,
      carbs:     foodPending.carbs,
    });
    foodPending = null;
    toast("Сохранено");
    await loadDiary();
  } catch(e) {
    toast("Ошибка сохранения: " + e.message);
  }
}

async function deleteFoodLog(id) {
  await api("POST", "/api/diary/food/delete", { log_id: id });
  await loadDiary();
}

async function compressImage(file, maxWidth = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75).split(",")[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let waterGlassesCurrent = 0;
const WATER_GOAL = 8;

const WATER_R = 70;
const WATER_C = +(2 * Math.PI * WATER_R).toFixed(2); // 439.82

function _waterRingSVG(glasses) {
  const offset = +(WATER_C * (1 - glasses / WATER_GOAL)).toFixed(2);
  return `<svg viewBox="0 0 180 180" width="160" height="160">
    <defs>
      <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5bb8f0"/>
        <stop offset="100%" stop-color="#2178b4"/>
      </linearGradient>
    </defs>
    <circle cx="90" cy="90" r="${WATER_R}" fill="none" stroke="rgba(74,159,207,.13)" stroke-width="13"/>
    <circle id="water-arc" cx="90" cy="90" r="${WATER_R}" fill="none" stroke="url(#wg)" stroke-width="13"
      stroke-linecap="round"
      stroke-dasharray="${WATER_C}"
      stroke-dashoffset="${offset}"
      transform="rotate(-90 90 90)"
      style="transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function buildWaterTracker(glasses) {
  waterGlassesCurrent = glasses;
  return `
    <div class="card" style="margin-bottom:10px">
      <span class="label">Вода</span>
      <div class="water-ring-wrap">
        <div class="water-ring-inner">
          <div id="water-ring-svg">${_waterRingSVG(glasses)}</div>
          <div class="water-ring-center">
            <div style="font-size:16px;margin-bottom:2px">💧</div>
            <div class="water-ring-num" id="water-num">${glasses}</div>
            <div class="water-ring-sub">из ${WATER_GOAL} стаканов</div>
          </div>
        </div>
      </div>
      <button class="btn" style="width:100%" id="water-add-btn" onclick="adjustWater(1)">+ Выпил стакан</button>
    </div>`;
}

function _refreshWaterUI(prevGlasses) {
  const offset = +(WATER_C * (1 - waterGlassesCurrent / WATER_GOAL)).toFixed(2);
  const arc  = document.getElementById("water-arc");
  const num  = document.getElementById("water-num");
  const ring = document.getElementById("water-ring-svg");
  const btn  = document.getElementById("water-add-btn");
  if (arc) arc.setAttribute("stroke-dashoffset", offset);
  if (num) num.textContent = waterGlassesCurrent;
  if (btn) btn.disabled = waterGlassesCurrent >= WATER_GOAL;
  if (ring && waterGlassesCurrent === WATER_GOAL && prevGlasses < WATER_GOAL) {
    ring.classList.remove("water-ring-complete");
    void ring.offsetWidth; // reflow чтобы анимация перезапустилась
    ring.classList.add("water-ring-complete");
  }
}

async function adjustWater(delta) {
  if (waterGlassesCurrent >= WATER_GOAL && delta > 0) return;
  const prev = waterGlassesCurrent;
  waterGlassesCurrent = Math.max(0, Math.min(WATER_GOAL, waterGlassesCurrent + delta));
  _refreshWaterUI(prev);
  try {
    await api("POST", "/api/diary/water/set", { glasses: waterGlassesCurrent });
  } catch(e) { console.error("water save error:", e); }
}

function openGoalsModal(cal, p, f, c) {
  const existing = document.getElementById("goals-modal");
  if (existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "goals-modal";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:flex-end";
  modal.innerHTML = `
    <div style="background:var(--bg);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;margin:0 auto">
      <div class="serif" style="font-size:20px;margin-bottom:16px">Цели на день</div>
      ${[
        {id:'g-cal', label:'Калории (ккал)', val: cal, step: 50, min: 500 },
        {id:'g-p',   label:'Белки (г)',      val: p,   step: 5,  min: 10  },
        {id:'g-f',   label:'Жиры (г)',       val: f,   step: 5,  min: 10  },
        {id:'g-c',   label:'Углеводы (г)',   val: c,   step: 10, min: 20  },
      ].map(r => `
        <div style="margin-bottom:14px">
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">${r.label}</div>
          <input id="${r.id}" type="number" value="${r.val}" step="${r.step}" min="${r.min}"
                 style="width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;box-sizing:border-box">
        </div>`).join('')}
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn" style="flex:1" onclick="saveGoals()">Сохранить</button>
        <button class="btn" style="flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--border)"
                onclick="document.getElementById('goals-modal').remove()">Отмена</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
}

async function saveGoals() {
  const cal = parseInt(document.getElementById("g-cal")?.value) || 2000;
  const p   = parseFloat(document.getElementById("g-p")?.value)  || 80;
  const f   = parseFloat(document.getElementById("g-f")?.value)  || 70;
  const c   = parseFloat(document.getElementById("g-c")?.value)  || 250;
  try {
    await api("POST", "/api/diary/goals", { calories: cal, protein: p, fat: f, carbs: c });

    toast("Цели сохранены");
    await loadDiary();
  } catch(e) { toast("Ошибка: " + e.message); }

// СРАВНЕНИЕ ДО/ПОСЛЕ
// ══════════════════════════════════════════════════════════════════════════

function buildComparison(history, daysInCourse) {
  if (!history.length || daysInCourse < 7) return "";

  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  const chron = [...history].reverse();

  const first7 = chron.slice(0, 7);
  const last7  = chron.slice(-7);

  const avgFirst = first7.reduce((s, e) => s + getCharge(e), 0) / first7.length;
  const avgLast  = last7.reduce((s,  e) => s + getCharge(e), 0) / last7.length;
  const delta    = avgLast - avgFirst;
  const deltaStr = delta >= 0 ? `+${delta.toFixed(1)}` : delta.toFixed(1);
  const deltaColor = delta >= 0 ? "var(--green)" : "#e07070";

  const bar = (val) => {
    const pct = Math.round((val / 5) * 100);
    return `<div style="background:var(--card);border-radius:6px;height:8px;margin-top:6px">
      <div style="background:var(--green);border-radius:6px;height:8px;width:${pct}%"></div></div>`;
  };

  return `
    <div class="card" style="margin-bottom:10px">
      <span class="label">До и после</span>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px">
        <div style="text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">НАЧАЛО</div>
          <div style="font-size:32px;font-weight:700;color:var(--text)">${avgFirst.toFixed(1)}</div>
          <div style="font-size:11px;color:var(--muted)">заряд</div>
          ${bar(avgFirst)}
        </div>
        <div style="text-align:center;padding:0 4px">
          <div style="font-size:22px;font-weight:800;color:${deltaColor}">${deltaStr}</div>
          <div style="font-size:10px;color:var(--muted)">балла</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">СЕЙЧАС</div>
          <div style="font-size:32px;font-weight:700;color:${deltaColor}">${avgLast.toFixed(1)}</div>
          <div style="font-size:11px;color:var(--muted)">заряд</div>
          ${bar(avgLast)}
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">
        ${delta >= 0.5 ? '🚀 Виден прогресс — курс работает!' : delta >= 0 ? 'Стабильно — продолжай' : 'Есть куда расти — следи за сном и едой'}
      </div>
    </div>`;
}

async function loadReminderSettings() {
  try {
    const data = await api("GET", "/api/settings/reminder");
    const timeEl  = document.getElementById("rem-time");
    const trackEl = document.getElementById("rem-track");
    const thumbEl = document.getElementById("rem-thumb");
    const lblEl   = document.getElementById("rem-lbl");
    if (timeEl && data.reminder_time) timeEl.value = data.reminder_time;
    if (data.enabled) {
      trackEl?.classList.add("on");
      thumbEl?.classList.add("on");
      if (lblEl) lblEl.textContent = "Вкл";
    }
  } catch(e) { console.error("loadReminderSettings:", e); }
}

function toggleReminder(wrap) {
  const track = document.getElementById("rem-track");
  const thumb = document.getElementById("rem-thumb");
  const lbl   = document.getElementById("rem-lbl");
  const on = !track?.classList.contains("on");
  track?.classList.toggle("on", on);
  thumb?.classList.toggle("on", on);
  if (lbl) lbl.textContent = on ? "Вкл" : "Выкл";
}

async function saveReminder() {
  const time    = document.getElementById("rem-time")?.value || null;
  const enabled = document.getElementById("rem-track")?.classList.contains("on") || false;
  try {
    await api("POST", "/api/settings/reminder", { reminder_time: time, enabled });
    toast(enabled ? `Напоминание в ${time} включено` : "Напоминание выключено");
  } catch(e) { toast("Ошибка: " + e.message); }
}

async function claimChallenge(challengeId, btn) {
  if (btn.classList.contains("claimed") || btn.classList.contains("locked")) return;
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/club/challenge/claim", { challenge_id: challengeId });
  if (data.already_claimed) { btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено"; return; }
  if (!data.ok) { btn.disabled = false; btn.textContent = "Забрать"; return; }
  btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено";
  toast(`+${data.reward} баллов! Всего: ${data.new_total}`);
  // Update level card points
  const lvlPtsEl = document.querySelector(".level-pts strong");
  if (lvlPtsEl) lvlPtsEl.textContent = data.new_total;
}

async function joinGiveaway(btn) {
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/giveaway/join");
  const el = document.getElementById("giveCount");
  if (el) el.textContent = data.total_participants;
  const card = document.createElement("div");
  card.className = "card"; card.style.cssText = "text-align:center;padding:18px";
  card.innerHTML = `<div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Итоги в конце месяца. Удачи.</div>`;
  btn.replaceWith(card);
  toast("Ты в розыгрыше");
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована"));
}
