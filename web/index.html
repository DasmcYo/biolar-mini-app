<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:     #f7f3ed;
    --bg2:    #ede8df;
    --card:   #ffffff;
    --green:  #2c4a2e;
    --green2: #4a7c59;
    --gold:   #c4965a;
    --gold2:  #dab07a;
    --text:   #1c1c1a;
    --muted:  #8c8070;
    --border: rgba(44,74,46,0.1);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  }

  .serif { font-family: 'DM Serif Display', Georgia, serif; }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(247,243,237,0.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1; padding: 11px 4px 9px;
    font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: #c0b4a4; background: none; border: none; cursor: pointer;
    transition: color .15s; position: relative;
  }
  .nav-btn::before {
    content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 1.5px;
    background: linear-gradient(90deg, var(--green), var(--green2));
    opacity: 0; transition: opacity .2s;
  }
  .nav-btn.active { color: var(--green); }
  .nav-btn.active::before { opacity: 1; }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px 16px; animation: fadeIn .2s; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

  /* ── LABEL ── */
  .label {
    display: block;
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
  }

  /* ── BUTTONS ── */
  .btn {
    display: block; width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    color: #f7f3ed; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { opacity: .85; transform: scale(.99); }
  .btn.outline {
    background: transparent; color: var(--green);
    border: 1.5px solid rgba(44,74,46,0.25);
  }
  .btn + .btn { margin-top: 8px; }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px; margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(44,74,46,0.05);
  }

  /* ══════════════════════════════════════════
     WELCOME
  ══════════════════════════════════════════ */
  .welcome-wrap {
    margin: -20px -16px 0;
    padding: 52px 28px 44px;
    min-height: calc(100vh - 68px);
    display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(160deg, #f7f3ed 0%, #edf2ea 42%, #f5efe4 100%);
  }
  .welcome-brand {
    font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--green2); margin-bottom: 28px;
  }
  .welcome-h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 40px; line-height: 1.1; letter-spacing: -.5px;
    color: var(--text); margin-bottom: 20px;
  }
  .welcome-h1 em { font-style: italic; color: var(--green); }
  .welcome-sub {
    font-size: 15px; color: var(--muted); line-height: 1.75; margin-bottom: 44px;
  }
  .welcome-note {
    text-align: center; font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: #c0b4a4; margin-top: 14px;
  }

  /* ══════════════════════════════════════════
     QUIZ
  ══════════════════════════════════════════ */
  .quiz-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-counter {
    font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .quiz-prog-wrap {
    height: 2px; border-radius: 99px;
    background: rgba(196,150,90,0.2); margin-bottom: 32px; overflow: hidden;
  }
  .quiz-prog-bar {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 100%);
    transition: width .4s ease;
  }
  .quiz-q {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; line-height: 1.2; letter-spacing: -.2px;
    color: var(--text); margin-bottom: 24px;
  }

  /* Option cards */
  .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .quiz-card {
    position: relative;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 18px 14px;
    font-size: 14px; font-weight: 500; text-align: center;
    cursor: pointer; color: var(--text); line-height: 1.35;
    transition: all .18s; box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .quiz-card:active { transform: scale(.97); }
  .quiz-card.selected {
    background: linear-gradient(135deg, var(--green) 0%, #3d6b4a 100%);
    border-color: transparent; color: #f7f3ed;
    box-shadow: 0 4px 16px rgba(44,74,46,0.22);
  }
  .quiz-card.selected::after {
    content: "✓"; position: absolute; top: 9px; right: 11px;
    font-size: 10px; color: rgba(247,243,237,0.65); font-weight: 700;
  }

  /* Chips */
  .quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .quiz-chip {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 99px; padding: 9px 16px;
    font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all .18s;
    box-shadow: 0 1px 4px rgba(44,74,46,0.04);
  }
  .quiz-chip.selected {
    background: linear-gradient(135deg, var(--green), #3d6b4a);
    border-color: transparent; color: #f7f3ed;
  }

  /* Scale */
  .scale-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 13px 4px; text-align: center;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: all .18s; box-shadow: 0 1px 4px rgba(44,74,46,0.04);
  }
  .scale-seg.selected {
    background: linear-gradient(135deg, var(--green), #3d6b4a);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(44,74,46,0.2);
  }
  .scale-num { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: #f7f3ed; }
  .scale-lbl { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .scale-seg.selected .scale-lbl { color: rgba(247,243,237,0.7); }

  .quiz-back-btn {
    display: inline-flex; align-items: center;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 13px; padding: 0; margin-top: 16px;
  }

  /* ══════════════════════════════════════════
     RESULTS
  ══════════════════════════════════════════ */
  .results-hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 24px 22px; margin-bottom: 20px;
    box-shadow: 0 8px 28px rgba(44,74,46,0.2);
  }
  .results-hero .label { color: rgba(247,243,237,0.55); margin-bottom: 6px; }
  .results-hero-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px; color: #f7f3ed; line-height: 1.1; letter-spacing: -.3px;
  }

  .analysis-block {
    background: linear-gradient(135deg, #eef5ee 0%, #f7f3ed 100%);
    border: 1px solid rgba(44,74,46,0.1); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .analysis-block .label { color: var(--green); margin-bottom: 10px; }
  .analysis-list { list-style: none; }
  .analysis-list li {
    font-size: 13px; color: var(--text); padding: 3px 0;
    display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;
  }
  .analysis-list li::before {
    content: ""; display: inline-block; flex-shrink: 0;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--green); margin-top: 8px;
  }

  .product-card {
    background: linear-gradient(180deg, #ffffff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(44,74,46,0.06);
  }
  .product-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .product-tag  { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
  .product-reason-lbl {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .product-reason-txt {
    font-size: 13px; line-height: 1.6; color: var(--text);
    padding-left: 12px; border-left: 2.5px solid var(--gold);
    margin-bottom: 16px;
  }
  .product-benefits { list-style: none; margin-bottom: 18px; }
  .product-benefits li {
    font-size: 13px; color: var(--muted); padding: 3px 0;
    display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;
  }
  .product-benefits li::before {
    content: ""; display: inline-block; flex-shrink: 0;
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--bg2); margin-top: 9px;
  }
  .product-links { display: flex; gap: 8px; margin-bottom: 10px; }
  .product-links a {
    flex: 1; padding: 10px; text-align: center; border-radius: 9px;
    font-size: 12px; font-weight: 700; text-decoration: none; letter-spacing: .3px;
  }
  .link-wb   { background: rgba(203,17,171,.08); color: #b050a0; border: 1px solid rgba(203,17,171,.18); }
  .link-ozon { background: rgba(0,91,255,.07);   color: #4070e0; border: 1px solid rgba(0,91,255,.18); }
  .btn-course {
    width: 100%; padding: 11px;
    background: transparent; border: 1.5px solid rgba(44,74,46,0.18);
    border-radius: 9px; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: all .18s;
  }
  .btn-course.added {
    background: linear-gradient(135deg, #eef5ee, #f7f3ed);
    border-color: var(--green2); color: var(--green);
  }

  /* ══════════════════════════════════════════
     КУРС (TRACKER)
  ══════════════════════════════════════════ */
  .course-item {
    background: linear-gradient(180deg, #ffffff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 10px rgba(44,74,46,0.04);
  }
  .course-check {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .course-check.done {
    background: linear-gradient(135deg, var(--green), var(--green2));
    border-color: transparent; color: #f7f3ed;
    box-shadow: 0 3px 10px rgba(44,74,46,0.2);
  }
  .course-info { flex: 1; }
  .course-name   { font-size: 14px; font-weight: 600; }
  .course-streak { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .1px; }
  .course-del {
    background: none; border: none; color: #c0b4a4;
    font-size: 20px; cursor: pointer; padding: 4px; line-height: 1;
  }

  /* ══════════════════════════════════════════
     REFERRAL
  ══════════════════════════════════════════ */
  .stat-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 22px 20px; margin-bottom: 16px;
    box-shadow: 0 8px 28px rgba(44,74,46,0.2);
    color: #f7f3ed;
  }
  .stat-number {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 56px; line-height: 1; letter-spacing: -2px;
    margin-bottom: 4px;
  }
  .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(247,243,237,0.6); }
  .stat-prog-wrap {
    height: 2px; background: rgba(247,243,237,0.2); border-radius: 99px;
    margin: 14px 0 6px; overflow: hidden;
  }
  .stat-prog-bar { height: 100%; background: rgba(247,243,237,0.7); border-radius: 99px; transition: width .5s; }
  .stat-next { font-size: 12px; color: rgba(247,243,237,0.7); }

  .levels { list-style: none; }
  .levels li {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text);
  }
  .levels li:last-child { border: none; }
  .level-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; white-space: nowrap;
    min-width: 54px; text-align: center;
  }
  .level-badge.done { border-color: var(--green2); color: var(--green); }
  .ref-link-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; font-size: 12px; color: var(--muted);
    word-break: break-all; line-height: 1.6;
    box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }

  /* ══════════════════════════════════════════
     КЛУБ (GIVEAWAY)
  ══════════════════════════════════════════ */
  .club-hero {
    background: linear-gradient(135deg, #c4965a 0%, #dab07a 50%, #c4965a 100%);
    border-radius: 18px; padding: 28px 22px; margin-bottom: 16px;
    text-align: center; color: #1c1c1a;
    box-shadow: 0 8px 28px rgba(196,150,90,0.3);
  }
  .club-hero-count {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 64px; line-height: 1; letter-spacing: -3px; margin-bottom: 4px;
  }
  .club-hero-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(28,28,26,0.6);
  }

  /* ══════════════════════════════════════════
     MISC
  ══════════════════════════════════════════ */
  .empty { text-align: center; padding: 60px 20px; }
  .empty p { font-size: 14px; color: var(--muted); line-height: 1.7; }

  .spinner { display: flex; justify-content: center; padding: 60px; }
  .spinner::after {
    content: ""; width: 24px; height: 24px;
    border: 2px solid rgba(44,74,46,0.12); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #f7f3ed;
    padding: 10px 22px; border-radius: 99px;
    font-size: 13px; font-weight: 500; letter-spacing: .1px;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="screen-quiz"     class="screen active"></div>
<div id="screen-tracker"  class="screen"></div>
<div id="screen-referral" class="screen"></div>
<div id="screen-giveaway" class="screen"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('quiz')"     id="nav-quiz">Анализ</button>
  <button class="nav-btn"        onclick="showScreen('tracker')"  id="nav-tracker">Курс</button>
  <button class="nav-btn"        onclick="showScreen('referral')" id="nav-referral">Друзья</button>
  <button class="nav-btn"        onclick="showScreen('giveaway')" id="nav-giveaway">Клуб</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── Utils ──────────────────────────────────────────────────────────────────

function api(method, path, body) {
  return fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json());
}

function toast(msg, ms = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "tracker")  loadTracker();
  if (name === "referral") loadReferral();
  if (name === "giveaway") loadGiveaway();
}

const urlParams = new URLSearchParams(location.search);
const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;
api("POST", "/api/user/init", { ref }).catch(() => {});

// ── АНАЛИЗ (QUIZ) ──────────────────────────────────────────────────────────

const QUIZ_BASE_STEPS = [
  {
    id: "gender", title: "Укажи свой пол", type: "grid", options: [
      {id:"female", text:"Женщина"},
      {id:"male",   text:"Мужчина"},
    ]
  },
  {
    id: "age", title: "Сколько тебе лет?", type: "grid", options: [
      {id:"18-25", text:"18–25"},
      {id:"26-35", text:"26–35"},
      {id:"36-45", text:"36–45"},
      {id:"45+",   text:"45+"},
    ]
  },
  {
    id: "goal", title: "Какая основная цель?", type: "grid", options: [
      {id:"energy",       text:"Энергия и бодрость"},
      {id:"sleep",        text:"Улучшить сон"},
      {id:"immunity",     text:"Иммунитет"},
      {id:"brain",        text:"Мозг и фокус"},
      {id:"women_health", text:"Женское здоровье"},
      {id:"thyroid",      text:"Щитовидная железа"},
      {id:"beauty",       text:"Кожа и волосы"},
      {id:"weight",       text:"Контроль веса"},
    ]
  },
  {
    id: "symptoms", title: "Отметь симптомы, если есть", type: "multiselect", options: [
      {id:"fatigue",    text:"Постоянная усталость"},
      {id:"anemia",     text:"Анемия / дефицит железа"},
      {id:"hair_loss",  text:"Выпадение волос"},
      {id:"often_sick", text:"Часто болею"},
      {id:"low_sun",    text:"Мало бываю на солнце"},
      {id:"brain_fog",  text:"Туман в голове"},
      {id:"anxiety",    text:"Тревожность / раздражительность"},
    ]
  },
  {
    id: "stress", title: "Уровень стресса", type: "scale", options: [
      {id:1, label:"Нет"},
      {id:2, label:"Умер."},
      {id:3, label:"Высокий"},
      {id:4, label:"Хрон."},
    ]
  },
  {
    id: "sleep_q", title: "Качество сна", type: "scale", options: [
      {id:1, label:"Плохо"},
      {id:2, label:"Неплохо"},
      {id:3, label:"Хорошо"},
      {id:4, label:"Отлично"},
    ]
  },
  {
    id: "diet", title: "Как питаешься?", type: "grid", options: [
      {id:"balanced", text:"Сбалансированно"},
      {id:"low_meat", text:"Редко ем мясо"},
      {id:"vegan",    text:"Веганство"},
      {id:"sugary",   text:"Много сладкого"},
    ]
  },
  {
    id: "women_health", title: "Уточни по женскому здоровью", type: "grid", femaleOnly: true, options: [
      {id:"normal",    text:"Всё в порядке"},
      {id:"pms",       text:"ПМС"},
      {id:"pcos",      text:"СПКЯ"},
      {id:"thyroid_f", text:"Щитовидная железа"},
      {id:"fertility", text:"Фертильность / ЭКО"},
    ]
  },
];

let quizAnswers     = {};
let quizStepIdx     = 0;
let quizActiveSteps = [];
let quizSymptoms    = new Set();
const addedToTracker = new Set();

function getActiveSteps() {
  return QUIZ_BASE_STEPS.filter(s => !(s.femaleOnly && quizAnswers.gender !== "female"));
}

function renderWelcome() {
  const name = user.first_name ? `, <em>${user.first_name}</em>` : "";
  document.getElementById("screen-quiz").innerHTML = `
    <div class="welcome-wrap">
      <div class="welcome-brand">Biolar Organics</div>
      <h1 class="welcome-h1 serif">
        Узнай, что нужно<br>именно тебе${name}.
      </h1>
      <p class="welcome-sub">
        Персональный анализ нутриентов<br>
        на основе твоего образа жизни и целей.<br>
        Без воды — только то, что работает.
      </p>
      <button class="btn" onclick="renderQuiz()">Начать анализ</button>
      <div class="welcome-note">3 минуты · бесплатно</div>
    </div>
  `;
}

function renderQuiz() {
  quizActiveSteps = getActiveSteps();
  const step = quizActiveSteps[quizStepIdx];
  if (!step) { showSmartResults(); return; }

  const total   = quizActiveSteps.length;
  const current = quizStepIdx + 1;
  const pct     = Math.round((quizStepIdx / total) * 100);

  let body = "";

  if (step.type === "grid") {
    body = `<div class="quiz-grid">` +
      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             onclick="selectCard('${step.id}', '${o.id}', this)">
          ${o.text}
        </div>`).join("") +
      `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chips">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}', this)">
          ${o.text}
        </div>`).join("") +
      `</div>
      <button class="btn" onclick="advanceQuiz()">Продолжить</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-row">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}', ${o.id}, this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-lbl">${o.label}</div>
        </div>`).join("") +
      `</div>`;
  }

  const backBtn = quizStepIdx > 0
    ? `<button class="quiz-back-btn" onclick="backQuiz()">← Назад</button>`
    : `<button class="quiz-back-btn" onclick="renderWelcome()">← На главную</button>`;

  document.getElementById("screen-quiz").innerHTML = `
    <div class="quiz-head">
      <span class="label">Анализ</span>
      <span class="quiz-counter">${String(current).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
    </div>
    <div class="quiz-prog-wrap">
      <div class="quiz-prog-bar" style="width:${pct}%"></div>
    </div>
    <div class="quiz-q">${step.title}</div>
    ${body}
    ${backBtn}
  `;
}

function selectCard(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".quiz-grid").querySelectorAll(".quiz-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 220);
}

function toggleChip(id, el) {
  if (quizSymptoms.has(id)) { quizSymptoms.delete(id); el.classList.remove("selected"); }
  else                       { quizSymptoms.add(id);    el.classList.add("selected"); }
}

function selectScale(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".scale-row").querySelectorAll(".scale-seg").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 270);
}

function advanceQuiz() {
  const step = quizActiveSteps[quizStepIdx];
  if (step.type !== "multiselect" && !quizAnswers[step.id]) { toast("Выбери один из вариантов"); return; }
  quizStepIdx++;
  quizActiveSteps = getActiveSteps();
  if (quizStepIdx >= quizActiveSteps.length) showSmartResults();
  else renderQuiz();
}

function backQuiz() {
  if (quizStepIdx > 0) { quizStepIdx--; renderQuiz(); }
}

async function showSmartResults() {
  const screen = document.getElementById("screen-quiz");
  screen.innerHTML = '<div class="spinner"></div>';

  const payload = {
    gender:       quizAnswers.gender       || "female",
    age:          quizAnswers.age          || "26-35",
    goal:         quizAnswers.goal         || "energy",
    symptoms:     [...quizSymptoms],
    stress:       quizAnswers.stress       || 1,
    sleep_q:      quizAnswers.sleep_q      || 4,
    diet:         quizAnswers.diet         || "balanced",
    women_health: quizAnswers.women_health || null,
  };

  const data     = await api("POST", "/api/quiz/smart-result", payload);
  const products = data.products || [];
  const analysis = data.analysis || [];

  if (!products.length) {
    screen.innerHTML = `<div class="empty"><p>Ничего не нашли.<br>Напиши нам напрямую.</p></div>`;
    return;
  }

  const analysisHtml = analysis.length ? `
    <div class="analysis-block">
      <span class="label" style="color:var(--green);margin-bottom:10px">Что мы выявили</span>
      <ul class="analysis-list" style="margin-top:10px">${analysis.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>` : "";

  const productsHtml = products.map(p => {
    const benefits = (p.benefits || []).map(b => `<li>${b}</li>`).join("");
    const added    = addedToTracker.has(p.id);
    return `
      <div class="product-card">
        <div class="product-name">${p.name}</div>
        <div class="product-tag">${p.tagline}</div>
        <div class="product-reason-lbl">Почему тебе это нужно</div>
        <div class="product-reason-txt">${p.reason}</div>
        <ul class="product-benefits">${benefits}</ul>
        <div class="product-links">
          <a class="link-wb"   href="${p.wb_url}"   target="_blank">Wildberries</a>
          <a class="link-ozon" href="${p.ozon_url}" target="_blank">Ozon</a>
        </div>
        <button class="btn-course ${added ? 'added' : ''}"
                id="add-btn-${p.id}"
                onclick="addToTracker('${p.id}')">
          ${added ? "Добавлено в курс" : "+ Добавить в курс"}
        </button>
      </div>`;
  }).join("");

  screen.innerHTML = `
    <div class="results-hero">
      <span class="label">Персональный анализ</span>
      <div class="results-hero-title">Твоя программа<br>готова.</div>
    </div>
    ${analysisHtml}
    ${productsHtml}
    <button class="btn outline" onclick="restartQuiz()" style="margin-top:8px">Пройти анализ заново</button>
  `;
}

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "Добавлено в курс"; btn.classList.add("added"); }
  toast("Добавлено в курс");
}

function restartQuiz() {
  quizAnswers  = {};
  quizStepIdx  = 0;
  quizSymptoms = new Set();
  renderWelcome();
}

renderWelcome();

// ── КУРС (TRACKER) ─────────────────────────────────────────────────────────

async function loadTracker() {
  const screen = document.getElementById("screen-tracker");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/tracker");
  const products = data.products || [];

  if (!products.length) {
    screen.innerHTML = `
      <div style="margin-bottom:24px">
        <span class="label" style="margin-bottom:6px">Твой курс</span>
        <div class="serif" style="font-size:26px;letter-spacing:-.2px;margin-top:4px">Курс пуст</div>
      </div>
      <div class="empty"><p>Пройди анализ и добавь<br>продукты в свой курс.</p></div>
      <button class="btn" onclick="showScreen('quiz')">Пройти анализ</button>`;
    return;
  }

  const today = new Date().toLocaleDateString("ru", { day: "numeric", month: "long" });
  let html = `
    <div style="margin-bottom:24px">
      <span class="label" style="margin-bottom:6px">Твой курс</span>
      <div class="serif" style="font-size:26px;letter-spacing:-.2px;margin-top:4px">${today}</div>
    </div>`;

  for (const p of products) {
    const s = p.streak;
    const streakTxt = s > 0 ? `${s} ${s === 1 ? 'день' : s < 5 ? 'дня' : 'дней'} в курсе` : "Начни сегодня";
    html += `
      <div class="course-item" id="tracker-${p.product_id}">
        <button class="course-check ${p.taken_today ? 'done' : ''}"
                onclick="logIntake('${p.product_id}', this)">
          ${p.taken_today ? "✓" : ""}
        </button>
        <div class="course-info">
          <div class="course-name">${p.product_name}</div>
          <div class="course-streak">${streakTxt}</div>
        </div>
        <button class="course-del" onclick="removeProduct('${p.product_id}')">×</button>
      </div>`;
  }
  screen.innerHTML = html;
}

async function logIntake(productId, btn) {
  if (btn.classList.contains("done")) { toast("Уже отмечено сегодня"); return; }
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) { toast("Уже отмечено сегодня"); return; }
  btn.classList.add("done"); btn.textContent = "✓";
  const s = data.streak;
  btn.closest(".course-item").querySelector(".course-streak").textContent =
    `${s} ${s === 1 ? 'день' : s < 5 ? 'дня' : 'дней'} в курсе`;
  toast("Отмечено");
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено из курса");
}

// ── ДРУЗЬЯ (REFERRAL) ──────────────────────────────────────────────────────

async function loadReferral() {
  const screen = document.getElementById("screen-referral");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/referral");

  const nextCount  = data.next_level?.count  || data.levels[data.levels.length - 1].count;
  const nextReward = data.next_level?.reward || "Максимальный уровень";
  const progress   = Math.min((data.ref_count / nextCount) * 100, 100);
  const botUsername = "Biolarapp_bot";
  const refLink  = `https://t.me/${botUsername}?start=ref_${data.ref_code}`;
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Пройди персональный анализ нутриентов")}`;

  const levelsHtml = data.levels.map(l => `
    <li>
      <span class="level-badge ${data.ref_count >= l.count ? 'done' : ''}">${l.count} чел.</span>
      <span style="flex:1">${l.reward}</span>
      ${data.ref_count >= l.count ? `<span style="color:var(--green);font-weight:700;font-size:13px">✓</span>` : ""}
    </li>`).join("");

  screen.innerHTML = `
    <div style="margin-bottom:20px">
      <span class="label" style="margin-bottom:6px">Приглашай друзей</span>
      <div class="serif" style="font-size:26px;letter-spacing:-.2px;margin-top:4px">Получай награды</div>
    </div>

    <div class="stat-card">
      <div class="stat-number">${data.ref_count}</div>
      <div class="stat-label">Приглашённых</div>
      <div class="stat-prog-wrap">
        <div class="stat-prog-bar" style="width:${progress}%"></div>
      </div>
      <div class="stat-next">До следующей: ${nextReward}</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <span class="label" style="margin-bottom:14px">Уровни наград</span>
      <ul class="levels" style="margin-top:14px">${levelsHtml}</ul>
    </div>

    <span class="label" style="margin-bottom:8px">Твоя ссылка</span>
    <div class="ref-link-box" style="margin-top:8px;margin-bottom:12px">${refLink}</div>

    <button class="btn" onclick="window.open('${shareUrl}', '_blank')">Поделиться</button>
    <button class="btn outline" onclick="copyRef('${refLink}')">Скопировать ссылку</button>
  `;
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована"));
}

// ── КЛУБ (GIVEAWAY) ────────────────────────────────────────────────────────

async function loadGiveaway() {
  const screen = document.getElementById("screen-giveaway");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/giveaway");

  screen.innerHTML = `
    <div style="margin-bottom:20px">
      <span class="label" style="margin-bottom:6px">Клуб</span>
      <div class="serif" style="font-size:26px;letter-spacing:-.2px;margin-top:4px">Розыгрыш месяца</div>
    </div>

    <div class="club-hero">
      <div class="club-hero-count">${data.total_participants}</div>
      <div class="club-hero-label">участников</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <span class="label" style="margin-bottom:14px">Как участвовать</span>
      <div style="margin-top:14px;font-size:13px;color:var(--muted);line-height:2.1">
        Подпишись на Telegram-канал<br>
        Нажми кнопку участия<br>
        За каждого приглашённого — дополнительный шанс<br>
        Итоги в конце месяца
      </div>
    </div>

    ${data.participating
      ? `<div class="card" style="text-align:center">
           <div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div>
           <div style="font-size:13px;color:var(--muted);margin-top:4px">Удачи.</div>
         </div>`
      : `<button class="btn" onclick="joinGiveaway(this)">Участвовать</button>`
    }
  `;
}

async function joinGiveaway(btn) {
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/giveaway/join");
  btn.closest(".screen").querySelector(".club-hero-count").textContent = data.total_participants;
  const el = document.createElement("div");
  el.className = "card";
  el.style.textAlign = "center";
  el.innerHTML = `<div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div><div style="font-size:13px;color:var(--muted);margin-top:4px">Удачи.</div>`;
  btn.replaceWith(el);
  toast("Ты в розыгрыше");
}
</script>
