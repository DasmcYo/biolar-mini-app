<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a7c59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biolar">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      borderRadius: { lg:'1.25rem', xl:'1.75rem', '2xl':'2.25rem', '3xl':'2.75rem' },
      colors: {
        background:'#f4f1ec', foreground:'#2d2a24',
        card:    { DEFAULT:'#ffffff',  foreground:'#2d2a24' },
        primary: { DEFAULT:'#4a7c59', foreground:'#ffffff' },
        secondary:{ DEFAULT:'#e9e4da', foreground:'#3a362e' },
        muted:   { DEFAULT:'#ebe7df', foreground:'#8c8678' },
        accent:  { DEFAULT:'#dfeae1', foreground:'#2d4a36' },
        border:  '#e4ded2',
      },
      fontFamily: {
        heading: ['Fraunces','Georgia','serif'],
        sans:    ['Manrope','system-ui','sans-serif'],
      },
    },
  },
}
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:        #f4f1ec;
    --card:      #ffffff;
    --green:     #2c4a2e;
    --green2:    #4a7c59;
    --gold:      #c4965a;
    --gold2:     #dab07a;
    --text:      #2d2a24;
    --muted:     #8c8678;
    --border:    #e4ded2;
    --radius:    14px;
    --accent:    #dfeae1;
    --accent-fg: #2d4a36;
    --secondary: #e9e4da;
    --nav-bg:    #ffffff;
    --nav-border:#e8e3da;
  }

  html.dark {
    --bg:        #16161a;
    --card:      #1f1f24;
    --green:     #4a7c59;
    --green2:    #5d9970;
    --gold:      #c4965a;
    --gold2:     #dab07a;
    --text:      #edeae4;
    --muted:     #7a7570;
    --border:    #2e2e34;
    --accent:    #1e2e22;
    --accent-fg: #8ecfa0;
    --secondary: #252528;
    --nav-bg:    #1a1a1e;
    --nav-border:#2e2e34;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Manrope', -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    border-top: 1px solid var(--nav-border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1; padding: 8px 4px 10px;
    font-size: 10px; font-weight: 500; letter-spacing: .2px;
    color: #bbb; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color .15s;
  }
  .nav-icon {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .nav-icon svg { transition: stroke .2s; }
  .nav-btn.active .nav-icon { background: var(--green); }
  .nav-btn.active .nav-icon svg { stroke: #fff; }
  .nav-btn.active { color: var(--green); }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px 16px; }
  .screen.active { display: block; animation: screenIn .22s cubic-bezier(.22,.68,0,1.2); }
  #screen-ai.active {
    display: block !important;
    padding-bottom: 72px;
    animation: screenIn .22s cubic-bezier(.22,.68,0,1.2);
  }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn   { from { opacity: 0; transform: translateY(4px);  } to { opacity: 1; } }
  .screen-content { animation: fadeIn .2s ease; }

  /* ── PRIMITIVES ── */
  .label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  }
  .serif { font-family: Fraunces, Georgia, serif; }

  .btn {
    display: block; width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    color: #f7f3ed; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { opacity: .82; transform: scale(.99); }
  .btn.outline {
    background: transparent; color: var(--green);
    border: 1.5px solid rgba(44,74,46,0.22);
  }
  .btn.gold-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
    color: #1c1c1a;
  }
  .btn + .btn { margin-top: 8px; }

  .card {
    background: var(--card);
    border-radius: 1.75rem; padding: 18px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .spinner { display: flex; justify-content: center; padding: 60px; }
  .spinner::after {
    content: ""; width: 24px; height: 24px;
    border: 2px solid rgba(44,74,46,0.12); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #f7f3ed;
    padding: 10px 22px; border-radius: 99px;
    font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── Theme switcher ── */
  .theme-switcher {
    display: flex; align-items: center;
    background: var(--secondary); border-radius: 99px;
    padding: 3px; gap: 2px; flex-shrink: 0;
  }
  .theme-seg {
    width: 34px; height: 34px; border-radius: 99px;
    border: none; background: transparent;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-seg.active {
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  /* ══ ПРОГРАММА ══════════════════════════════════════════════════════════════ */
  .prog-card {
    background: var(--card);
    border-radius: 2rem;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin-bottom: 10px;
  }
  .prog-card-top {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .prog-card-emoji {
    width: 44px; height: 44px; border-radius: 1.25rem;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .prog-card-info { flex: 1; min-width: 0; }
  .prog-card-name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prog-card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .prog-ring-wrap {
    flex-shrink: 0; position: relative; width: 56px; height: 56px;
  }
  .prog-ring-wrap svg {
    display: block;
    transform: rotate(-90deg);
  }
  .prog-ring-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .prog-ring-days {
    font-size: 13px; font-weight: 700; color: var(--text); line-height: 1;
  }
  .prog-ring-of { font-size: 9px; color: var(--muted); line-height: 1.4; }
  .prog-delete {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 4px;
    line-height: 1; flex-shrink: 0; margin-left: 2px;
  }
  .prog-daily-bar {
    background: var(--secondary);
    border-radius: 1.25rem;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .prog-dots { display: flex; gap: 8px; align-items: center; }
  .prog-dot {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--border); background: var(--card);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    color: transparent;
    transition: background .2s, border-color .2s, color .2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .prog-dot.taken {
    background: var(--accent); border-color: var(--green2);
    color: var(--accent-fg);
  }
  .prog-dot-lbl {
    font-size: 11px; font-weight: 600; color: var(--muted);
    margin-left: auto;
  }
  .prog-dot-lbl.done { color: var(--green2); }
  @keyframes dotPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .prog-dot.popping { animation: dotPop .28s ease; }

  /* ══ ДНЕВНИК ════════════════════════════════════════════════════════════════ */
  .diary-cal-strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 6px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; margin-bottom: 16px;
  }
  .diary-cal-strip::-webkit-scrollbar { display: none; }
  .diary-cal-day {
    flex-shrink: 0; width: 52px; height: 68px; border-radius: 1.5rem;
    background: var(--card); border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.06); transition: background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .diary-cal-day.active { background: var(--green2); }
  .diary-cal-dow { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
  .diary-cal-day.active .diary-cal-dow { color: rgba(255,255,255,.7); }
  .diary-cal-num { font-family: Fraunces, serif; font-size: 20px; font-weight: 600; color: var(--text); line-height: 1; }
  .diary-cal-day.active .diary-cal-num { color: #fff; }

  .diary-section {
    background: var(--card); border-radius: 1.75rem; padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 12px;
  }
  .diary-section-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .diary-section-title {
    font-family: Fraunces, serif; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .diary-section-sub { font-size: 13px; color: var(--muted); }

  /* Water glasses */
  .diary-glasses-row { display: flex; gap: 6px; }
  .diary-glass {
    flex: 1; height: 52px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--secondary);
    cursor: pointer; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; font-size: 16px;
    transition: background .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .diary-glass.filled { background: rgba(91,184,240,.2); border-color: #5bb8f0; }
  .diary-water-done {
    margin-top: 12px; border-radius: 1.25rem; padding: 10px 14px;
    background: linear-gradient(135deg, rgba(91,184,240,.18), rgba(91,184,240,.08));
    border: 1px solid rgba(91,184,240,.35);
    display: flex; align-items: center; gap: 10px; animation: waterDone .4s ease;
  }
  @keyframes waterDone { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .diary-water-done-icon { font-size: 22px; }
  .diary-water-done-text { font-size: 13px; font-weight: 600; color: #2b8cbe; }

  /* КБЖУ rings */
  .diary-kbju-rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .diary-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .diary-ring-svg-wrap { position: relative; width: 64px; height: 64px; }
  .diary-ring-svg-wrap svg { transform: rotate(-90deg); display: block; }
  .diary-ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .diary-ring-val { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.1; text-align: center; }
  .diary-ring-lbl { font-size: 11px; color: var(--muted); }

  /* Meal cards */
  .diary-food-card {
    background: var(--card); border-radius: 1.75rem; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 8px;
  }
  .diary-food-emoji {
    width: 52px; height: 52px; border-radius: 1.25rem; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
  }
  .diary-food-info { flex: 1; min-width: 0; }
  .diary-food-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .diary-food-badge {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--accent); color: var(--accent-fg);
    border-radius: 99px; padding: 2px 8px;
    font-size: 10px; font-weight: 700; margin-top: 4px;
  }
  .diary-food-macros { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .diary-food-del {
    background: var(--secondary); border: none; border-radius: 50%;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--muted); cursor: pointer; flex-shrink: 0;
  }
  .diary-add-photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: none; border-radius: 1.75rem;
    background: var(--green2); color: #fff;
    padding: 16px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: opacity .15s; margin-top: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .diary-add-photo-btn:active { opacity: .85; }

  /* Photo modal */
  .photo-modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .photo-modal-sheet {
    width: 100%; max-width: 430px;
    background: var(--card);
    border-radius: 2rem 2rem 0 0;
    padding: 16px 20px 36px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .photo-modal-handle {
    width: 36px; height: 4px; border-radius: 99px; background: var(--border); margin: 0 auto 16px;
  }
  .photo-modal-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .photo-modal-title { font-family: Fraunces, serif; font-size: 20px; font-weight: 600; }
  .photo-modal-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--secondary); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--muted); line-height: 1;
  }

  /* ══ ГЛАВНАЯ ════════════════════════════════════════════════════════════════ */

  .home-greeting { margin-bottom: 16px; padding: 6px 0 0; }
  .home-time-label {
    font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--green2); margin-bottom: 4px; display: block;
  }
  .home-greeting-name {
    font-family: Fraunces, Georgia, serif;
    font-size: 32px; letter-spacing: -.5px; line-height: 1.1; color: var(--text);
  }

  /* Streak card — 3 stats */
  .streak-card {
    background: var(--green2);
    border-radius: 2.75rem; padding: 20px 20px 18px; margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(74,124,89,0.28);
  }
  .streak-header {
    font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.55); margin-bottom: 4px;
  }
  .streak-tagline { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 14px; }
  .streak-stats { display: flex; gap: 8px; }
  .streak-stat {
    flex: 1; background: rgba(255,255,255,0.13); border-radius: 14px;
    padding: 10px 6px; text-align: center;
  }
  .streak-stat-icon { font-size: 16px; margin-bottom: 4px; }
  .streak-stat-num {
    font-family: Fraunces, Georgia, serif;
    font-size: 22px; font-weight: 700; color: #fff; line-height: 1;
  }
  .streak-stat-lbl { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 3px; }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .section-head .label { color: var(--muted); }
  .section-badge {
    background: #dfeae1; color: #2d4a36; border-radius: 99px;
    padding: 3px 10px; font-size: 11px; font-weight: 700;
  }
  .section-link {
    font-size: 11px; font-weight: 700; color: var(--green2);
    letter-spacing: .3px; background: none; border: none; cursor: pointer; padding: 0;
  }

  /* Список добавок — белая карточка */
  .supplement-card {
    background: var(--card); border-radius: 2.75rem;
    padding: 18px 18px 14px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .supplement-card-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .supplement-card-title {
    font-family: Fraunces, Georgia, serif;
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  .mini-task {
    display: flex; align-items: center; gap: 12px;
    padding: 12px;
    background: rgba(233,228,218,0.6);
    border-radius: 2.25rem; margin-bottom: 8px; cursor: pointer;
    border: none; width: 100%; text-align: left;
  }
  .mini-task:last-child { margin-bottom: 0; }
  .mini-check {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #d0cac0; background: #fff;
    font-size: 12px; font-weight: 700; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .mini-check.done { background: var(--green2); border-color: var(--green2); color: #fff; }
  .mini-task-info { flex: 1; min-width: 0; }
  .mini-task-name { font-size: 14px; font-weight: 500; color: var(--text); transition: all .2s; display: block; }
  .mini-task-name.done { text-decoration: line-through; color: var(--muted); }
  .mini-task-dose { font-size: 12px; color: var(--muted); display: block; margin-top: 1px; }

  /* Wellness — полоски */
  .wellness-card {
    background: var(--card); border-radius: 2.75rem;
    padding: 18px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .wellness-card-title {
    font-family: Fraunces, Georgia, serif;
    font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 14px;
  }
  .wellness-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .wellness-row:last-child { margin-bottom: 0; }
  .wellness-row-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; color: var(--green2); }
  .wellness-row-label { font-size: 13px; width: 80px; flex-shrink: 0; }
  .wellness-bars { display: flex; flex: 1; gap: 3px; }
  .wb {
    flex: 1; height: 28px; border-radius: 8px;
    background: #e9e4da; cursor: pointer; transition: background .15s;
  }
  .wb.filled { background: var(--green2); }

  /* Контент-карточки */
  .content-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 8px;
    box-shadow: 0 1px 8px rgba(44,74,46,0.04);
    cursor: pointer;
  }
  .content-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green2); margin-bottom: 8px; }
  .content-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .content-preview { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .content-body { font-size: 13px; color: var(--text); line-height: 1.7; margin-top: 10px; display: none; }
  .content-body.open { display: block; }
  .content-toggle {
    font-size: 11px; font-weight: 700; color: var(--green);
    background: none; border: none; cursor: pointer;
    margin-top: 10px; padding: 0; letter-spacing: .3px;
  }

  /* ══ ПРОГРАММА ══════════════════════════════════════════════════════════════ */

  /* 30-day progress */
  .course-banner {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(196,150,90,0.25);
    color: #1c1c1a;
  }
  .course-banner .label { color: rgba(28,28,26,0.55); margin-bottom: 4px; }
  .course-day-num {
    font-family: Fraunces, Georgia, serif;
    font-size: 48px; line-height: 1; letter-spacing: -2px; margin-bottom: 8px;
  }
  .course-prog-wrap { height: 4px; background: rgba(28,28,26,0.15); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .course-prog-bar  { height: 100%; background: rgba(28,28,26,0.55); border-radius: 99px; transition: width .5s; }
  .course-prog-sub  { font-size: 11px; color: rgba(28,28,26,0.55); font-weight: 600; letter-spacing: .3px; }

  /* Quiz inside program */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .quiz-counter { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
  .quiz-prog-wrap { height: 2px; background: rgba(196,150,90,0.2); border-radius: 99px; margin-bottom: 32px; overflow: hidden; }
  .quiz-prog-bar  { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s; }
  .quiz-q {
    font-family: Fraunces, Georgia, serif;
    font-size: 26px; line-height: 1.2; letter-spacing: -.2px; margin-bottom: 24px;
  }
  .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .quiz-card {
    position: relative;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 18px 14px; font-size: 14px; font-weight: 500; text-align: center;
    cursor: pointer; color: var(--text); line-height: 1.35;
    transition: all .18s; box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .quiz-card:active { transform: scale(.97); }
  .quiz-card.selected {
    background: linear-gradient(135deg, var(--green) 0%, #3d6b4a 100%);
    border-color: transparent; color: #f7f3ed;
    box-shadow: 0 4px 16px rgba(44,74,46,0.22);
  }
  .quiz-card.selected::after {
    content: "✓"; position: absolute; top: 9px; right: 11px;
    font-size: 10px; color: rgba(247,243,237,0.6); font-weight: 700;
  }
  .quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .quiz-chip {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 99px;
    padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all .18s;
  }
  .quiz-chip.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; color: #f7f3ed; }
  .scale-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 13px 4px; text-align: center;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all .18s;
  }
  .scale-seg.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; box-shadow: 0 4px 14px rgba(44,74,46,0.2); }
  .scale-num { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: #f7f3ed; }
  .scale-lbl { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .scale-seg.selected .scale-lbl { color: rgba(247,243,237,0.7); }
  .back-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; margin-top: 16px; }

  /* Results */
  .results-hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 24px 22px; margin-bottom: 20px;
    box-shadow: 0 8px 28px rgba(44,74,46,0.2);
  }
  .results-hero .label { color: rgba(247,243,237,0.55); margin-bottom: 6px; }
  .results-hero-title { font-family: Fraunces, Georgia, serif; font-size: 28px; color: #f7f3ed; line-height: 1.1; }

  .analysis-block {
    background: linear-gradient(135deg, #eef5ee 0%, #f7f3ed 100%);
    border: 1px solid rgba(44,74,46,0.1); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .analysis-block .label { color: var(--green); margin-bottom: 10px; }
  .analysis-list { list-style: none; margin-top: 10px; }
  .analysis-list li { font-size: 13px; padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .analysis-list li::before { content: ""; display: inline-block; flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin-top: 8px; }

  .product-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(44,74,46,0.06);
  }
  .product-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .product-tag  { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
  .product-reason-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .product-reason-txt { font-size: 13px; line-height: 1.6; padding-left: 12px; border-left: 2.5px solid var(--gold); margin-bottom: 16px; }
  .product-benefits { list-style: none; margin-bottom: 18px; }
  .product-benefits li { font-size: 13px; color: var(--muted); padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .product-benefits li::before { content: ""; display: inline-block; flex-shrink: 0; width: 3px; height: 3px; border-radius: 50%; background: #c8bfb2; margin-top: 9px; }
  .product-links { display: flex; gap: 8px; margin-bottom: 10px; }
  .product-links a { flex: 1; padding: 10px; text-align: center; border-radius: 9px; font-size: 12px; font-weight: 700; text-decoration: none; letter-spacing: .3px; }
  .link-wb   { background: rgba(203,17,171,.08); color: #b050a0; border: 1px solid rgba(203,17,171,.18); }
  .link-ozon { background: rgba(0,91,255,.07); color: #4070e0; border: 1px solid rgba(0,91,255,.18); }
  .btn-course {
    width: 100%; padding: 11px; background: transparent;
    border: 1.5px solid rgba(44,74,46,0.18); border-radius: 9px;
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: all .18s;
  }
  .btn-course.added { background: linear-gradient(135deg, #eef5ee, #f7f3ed); border-color: var(--green2); color: var(--green); }

  /* Tracker list */
  .course-item {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 10px rgba(44,74,46,0.04);
  }
  .course-check {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .course-check.done { background: linear-gradient(135deg, var(--green), var(--green2)); border-color: transparent; color: #f7f3ed; box-shadow: 0 3px 10px rgba(44,74,46,0.2); }
  .course-info { flex: 1; }
  .course-name   { font-size: 14px; font-weight: 600; }
  .course-streak { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .course-del { background: none; border: none; color: #c0b4a4; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

  /* ══ ДНЕВНИК ════════════════════════════════════════════════════════════════ */

  /* ── Check-in (charge) ── */
  .checkin-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 22px; margin-bottom: 12px;
    box-shadow: 0 6px 24px rgba(44,74,46,0.18);
  }
  .checkin-card .label { color: rgba(247,243,237,0.55); margin-bottom: 8px; }
  .charge-title { font-family: Fraunces, Georgia, serif; font-size: 24px; color: #f7f3ed; line-height: 1.2; margin-bottom: 6px; }
  .charge-sub { font-size: 12px; color: rgba(247,243,237,0.52); margin-bottom: 26px; line-height: 1.55; }
  .charge-dots { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .charge-dot { border-radius: 50%; background: rgba(247,243,237,0.13); cursor: pointer; transition: all .18s; flex-shrink: 0; }
  .charge-dot.d1 { width: 26px; height: 26px; }
  .charge-dot.d2 { width: 34px; height: 34px; }
  .charge-dot.d3 { width: 42px; height: 42px; }
  .charge-dot.d4 { width: 50px; height: 50px; }
  .charge-dot.d5 { width: 58px; height: 58px; }
  .charge-dot.lit { background: rgba(247,243,237,0.65); }
  .charge-dot.lit.d4 { background: rgba(247,243,237,0.82); }
  .charge-dot.lit.d5 { background: #f7f3ed; box-shadow: 0 0 16px rgba(247,243,237,0.32); }
  .charge-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: rgba(247,243,237,0.48); text-align: center; margin-bottom: 18px; min-height: 14px; transition: opacity .2s; }
  .charge-done-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .charge-done-text { font-family: Fraunces, Georgia, serif; font-size: 22px; color: #f7f3ed; }
  .checkin-edit-btn { font-size: 11px; color: rgba(247,243,237,0.55); background: none; border: none; cursor: pointer; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; margin-top: 14px; display: block; }

  /* ── Supplement timeline ── */
  .suppl-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .suppl-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .suppl-day-lbl { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .suppl-phasebar { position: relative; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(44,74,46,0.08); margin-bottom: 6px; }
  .suppl-dates { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin-bottom: 10px; }
  .suppl-status { font-size: 12px; color: var(--text); line-height: 1.55; padding: 10px 12px; background: rgba(44,74,46,0.05); border-radius: 8px; border-left: 2px solid var(--green2); }
  .suppl-badge { font-size: 10px; font-weight: 700; border-radius: 99px; padding: 4px 10px; }

  /* ── Insight card ── */
  .insight-card { background: linear-gradient(135deg, #1e3a20 0%, var(--green) 100%); border-radius: var(--radius); padding: 20px; margin-bottom: 10px; color: #f7f3ed; }
  .insight-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(247,243,237,0.45); margin-bottom: 8px; }
  .insight-heading { font-family: Fraunces, Georgia, serif; font-size: 22px; line-height: 1.25; margin-bottom: 4px; }
  .insight-sub { font-size: 12px; color: rgba(247,243,237,0.6); line-height: 1.55; margin-bottom: 14px; }
  .insight-nums { display: flex; align-items: center; gap: 16px; }
  .insight-num-block { text-align: center; }
  .insight-num-val { font-family: Fraunces, Georgia, serif; font-size: 36px; line-height: 1; }
  .insight-num-lbl { font-size: 9px; color: rgba(247,243,237,0.45); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-top: 4px; }
  .insight-arr { font-size: 20px; color: rgba(247,243,237,0.3); }
  .insight-note { font-size: 11px; color: rgba(247,243,237,0.55); margin-top: 12px; line-height: 1.55; }

  /* ── Food log ── */
  .food-cam-btn {
    width: 100%; padding: 14px; border-radius: var(--radius);
    border: 1.5px dashed rgba(44,74,46,0.25); background: none;
    cursor: pointer; color: var(--green); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px;
  }
  .food-cam-btn:active { background: rgba(44,74,46,0.04); }
  .food-preview { width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; margin-bottom: 12px; }
  .kbju-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .kbju-item { flex: 1; text-align: center; background: rgba(44,74,46,0.06); border-radius: 8px; padding: 8px 4px; }
  .kbju-val { font-size: 15px; font-weight: 700; color: var(--green); line-height: 1.2; }
  .kbju-lbl { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-top: 2px; }
  .food-log-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .food-log-item:last-of-type { border-bottom: none; }
  .food-log-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .food-log-sub { font-size: 11px; color: var(--muted); }
  .food-del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; }
  .food-total { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 4px; }
  .food-total-item { flex: 1; text-align: center; }
  .food-total-val { font-size: 14px; font-weight: 700; color: var(--text); }
  .food-total-lbl { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-top: 2px; }

  /* ── Food Calendar ── */
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav-btn { background:none; border:none; cursor:pointer; color:var(--green); font-size:20px; font-weight:700; padding:4px 10px; line-height:1; }
  .cal-month-lbl { font-size:14px; font-weight:700; }
  .cal-wd-row { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }
  .cal-wd { text-align:center; font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-cell { aspect-ratio:1; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; cursor:pointer; transition:transform .15s; color:var(--text); }
  .cal-cell.empty { background:none !important; cursor:default; }
  .cal-cell.c0 { background:rgba(44,74,46,0.07); color:var(--muted); }
  .cal-cell.c1 { background:#d4e8d4; }
  .cal-cell.c2 { background:#a4c7a4; }
  .cal-cell.c3 { background:#70ad70; color:#fff; }
  .cal-cell.c4 { background:#46914a; color:#fff; }
  .cal-cell.c5 { background:var(--green); color:#f7f3ed; }
  .cal-cell.is-today { box-shadow:0 0 0 2px var(--gold); }
  .cal-cell.is-sel { transform:scale(1.12); box-shadow:0 0 0 2px var(--green); }
  .cal-legend { display:flex; align-items:center; gap:5px; margin-top:10px; }
  .cal-leg-lbl { font-size:9px; color:var(--muted); font-weight:700; }
  .cal-leg-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .cal-day-detail { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .cal-day-title { font-size:13px; font-weight:700; margin-bottom:8px; color:var(--green); }

  /* ── Trend 30 days ── */
  .trend30-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 12px; }
  .trend30-bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; min-width: max-content; padding-bottom: 2px; }
  .tb { width: 9px; border-radius: 3px 3px 0 0; flex-shrink: 0; min-height: 3px; }
  .tb.empty { background: rgba(44,74,46,0.09); height: 3px; }
  .tb.c1 { background: #cfe0cf; }
  .tb.c2 { background: #a4c7a4; }
  .tb.c3 { background: #70ad70; }
  .tb.c4 { background: #469146; }
  .tb.c5 { background: var(--green); }
  .trend30-footer { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-weight: 700; margin-top: 6px; letter-spacing: .3px; }

  /* AI chat */
  .chat-wrap { display: flex; flex-direction: column; height: 360px; }
  .chat-messages { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .msg { margin-bottom: 10px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 16px;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap;
  }
  .msg.bot .msg-bubble  { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, var(--green), var(--green2)); color: #f7f3ed; border-bottom-right-radius: 4px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input {
    flex: 1; padding: 12px 16px; background: var(--card);
    border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 14px; color: var(--text); outline: none;
  }
  .chat-input:focus { border-color: var(--green2); }
  .chat-send {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green2));
    border: none; cursor: pointer; font-size: 18px; color: #f7f3ed;
    display: flex; align-items: center; justify-content: center;
  }
  /* chat product recommendation cards */
  .chat-prod-row { margin: 6px 0 4px; }
  .chat-prod-lbl {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; padding-left: 2px;
  }
  .chat-prod-cards { display: flex; flex-direction: column; gap: 7px; }
  .chat-prod-card {
    background: var(--card); border-radius: 1.25rem; padding: 11px 12px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .chat-prod-emoji { font-size: 22px; flex-shrink: 0; width: 30px; text-align: center; }
  .chat-prod-info { flex: 1; min-width: 0; }
  .chat-prod-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .chat-prod-tagline { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-prod-add {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--green2); color: #fff; border: none; cursor: pointer;
    font-size: 18px; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .1s;
  }
  .chat-prod-add:active { transform: scale(.9); }
  .chat-prod-add.added { background: var(--accent); color: var(--accent-fg); font-size: 14px; pointer-events: none; }

  .chat-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chat-sug {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 99px;
    padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .chat-sug:active { border-color: var(--green); color: var(--green); }
  .stub-notice {
    background: linear-gradient(135deg, #fdf9f0, #f7f3ed);
    border: 1px solid rgba(196,150,90,0.2); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 12px;
    font-size: 12px; color: var(--muted); line-height: 1.6;
    display: flex; gap: 10px; align-items: flex-start;
  }

  /* ══ ВОДА ═══════════════════════════════════════════════════════════════════ */

  .water-ring-wrap { display:flex; justify-content:center; margin:4px 0 20px; }
  .water-ring-inner { position:relative; width:160px; height:160px; }
  .water-ring-inner svg { position:absolute; inset:0; }
  .water-ring-center {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .water-ring-num { font-size:44px; font-weight:800; color:var(--text); line-height:1; }
  .water-ring-sub { font-size:11px; color:var(--muted); margin-top:4px; }
  @keyframes waterComplete {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.12); }
    60%  { transform: scale(.96); }
    100% { transform: scale(1); }
  }
  @keyframes waterGlow {
    0%,100% { filter: drop-shadow(0 0 0px #5bb8f0); }
    50%      { filter: drop-shadow(0 0 18px #5bb8f0); }
  }
  .water-ring-complete { animation: waterComplete .5s cubic-bezier(.4,0,.2,1), waterGlow 1.2s ease .3s; }

  /* ══ КАТАЛОГ БОТТОМ-ШИТ ════════════════════════════════════════════════════ */
  .catalog-sheet-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500;

  /* Achievements */
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .ach-card {
    background: linear-gradient(180deg,#fff 0%,#faf7f2 100%);

  .ref-sub  { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(247,243,237,.55); }
  .ref-prog-wrap { height: 2px; background: rgba(247,243,237,.2); border-radius: 99px; margin: 14px 0 6px; overflow: hidden; }
  .ref-prog-bar  { height: 100%; background: rgba(247,243,237,.7); border-radius: 99px; transition: width .5s; }

  .ref-levels li:last-child { border: none; }
  .ref-lvl-badge { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; white-space: nowrap; min-width: 50px; text-align: center; }
  .ref-lvl-badge.done { border-color: var(--green2); color: var(--green); }

<div class="toast" id="toast"></div>


<script>
const tg = window.Telegram?.WebApp || { ready(){}, expand(){}, initData: "", initDataUnsafe: {} };
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── PWA install ────────────────────────────────────────────────────────────

function updateManifest(token) {
  const el = document.querySelector('link[rel="manifest"]');
  if (el && token) el.href = `/manifest.json?t=${encodeURIComponent(token)}`;
}

let deferredPrompt = null;
let currentSessionToken = null;   // обновляется когда init вернул ответ

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

async function installPWA() {
  // Вариант 1: нативный Chrome промпт (Android Chrome вне Telegram)
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-pwa-card')?.remove();
    return;
  }

  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const isInTelegram = !!initData;

  // Берём токен — сначала из переменной (свежий от init), потом из localStorage
  const token = currentSessionToken || localStorage.getItem("biolar_token");
  const installUrl = token ? `${location.origin}/?t=${token}` : location.origin;

  if (isInTelegram) {
    if (token) {
      showInstallModal(
        'Сейчас откроем браузер...\n\nДальше нажми Поделиться (квадрат со стрелкой) → "На экран «Домой»"',
        null
      );
      setTimeout(() => tg.openLink(installUrl), 3500);
    } else {
      showInstallModal('Подожди секунду, приложение загружается...\n\nПопробуй ещё раз через пару секунд.', null);
    }
    return;
  }

  if (deferredPrompt) return;  // нативный промпт уже сработает

  let msg = '';
  if (isIOS) {
    msg = 'Нажми кнопку Поделиться (квадрат со стрелкой вверх) внизу Safari, затем выбери "На экран «Домой»"';
  } else {
    msg = 'Нажми ⋮ в правом верхнем углу браузера, затем "Добавить на главный экран" или "Установить приложение"';
  }
  showInstallModal(msg, null);
}

function showInstallModal(msg, link) {
  const existing = document.getElementById('install-modal');
  if (existing) existing.remove();

  const lines = msg.split('\n').map(l => l ? `<div>${l}</div>` : '<div style="height:6px"></div>').join('');
  const linkHtml = link ? `<button class="btn" style="margin-top:12px;width:100%" onclick="navigator.clipboard?.writeText('${link}').then(()=>toast('Ссылка скопирована'));return false;">Скопировать ссылку</button>` : '';

  const el = document.createElement('div');
  el.id = 'install-modal';
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:flex-end;padding:16px';
  el.innerHTML = `
    <div style="background:#fff;border-radius:20px;padding:24px;width:100%;box-sizing:border-box">
      <div style="font-weight:700;font-size:17px;margin-bottom:14px">Как установить приложение</div>
      <div style="font-size:14px;line-height:1.6;color:#333">${lines}</div>
      ${linkHtml}
      <button class="btn outline" style="margin-top:10px;width:100%" onclick="document.getElementById('install-modal').remove()">Закрыть</button>
    </div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
}

// ── Auth ───────────────────────────────────────────────────────────────────

function authHeaders() {
  if (initData) return { "X-Telegram-Init-Data": initData };
  const token = localStorage.getItem("biolar_token");
  if (token) return { "X-Session-Token": token };
  return {};
}

// ── Utils ──────────────────────────────────────────────────────────────────

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...authHeaders() },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status}: ${txt}`);
  }
  return r.json();
}

function toast(msg, ms = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "home")    loadHome();
  if (name === "program") loadProgram();
  if (name === "diary")   loadDiary();
  if (name === "ai")      loadAI();
  if (name === "club")    loadClub();
}

function setScreenHTML(screen, html) {
  const wrap = document.createElement("div");
  wrap.className = "screen-content";
  wrap.innerHTML = html;
  screen.innerHTML = "";
  screen.appendChild(wrap);
}

const urlParams = new URLSearchParams(location.search);

// Если пришли по ссылке из Telegram с токеном — сохраняем
const installToken = urlParams.get("t");
if (installToken) {
  localStorage.setItem("biolar_token", installToken);
  updateManifest(installToken);
  // Чистим URL только в PWA standalone-режиме. В Safari — оставляем ?t=TOKEN
  // чтобы "На экран Домой" сохранил ярлык с токеном в URL
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (isStandalone) {
    history.replaceState({}, "", location.pathname);
  }
}

// Если токен уже был в localStorage — тоже обновляем манифест сразу
const existingToken = localStorage.getItem("biolar_token");
if (existingToken) updateManifest(existingToken);

const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;
api("POST", "/api/user/init", { ref }).then(d => {
  if (d.session_token) {
    currentSessionToken = d.session_token;
    localStorage.setItem("biolar_token", d.session_token);
    updateManifest(d.session_token);
  }
}).catch(() => {});

// ══════════════════════════════════════════════════════════════════════════
// ГЛАВНАЯ
// ══════════════════════════════════════════════════════════════════════════

let CONTENT_CARDS = [];

function timeGreeting() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return "ДОБРОЕ УТРО";
  if (h >= 12 && h < 17) return "ДОБРЫЙ ДЕНЬ";
  if (h >= 17 && h < 22) return "ДОБРЫЙ ВЕЧЕР";
  return "ДОБРОЙ НОЧИ";
}

function setTheme(mode) {
  if (mode === 'dark') {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark');
  }
  localStorage.setItem('biolar_theme', mode);
  document.querySelectorAll('.theme-seg').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
}

// Применяем тему сразу при загрузке
(function() {
  const saved = localStorage.getItem('biolar_theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
}());

function streakTagline(s) {
  if (s === 0) return "Начни сегодня ✨";
  if (s === 1) return "Первый шаг сделан!";
  if (s < 7)  return "Продолжай так! 💪";
  if (s < 30) return "Так держать! 🔥";
  return "Невероятная серия! 🏆";
}

function barsHtml(val, key) {
  return [1,2,3,4,5].map(i =>
    `<span class="wb${i <= val ? ' filled' : ''}" onclick="homeSetWellness('${key}',${i})"></span>`
  ).join("");
}

let homeWellnessState = {};

async function homeSetWellness(key, val) {
  homeWellnessState[key] = val;
  // перекрашиваем бары
  const row = document.querySelector(`[data-wkey="${key}"]`);
  if (row) {
    row.querySelectorAll(".wb").forEach((b, i) => {

async function homeLogIntake(productId, taskBtn) {
  const checkEl = taskBtn.querySelector(".mini-check");
  if (checkEl && checkEl.classList.contains("done")) return;
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (!data.already_taken) {
    if (checkEl) checkEl.classList.add("done");
    const nameEl = document.getElementById("mtname-" + productId);
    if (nameEl) nameEl.classList.add("done");
    toast("Отмечено ✓");
    const done  = document.querySelectorAll(".mini-check.done").length;
    const total = document.querySelectorAll(".mini-check").length;
    const badge = document.getElementById("supp-badge");
    if (badge) badge.textContent = `${done}/${total}`;
  }
}

async function loadProgram() {
  const screen = document.getElementById("screen-program");
  screen.innerHTML = '<div class="spinner"></div>';

  const trackerData = await api("GET", "/api/tracker");
  const products = trackerData.products || [];

  // Summary banner
  const takenCount = products.filter(p => p.taken_today).length;
  let banner = "";
  if (products.length > 0) {
    const pct = Math.round((takenCount / products.length) * 100);
    banner = `
      <div class="prog-card" style="margin-bottom:16px">
        <div style="font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--green2);margin-bottom:4px">Сегодня</div>
        <div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-bottom:10px">${takenCount} из ${products.length} принято</div>
        <div style="height:6px;background:var(--secondary);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--green2);border-radius:99px;transition:width .5s"></div>
        </div>
      </div>`;
  }

  // Helper: SVG progress ring
  function buildRing(pid, daysTaken, durationDays) {
    const r = 22, circ = +(2 * Math.PI * r).toFixed(2);
    const offset = +(circ * (1 - Math.min(daysTaken / Math.max(durationDays, 1), 1))).toFixed(2);
    return `
      <div class="prog-ring-wrap">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--secondary)" stroke-width="4"/>
          <circle id="ring-${pid}" cx="28" cy="28" r="${r}" fill="none" stroke="var(--green2)" stroke-width="4"
            stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
            stroke-linecap="round"
            style="transition:stroke-dashoffset .8s ease"/>
        </svg>
        <div class="prog-ring-label">
          <span id="ring-days-${pid}" class="prog-ring-days">${daysTaken}</span>
          <span class="prog-ring-of">из ${durationDays}</span>
        </div>
      </div>`;
  }

  // Helper: daily dose dots
  function buildDots(pid, dailyDose, taken) {
    const dots = Array.from({length: dailyDose}, () =>
      `<div class="prog-dot ${taken ? 'taken' : ''}" onclick="tapDot('${pid}', this)">${taken ? '✓' : ''}</div>`
    ).join('');
    return `
      <div class="prog-daily-bar">
        <div class="prog-dots">${dots}</div>
        <span class="prog-dot-lbl ${taken ? 'done' : ''}">${taken ? 'Принято' : 'Отметить приём'}</span>
      </div>`;
  }

  // Product cards
  const cards = products.map(p => {
    const daysTaken   = p.days_taken   || 0;
    const duration    = p.duration_days || 30;
    const dailyDose   = p.daily_dose   || 1;
    const taken       = p.taken_today  || false;
    const emoji = (CATALOG.find(c => c.id === p.product_id) || {}).emoji || '💊';
    return `
      <div id="tracker-${p.product_id}" class="prog-card"
           data-days-taken="${daysTaken}" data-duration="${duration}" data-dose="${dailyDose}">
        <div class="prog-card-top">
          <div class="prog-card-emoji">${emoji}</div>
          <div class="prog-card-info">
            <div class="prog-card-name">${p.product_name}</div>
            <div class="prog-card-meta">День ${daysTaken} · курс ${duration} дней</div>
          </div>
          ${buildRing(p.product_id, daysTaken, duration)}
          <button onclick="removeProduct('${p.product_id}')" class="prog-delete">×</button>
        </div>
        ${buildDots(p.product_id, dailyDose, taken)}
      </div>`;
  }).join('');

  setScreenHTML(screen, `
    <header style="padding:24px 0 8px">
      <div style="font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--green2);margin-bottom:4px">Biolar</div>
      <div style="font-family:Fraunces,serif;font-size:28px;font-weight:600;letter-spacing:-.3px">Программа</div>
    </header>
    ${banner}
    ${cards}
    <button onclick="openCatalogSheet()" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:2.75rem;border:2px dashed var(--border);background:rgba(255,255,255,0.5);padding:18px;font-size:14px;font-weight:600;color:var(--green2);cursor:pointer;margin-top:4px">
      + Добавить продукт из каталога
    </button>
  `);
}

async function openCatalogSheet() {
  const trackerData = await api("GET", "/api/tracker");
  const addedIds = new Set((trackerData.products || []).map(p => p.product_id));

  const overlay = document.createElement("div");
  overlay.className = "catalog-sheet-overlay";
  overlay.id = "catalog-overlay";
  overlay.onclick = e => { if (e.target === overlay) closeCatalogSheet(); };

  overlay.innerHTML = `
    <div class="catalog-sheet">
      <div class="catalog-sheet-handle"></div>
      <div class="catalog-sheet-head">
        <div class="serif" style="font-size:18px">Каталог продуктов</div>
        <button onclick="closeCatalogSheet()" style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1">×</button>
      </div>
      <input class="catalog-search" id="catalog-search" placeholder="Поиск продукта..." type="text" oninput="filterCatalog(this.value,'${[...addedIds].join(',')}')">
      <div class="catalog-list" id="catalog-list">
        ${renderCatalogItems(CATALOG, addedIds)}
      </div>
    </div>`;

  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById("catalog-search")?.focus(), 100);
}

function renderCatalogItems(items, addedIds) {
  return items.map(p => {
    const isAdded = addedIds.has(p.id);
    return `
      <div class="catalog-item" onclick="${isAdded ? '' : `addProductFromCatalog('${p.id}',this)`}">
        <div class="catalog-item-emoji">${p.emoji}</div>
        <div class="catalog-item-info">
          <div class="catalog-item-name" style="${isAdded ? 'color:var(--muted)' : ''}">${p.name}</div>
          <div class="catalog-item-tagline">${p.tagline}</div>
        </div>
        <div class="catalog-item-add ${isAdded ? 'added' : 'available'}">${isAdded ? '✓' : '+'}</div>
      </div>`;
  }).join('');
}

function filterCatalog(query, addedStr) {
  const addedIds = new Set(addedStr ? addedStr.split(',') : []);
  const q = query.toLowerCase().trim();
  const filtered = q ? CATALOG.filter(p => p.name.toLowerCase().includes(q) || p.tagline.toLowerCase().includes(q)) : CATALOG;
  const list = document.getElementById("catalog-list");
  if (list) list.innerHTML = renderCatalogItems(filtered, addedIds);
}

async function addProductFromCatalog(productId, el) {
  el.querySelector('.catalog-item-add').textContent = '...';
  try {
    await api("POST", "/api/tracker/add", { product_id: productId });
    el.querySelector('.catalog-item-add').className = 'catalog-item-add added';
    el.querySelector('.catalog-item-add').textContent = '✓';
    el.querySelector('.catalog-item-name').style.color = 'var(--muted)';
    el.onclick = null;
    toast("Добавлено в курс");
    // обновляем строку addedIds в поиске
    const search = document.getElementById("catalog-search");
    if (search) {
      const cur = search.getAttribute("oninput") || '';
      const match = cur.match(/'([^']*)'\)/);
      if (match) {
        const ids = match[1] ? match[1].split(',') : [];
        ids.push(productId);
        search.setAttribute("oninput", `filterCatalog(this.value,'${ids.join(',')}')`);
      }
    }
  } catch(e) {
    el.querySelector('.catalog-item-add').textContent = '+';
    toast("Ошибка: " + e.message);
  }
}

function closeCatalogSheet() {

  loadProgram();
}

function renderQuiz() {
  quizActiveSteps = getActiveSteps();
  const step = quizActiveSteps[quizStepIdx];
  if (!step) { showSmartResults(); return; }

  const total = quizActiveSteps.length, current = quizStepIdx + 1;
  const pct = Math.round((quizStepIdx / total) * 100);

  let body = "";
  if (step.type === "grid") {
    body = `<div class="quiz-grid">` +
      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             onclick="selectCard('${step.id}','${o.id}',this)">${o.text}</div>`).join("") + `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chips">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}',this)">${o.text}</div>`).join("") +
      `</div><button class="btn" onclick="advanceQuiz()">Продолжить</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-row">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}',${o.id},this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-lbl">${o.label}</div>
        </div>`).join("") + `</div>`;
  }

function advanceQuiz() {

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "Добавлено в курс"; btn.classList.add("added"); }
  toast("Добавлено в курс");
}

async function tapDot(productId, dot) {
  const bar = dot.closest('.prog-daily-bar');
  const dots = [...bar.querySelectorAll('.prog-dot')];
  if (dots[0].classList.contains('taken')) { toast("Уже отмечено сегодня"); return; }

  // Stagger-fill all dots with animation
  dots.forEach((d, i) => {
    setTimeout(() => {
      d.classList.add('taken', 'popping');
      d.textContent = '✓';
      setTimeout(() => d.classList.remove('popping'), 300);
    }, i * 110);
  });

  // Update label
  const lbl = bar.querySelector('.prog-dot-lbl');
  setTimeout(() => {
    if (lbl) { lbl.textContent = 'Принято'; lbl.classList.add('done'); }
  }, dots.length * 110);

  // API call
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) return;

  toast("✓ Принято");

  // Update ring in-place (increment days_taken by 1)
  const card = document.getElementById('tracker-' + productId);
  if (!card) return;
  const daysTaken = (parseInt(card.dataset.daysTaken) || 0) + 1;
  const duration  = parseInt(card.dataset.duration) || 30;
  card.dataset.daysTaken = daysTaken;

  const r = 22, circ = +(2 * Math.PI * r).toFixed(2);
  const offset = +(circ * (1 - Math.min(daysTaken / duration, 1))).toFixed(2);
  const ring = document.getElementById('ring-' + productId);
  if (ring) ring.setAttribute('stroke-dashoffset', offset);
  const daysEl = document.getElementById('ring-days-' + productId);
  if (daysEl) daysEl.textContent = daysTaken;
  const meta = card.querySelector('.prog-card-meta');
  if (meta) meta.textContent = `День ${daysTaken} · курс ${duration} дней`;
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено из курса");
}

function buildInsight(history, daysInCourse) {
  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  if (history.length < 7) {
    const left = Math.max(0, 7 - history.length);
    return `
      <div class="card" style="text-align:center;padding:20px;margin-bottom:10px">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">Пока нет данных для инсайта</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">Ещё ${left} ${left===1?'день':left<5?'дня':'дней'} — и появится твой первый<br>персональный прогресс-инсайт</div>
      </div>`;
  }
  const chron   = [...history].reverse();
  const w1      = chron.slice(0, 7).map(getCharge);
  const wLast   = chron.slice(-7).map(getCharge);
  const avg1    = (w1.reduce((a,b) => a+b, 0) / w1.length).toFixed(1);
  const avgNow  = (wLast.reduce((a,b) => a+b, 0) / wLast.length).toFixed(1);
  const diff    = (parseFloat(avgNow) - parseFloat(avg1)).toFixed(1);
  const up      = parseFloat(diff) > 0.2;
  const flat    = Math.abs(parseFloat(diff)) <= 0.2;

  return `
    <div class="insight-card">
      <div class="insight-eyebrow">Прогресс · ${daysInCourse} дней курса</div>
      <div class="insight-heading">${up ? 'Заряд растёт' : flat ? 'Стабильный заряд' : 'Продолжаем курс'}</div>
      <div class="insight-sub">${up
        ? `За ${daysInCourse} дней средний заряд вырос на ${diff} п.`
        : flat
          ? 'Твой уровень стабилен — накопительный эффект продолжается'
          : 'Добавки работают накопительно — первый эффект появится на 3-4 неделе'
      }</div>
      <div class="insight-nums">
        <div class="insight-num-block">
          <div class="insight-num-val">${avg1}</div>
          <div class="insight-num-lbl">Начало</div>
        </div>
        <div class="insight-arr">→</div>
        <div class="insight-num-block">
          <div class="insight-num-val">${avgNow}</div>
          <div class="insight-num-lbl">Сейчас</div>
        </div>
      </div>
    </div>`;
}

  const msgs = document.getElementById("ai-msgs");

  // Загружаем историю из БД
  try {
    const { messages } = await api("GET", "/api/ai/history");
    if (messages && messages.length > 0) {
      msgs.innerHTML = "";
      messages.forEach(m => {
        if (m.content === "__onboarding_start__") return;
        const role = m.role === "assistant" ? "bot" : "user";
        const clean = m.content.replace(/\[?PRODUCTS:[^\]\n\[]+\]?/gi, "").trim();
        if (!clean) return;
        msgs.insertAdjacentHTML("beforeend",
          `<div class="msg ${role}"><div class="msg-bubble">${escAI(clean)}</div></div>`
        );
      });
      document.getElementById("screen-ai")?.scrollTo(0, 999999);
      return; // есть история — онбординг не нужен
    }
  } catch(e) {}

  // Нет истории + новый пользователь — запускаем онбординг
  if (isNew && !aiOnboardingTriggered) {
    aiOnboardingTriggered = true;
    setTimeout(() => sendAI("__onboarding_start__"), 600);
  }
}

async function sendAIFromInput() {
  const inp = document.getElementById("ai-input");
  if (!inp || !inp.value.trim()) return;
  const text = inp.value.trim();
  inp.value = "";
  await sendAI(text);
}

async function sendAI(text) {
  const msgs = document.getElementById("ai-msgs");
  if (!msgs) return;

  const isOnboarding = text === "__onboarding_start__";

  if (!isOnboarding) {
    msgs.insertAdjacentHTML("beforeend",
      `<div class="msg user"><div class="msg-bubble">${escAI(text)}</div></div>`
    );
    document.getElementById("screen-ai")?.scrollTo(0, 999999);
    const sugsEl = document.getElementById("ai-sugs");
    if (sugsEl) sugsEl.style.display = "none";
  }

  const typingId = "ai-typing-" + Date.now();
  msgs.insertAdjacentHTML("beforeend",
    `<div class="msg bot" id="${typingId}"><div class="msg-bubble" style="color:var(--muted)">...</div></div>`
  );
  document.getElementById("screen-ai")?.scrollTo(0, 999999);

  let data;
  try {
    data = await api("POST", "/api/ai/chat", { message: text });
  } catch(e) {
    const el = document.getElementById(typingId);
    if (el) el.querySelector(".msg-bubble").textContent = "Ошибка соединения, попробуй ещё раз.";
    return;
  }

  // Парсим PRODUCTS: id1, id2 (со скобками или без — модель может не добавить их)
  const prodMatch = data.message.match(/\[?PRODUCTS:\s*([^\]\n\[]+)/i);
  const cleanMsg  = data.message.replace(/\[?PRODUCTS:[^\]\n\[]+\]?/gi, "").trim();

  const typingEl = document.getElementById(typingId);
  if (typingEl) {
    const bubble = typingEl.querySelector(".msg-bubble");
    bubble.style.color = "";
    bubble.textContent = cleanMsg;
  }

  if (prodMatch) {
    const ids = prodMatch[1].split(",").map(s => s.trim()).filter(Boolean);
    const cards = ids.map(id => {
      const p = CATALOG.find(c => c.id === id) || { emoji: "💊", name: id, tagline: "" };
      return `
        <div class="chat-prod-card">
          <div class="chat-prod-emoji">${p.emoji}</div>
          <div class="chat-prod-info">
            <div class="chat-prod-name">${p.name}</div>
            <div class="chat-prod-tagline">${p.tagline}</div>
          </div>
          <button class="chat-prod-add" onclick="addOneProduct('${id}', this)">+</button>
        </div>`;
    }).join("");
    const row = document.createElement("div");
    row.className = "chat-prod-row";
    row.innerHTML = `<div class="chat-prod-lbl">Добавить в программу</div><div class="chat-prod-cards">${cards}</div>`;
    msgs.appendChild(row);
  }

  document.getElementById("screen-ai")?.scrollTo(0, 999999);
}

async function addOneProduct(productId, btn) {
  if (btn.classList.contains("added")) return;
  btn.disabled = true;
  btn.textContent = "…";
  try {
    await api("POST", "/api/tracker/bulk-add", { product_ids: [productId] });
    btn.textContent = "✓";
    btn.classList.add("added");
    btn.disabled = false;
    window.userHasProducts = true;
    localStorage.setItem("biolar_onboarding_done", "1");
  } catch(e) {
    btn.disabled = false;
    btn.textContent = "+";
    toast("Ошибка");
  }
}

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let calMonth = null; // "2026-06"
let calSel   = null; // "2026-06-14"

async function initCalendar() {
  if (!calMonth) {
    const now = new Date();
    calMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  await loadCalendar();
}

async function loadCalendar() {
  const lbl = document.getElementById("cal-month-lbl");
  const wrap = document.getElementById("cal-grid-wrap");
  if (!lbl || !wrap) return;

  const [y, m] = calMonth.split('-').map(Number);
  lbl.textContent = `${MONTHS_RU[m-1]} ${y}`;

  try {
    const data = await api("GET", `/api/diary/food/month?month=${calMonth}`);
    renderCalGrid(y, m, data.days || {});
  } catch(e) {
    console.error("Calendar load error:", e);
    if (wrap) wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0">Ошибка: ${e.message}</div>`;
  }
}

function renderCalGrid(year, mon, days) {
  const wrap = document.getElementById("cal-grid-wrap");
  if (!wrap) return;

  const daysInMonth = new Date(year, mon, 0).getDate();
  const firstDow    = (new Date(year, mon - 1, 1).getDay() + 6) % 7; // Mon=0
  const today       = new Date().toISOString().slice(0, 10);

  const calColor = cal => {
    if (!cal) return 'c0';
    if (cal < 500)  return 'c1';
    if (cal < 1000) return 'c2';
    if (cal < 1500) return 'c3';
    if (cal < 2000) return 'c4';
    return 'c5';
  };

  let cells = Array(firstDow).fill('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const ds  = `${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cal = days[ds]?.calories || 0;
    const cls = [
      'cal-cell', calColor(cal),
      ds === today  ? 'is-today' : '',
      ds === calSel ? 'is-sel'   : '',
    ].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" data-date="${ds}" onclick="selectCalDay('${ds}')">${d}</div>`);
  }

  wrap.innerHTML = `<div class="cal-grid">${cells.join('')}</div>`;
}

async function selectCalDay(ds) {
  calSel = ds;
  // обновить визуальный выбор
  document.querySelectorAll('.cal-cell[data-date]').forEach(el => {
    el.classList.toggle('is-sel', el.dataset.date === ds);
  });

  const detail = document.getElementById("cal-day-detail");
  if (!detail) return;
  detail.innerHTML = `<div style="padding:10px 0;color:var(--muted);font-size:12px">Загружаю...</div>`;

  const data = await api("GET", `/api/diary/food?date=${ds}`);
  const logs = data.logs || [];
  const d    = new Date(ds + 'T12:00:00');
  const lbl  = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });

  if (!logs.length) {
    detail.innerHTML = `<div class="cal-day-detail"><div class="cal-day-title">${lbl}</div><div style="font-size:12px;color:var(--muted)">Нет записей</div></div>`;
    return;
  }

  const t = logs.reduce((a,l) => ({cal:a.cal+l.calories,p:a.p+l.protein,f:a.f+l.fat,c:a.c+l.carbs}),{cal:0,p:0,f:0,c:0});
  const items = logs.map(l => `
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600">${l.food_name}</div>
      <div style="font-size:12px;color:var(--muted);flex-shrink:0;margin-left:8px">${l.calories} ккал</div>
    </div>`).join('');

  detail.innerHTML = `
    <div class="cal-day-detail">
      <div class="cal-day-title">${lbl}</div>
      ${items}
      <div class="food-total" style="margin-top:10px">
        <div class="food-total-item"><div class="food-total-val">${Math.round(t.cal)}</div><div class="food-total-lbl">ккал</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.p.toFixed(1)}г</div><div class="food-total-lbl">белки</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.f.toFixed(1)}г</div><div class="food-total-lbl">жиры</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.c.toFixed(1)}г</div><div class="food-total-lbl">углев.</div></div>
      </div>
    </div>`;
}

function calChangeMonth(dir) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + dir, 1);
  const nm = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if (nm > new Date().toISOString().slice(0,7)) return; // не в будущее
  calMonth = nm;
  calSel = null;
  document.getElementById("cal-day-detail").innerHTML = "";
  loadCalendar();
}

async function deleteFoodLog(id) {

}

async function compressImage(file, maxWidth = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75).split(",")[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let waterGlassesCurrent = 0;
const WATER_GOAL = 8;

// legacy SVG helpers kept for backward compat
const WATER_R = 70;
const WATER_C = +(2 * Math.PI * WATER_R).toFixed(2);

function _waterRingSVG(glasses) {
  const offset = +(WATER_C * (1 - glasses / WATER_GOAL)).toFixed(2);
  return `<svg viewBox="0 0 180 180" width="160" height="160">
    <defs>
      <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5bb8f0"/>
        <stop offset="100%" stop-color="#2178b4"/>
      </linearGradient>
    </defs>
    <circle cx="90" cy="90" r="${WATER_R}" fill="none" stroke="rgba(74,159,207,.13)" stroke-width="13"/>
    <circle id="water-arc" cx="90" cy="90" r="${WATER_R}" fill="none" stroke="url(#wg)" stroke-width="13"
      stroke-linecap="round"
      stroke-dasharray="${WATER_C}"
      stroke-dashoffset="${offset}"
      transform="rotate(-90 90 90)"
      style="transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function buildWaterTracker(glasses) {
  waterGlassesCurrent = glasses;
  return `
    <div class="card" style="margin-bottom:10px">
      <span class="label">Вода</span>
      <div class="water-ring-wrap">
        <div class="water-ring-inner">
          <div id="water-ring-svg">${_waterRingSVG(glasses)}</div>
          <div class="water-ring-center">
            <div style="font-size:16px;margin-bottom:2px">💧</div>
            <div class="water-ring-num" id="water-num">${glasses}</div>
            <div class="water-ring-sub">из ${WATER_GOAL} стаканов</div>
          </div>
        </div>
      </div>
      <button class="btn" style="width:100%" id="water-add-btn" onclick="adjustWater(1)">+ Выпил стакан</button>
    </div>`;
}

function _refreshWaterUI(prevGlasses) {
  const offset = +(WATER_C * (1 - waterGlassesCurrent / WATER_GOAL)).toFixed(2);
  const arc  = document.getElementById("water-arc");
  const num  = document.getElementById("water-num");
  const ring = document.getElementById("water-ring-svg");
  const btn  = document.getElementById("water-add-btn");
  if (arc) arc.setAttribute("stroke-dashoffset", offset);
  if (num) num.textContent = waterGlassesCurrent;
  if (btn) btn.disabled = waterGlassesCurrent >= WATER_GOAL;
  if (ring && waterGlassesCurrent === WATER_GOAL && prevGlasses < WATER_GOAL) {
    ring.classList.remove("water-ring-complete");
    void ring.offsetWidth; // reflow чтобы анимация перезапустилась
    ring.classList.add("water-ring-complete");
  }
}

async function adjustWater(delta) {
  if (waterGlassesCurrent >= WATER_GOAL && delta > 0) return;
  const prev = waterGlassesCurrent;
  waterGlassesCurrent = Math.max(0, Math.min(WATER_GOAL, waterGlassesCurrent + delta));
  _refreshWaterUI(prev);
  try {
    await api("POST", "/api/diary/water/set", { glasses: waterGlassesCurrent });
  } catch(e) { console.error("water save error:", e); }
}

async function saveGoals() {
  const cal = parseInt(document.getElementById("g-cal")?.value) || 2000;
  const p   = parseFloat(document.getElementById("g-p")?.value)  || 80;
  const f   = parseFloat(document.getElementById("g-f")?.value)  || 70;
  const c   = parseFloat(document.getElementById("g-c")?.value)  || 250;
  try {
    await api("POST", "/api/diary/goals", { calories: cal, protein: p, fat: f, carbs: c });

    toast("Цели сохранены");
    await loadDiary();
  } catch(e) { toast("Ошибка: " + e.message); }

function buildCalendarStrip(selectedDate) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = -3; i <= 3; i++) {
    const d = new Date(today); d.setDate(d.getDate() + i); days.push(d);
  }
  const html = days.map(d => {
    const ds = d.toISOString().split("T")[0];
    const active = ds === selectedDate ? " active" : "";
    return `<button class="diary-cal-day${active}" onclick="switchDiaryDate('${ds}')">
      <span class="diary-cal-dow">${DAYS_RU[d.getDay()]}</span>
      <span class="diary-cal-num">${d.getDate()}</span>
    </button>`;
  }).join("");
  return `<div class="diary-cal-strip">${html}</div>`;
}

function buildKBJURings(logs, goals) {
  const t = logs.reduce((a, l) => ({
    cal: a.cal + (l.calories || 0),
    p:   a.p   + (l.protein  || 0),
    f:   a.f   + (l.fat      || 0),
    c:   a.c   + (l.carbs    || 0),
  }), { cal: 0, p: 0, f: 0, c: 0 });

  const rings = [
    { label: 'Ккал',  val: Math.round(t.cal), goal: goals.calories, color: '#4CAF50', unit: '' },
    { label: 'Белки', val: Math.round(t.p),   goal: goals.protein,  color: '#5b8ee6', unit: 'г' },
    { label: 'Жиры',  val: Math.round(t.f),   goal: goals.fat,      color: '#e68a3f', unit: 'г' },
    { label: 'Углев', val: Math.round(t.c),   goal: goals.carbs,    color: '#9b6fe6', unit: 'г' },
  ];
  const R = 26, SZ = 64, C = +(2 * Math.PI * R).toFixed(2);
  const ringsHtml = rings.map(r => {
    const pct = r.goal > 0 ? Math.min(1, r.val / r.goal) : 0;
    const offset = +(C * (1 - pct)).toFixed(2);
    return `
      <div class="diary-ring-wrap">
        <div class="diary-ring-svg-wrap">
          <svg viewBox="0 0 ${SZ} ${SZ}" width="${SZ}" height="${SZ}">
            <circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--border)" stroke-width="5"/>
            <circle cx="32" cy="32" r="${R}" fill="none" stroke="${r.color}" stroke-width="5"
                    stroke-dasharray="${C}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
          </svg>
          <div class="diary-ring-center">
            <div class="diary-ring-val">${r.val}${r.unit ? `<span style="font-size:9px;font-weight:400">${r.unit}</span>` : ''}</div>
          </div>
        </div>
        <div class="diary-ring-lbl">${r.label}</div>
      </div>`;
  }).join("");
  return `
    <div class="diary-section">
      <div class="diary-section-head">
        <span class="diary-section-title">КБЖУ</span>
        <button style="background:none;border:none;color:var(--green2);font-size:12px;font-weight:600;cursor:pointer"
                onclick="openGoalsModal(${goals.calories},${goals.protein},${goals.fat},${goals.carbs})">Изменить цели</button>
      </div>
      <div class="diary-kbju-rings">${ringsHtml}</div>
    </div>`;
}
