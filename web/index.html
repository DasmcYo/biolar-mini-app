<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar Organics</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green:   #3db87a;
    --green2:  #2ea066;
    --bg:      #f4f7f4;
    --card:    #ffffff;
    --text:    #1a2a1a;
    --muted:   #7a8f7a;
    --border:  #e0ece0;
    --danger:  #e05050;
    --radius:  14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* NAV */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 10px 4px 8px;
    font-size: 11px; color: var(--muted);
    background: none; border: none; cursor: pointer;
    transition: color .15s;
  }
  .nav-btn .icon { font-size: 22px; margin-bottom: 3px; }
  .nav-btn.active { color: var(--green); }

  /* SCREENS */
  .screen { display: none; padding: 16px; animation: fadeIn .2s; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: #fff; border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p  { font-size: 14px; opacity: .85; margin-top: 4px; }

  /* CARD */
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 16px;
    margin-bottom: 12px;
  }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .card-sub   { font-size: 13px; color: var(--muted); }

  /* BUTTON */
  .btn {
    display: block; width: 100%; padding: 14px;
    background: var(--green); color: #fff;
    border: none; border-radius: var(--radius);
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .btn:active { background: var(--green2); }
  .btn.secondary {
    background: none; color: var(--green);
    border: 2px solid var(--green);
  }
  .btn.danger { background: var(--danger); }
  .btn + .btn { margin-top: 10px; }

  /* QUIZ */
  .quiz-question { font-size: 18px; font-weight: 700; margin-bottom: 20px; line-height: 1.3; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    font-size: 15px; cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .quiz-option:active, .quiz-option.selected {
    border-color: var(--green); background: #edf7f0;
  }
  .quiz-back {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 14px;
    background: none; border: none; cursor: pointer;
    margin-bottom: 16px; padding: 0;
  }

  /* PRODUCT RESULT CARD */
  .product-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 16px;
    margin-bottom: 12px;
  }
  .product-emoji { font-size: 28px; margin-bottom: 8px; }
  .product-name  { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .product-tag   { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .product-benefits { list-style: none; margin-bottom: 14px; }
  .product-benefits li { font-size: 13px; padding: 2px 0; }
  .product-benefits li::before { content: "✓ "; color: var(--green); font-weight: 700; }
  .product-links { display: flex; gap: 8px; }
  .product-links a {
    flex: 1; padding: 10px; text-align: center; border-radius: 10px;
    font-size: 13px; font-weight: 600; text-decoration: none; color: #fff;
  }
  .link-wb   { background: #cb11ab; }
  .link-ozon { background: #005bff; }
  .btn-add-tracker {
    width: 100%; margin-top: 10px; padding: 10px;
    background: none; border: 2px solid var(--green);
    border-radius: 10px; color: var(--green);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-add-tracker.added {
    background: var(--green); color: #fff; border-color: var(--green);
  }

  /* SMART QUIZ */
  .quiz-progress-wrap {
    background: var(--border); border-radius: 99px; height: 6px;
    margin-bottom: 20px; overflow: hidden;
  }
  .quiz-progress-bar {
    background: var(--green); height: 100%; border-radius: 99px; transition: width .4s;
  }
  .quiz-step-label {
    font-size: 12px; color: var(--muted); margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .quiz-title { font-size: 20px; font-weight: 700; margin-bottom: 22px; line-height: 1.3; }
  .quiz-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .quiz-card {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 12px;
    text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .quiz-card .card-emoji { font-size: 28px; margin-bottom: 6px; }
  .quiz-card .card-text  { font-size: 14px; font-weight: 600; }
  .quiz-card.selected    { border-color: var(--green); background: #edf7f0; }
  .quiz-chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .quiz-chip {
    background: var(--card); border: 2px solid var(--border);
    border-radius: 99px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    transition: border-color .15s, background .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .quiz-chip.selected { border-color: var(--green); background: #edf7f0; color: var(--green); font-weight: 600; }
  .scale-wrap { display: flex; gap: 8px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 14px 4px; text-align: center;
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .scale-seg.selected { border-color: var(--green); background: #edf7f0; }
  .scale-num   { font-size: 20px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: var(--green); }
  .scale-label { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .analysis-block {
    background: #edf7f0; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
  }
  .analysis-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--green); }
  .analysis-list  { list-style: none; }
  .analysis-list li { font-size: 14px; padding: 3px 0; }
  .analysis-list li::before { content: "▸ "; color: var(--green); }
  .product-reason {
    background: #f0f8f4; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px;
    font-size: 13px; line-height: 1.5;
    border-left: 3px solid var(--green);
  }

  /* TRACKER */
  .tracker-item {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 14px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .tracker-check {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--border); background: none;
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .tracker-check.done { background: var(--green); border-color: var(--green); color: #fff; }
  .tracker-info { flex: 1; }
  .tracker-name   { font-size: 14px; font-weight: 600; }
  .tracker-streak { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tracker-del {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 4px;
  }
  .streak-fire { color: #ff6b00; }
  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  /* REFERRAL */
  .ref-progress {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 16px; margin-bottom: 12px;
  }
  .ref-count { font-size: 36px; font-weight: 700; color: var(--green); }
  .ref-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ref-bar-wrap { background: var(--border); border-radius: 99px; height: 8px; margin: 14px 0 8px; overflow: hidden; }
  .ref-bar { background: var(--green); height: 100%; border-radius: 99px; transition: width .4s; }
  .ref-next { font-size: 13px; color: var(--muted); }
  .levels { list-style: none; }
  .levels li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .levels li:last-child { border: none; }
  .level-badge {
    background: #edf7f0; color: var(--green);
    border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }
  .level-badge.done { background: var(--green); color: #fff; }

  /* GIVEAWAY */
  .giveaway-hero {
    background: linear-gradient(135deg, #ff6b00, #ff9f00);
    color: #fff; border-radius: var(--radius); padding: 24px;
    text-align: center; margin-bottom: 16px;
  }
  .giveaway-hero .big { font-size: 52px; margin-bottom: 8px; }
  .giveaway-hero h2 { font-size: 20px; font-weight: 700; }
  .giveaway-hero p  { font-size: 14px; opacity: .9; margin-top: 6px; }
  .participants-count {
    font-size: 32px; font-weight: 700; color: var(--green); text-align: center; margin: 12px 0 4px;
  }
  .participants-label { text-align: center; font-size: 13px; color: var(--muted); }

  /* SPINNER */
  .spinner {
    display: flex; justify-content: center; align-items: center; padding: 40px;
  }
  .spinner::after {
    content: ""; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 20px;
    border-radius: 99px; font-size: 14px; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- SCREENS -->
<div id="screen-quiz"     class="screen active"></div>
<div id="screen-tracker"  class="screen"></div>
<div id="screen-referral" class="screen"></div>
<div id="screen-giveaway" class="screen"></div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('quiz')"     id="nav-quiz">
    <span class="icon">🌿</span>Квиз
  </button>
  <button class="nav-btn" onclick="showScreen('tracker')"  id="nav-tracker">
    <span class="icon">📅</span>Трекер
  </button>
  <button class="nav-btn" onclick="showScreen('referral')" id="nav-referral">
    <span class="icon">🔗</span>Друзья
  </button>
  <button class="nav-btn" onclick="showScreen('giveaway')" id="nav-giveaway">
    <span class="icon">🎁</span>Розыгрыш
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── Утилиты ───────────────────────────────────────────────────────────────────

function api(method, path, body) {
  return fetch(path, {
    method,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": initData,
    },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json());
}

function toast(msg, ms = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "tracker")  loadTracker();
  if (name === "referral") loadReferral();
  if (name === "giveaway") loadGiveaway();
}

// ── Инициализация пользователя ────────────────────────────────────────────────

const urlParams = new URLSearchParams(location.search);
const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;

api("POST", "/api/user/init", { ref }).catch(() => {});

// ── УМНЫЙ КВИЗ (9 шагов) ─────────────────────────────────────────────────────

const QUIZ_BASE_STEPS = [
  {
    id: "gender", title: "Укажи свой пол", type: "grid", options: [
      {id:"female", emoji:"👩", text:"Женщина"},
      {id:"male",   emoji:"👨", text:"Мужчина"},
    ]
  },
  {
    id: "age", title: "Сколько тебе лет?", type: "grid", options: [
      {id:"18-25", emoji:"🌱", text:"18–25"},
      {id:"26-35", emoji:"🌿", text:"26–35"},
      {id:"36-45", emoji:"🌳", text:"36–45"},
      {id:"45+",   emoji:"🍂", text:"45+"},
    ]
  },
  {
    id: "goal", title: "Какая у тебя основная цель?", type: "grid", options: [
      {id:"energy",       emoji:"⚡",  text:"Энергия и бодрость"},
      {id:"sleep",        emoji:"😴",  text:"Улучшить сон"},
      {id:"immunity",     emoji:"🛡️", text:"Иммунитет"},
      {id:"brain",        emoji:"🧠",  text:"Мозг и фокус"},
      {id:"women_health", emoji:"🌸",  text:"Женское здоровье"},
      {id:"thyroid",      emoji:"🦋",  text:"Щитовидная железа"},
      {id:"beauty",       emoji:"✨",  text:"Кожа и волосы"},
      {id:"weight",       emoji:"⚖️", text:"Контроль веса"},
    ]
  },
  {
    id: "symptoms", title: "Отметь симптомы (если есть)", type: "multiselect", options: [
      {id:"fatigue",    emoji:"😴", text:"Постоянная усталость"},
      {id:"anemia",     emoji:"🩸", text:"Анемия / дефицит железа"},
      {id:"hair_loss",  emoji:"💇", text:"Выпадение волос"},
      {id:"often_sick", emoji:"🤧", text:"Часто болею"},
      {id:"low_sun",    emoji:"☀️", text:"Мало бываю на солнце"},
      {id:"brain_fog",  emoji:"🌫️", text:"Туман в голове"},
      {id:"anxiety",    emoji:"😰", text:"Тревожность / раздражительность"},
    ]
  },
  {
    id: "stress", title: "Оцени уровень своего стресса", type: "scale", options: [
      {id:1, label:"Нет"},
      {id:2, label:"Умер."},
      {id:3, label:"Высокий"},
      {id:4, label:"Хрон."},
    ]
  },
  {
    id: "sleep_q", title: "Как ты оцениваешь качество своего сна?", type: "scale", options: [
      {id:1, label:"Плохо"},
      {id:2, label:"Неплохо"},
      {id:3, label:"Хорошо"},
      {id:4, label:"Отлично"},
    ]
  },
  {
    id: "diet", title: "Как ты питаешься?", type: "grid", options: [
      {id:"balanced", emoji:"🥗", text:"Сбалансированно"},
      {id:"low_meat", emoji:"🥦", text:"Редко ем мясо"},
      {id:"vegan",    emoji:"🌱", text:"Веганство"},
      {id:"sugary",   emoji:"🍰", text:"Много сладкого"},
    ]
  },
  {
    id: "women_health", title: "Уточни по женскому здоровью", type: "grid", femaleOnly: true, options: [
      {id:"normal",    emoji:"🌺", text:"Всё в порядке"},
      {id:"pms",       emoji:"🌙", text:"ПМС"},
      {id:"pcos",      emoji:"🔄", text:"СПКЯ"},
      {id:"thyroid_f", emoji:"🦋", text:"Щитовидная"},
      {id:"fertility", emoji:"🤰", text:"Фертильность / ЭКО"},
    ]
  },
];

let quizAnswers     = {};
let quizStepIdx     = 0;
let quizActiveSteps = [];
let quizSymptoms    = new Set();
const addedToTracker = new Set();

function getActiveSteps() {
  return QUIZ_BASE_STEPS.filter(s => !(s.femaleOnly && quizAnswers.gender !== "female"));
}

function renderQuiz() {
  quizActiveSteps = getActiveSteps();
  const step    = quizActiveSteps[quizStepIdx];
  if (!step) { showSmartResults(); return; }

  const total   = quizActiveSteps.length;
  const current = quizStepIdx + 1;
  const pct     = Math.round((quizStepIdx / total) * 100);

  let body = "";

  if (step.type === "grid") {
    body = `<div class="quiz-grid">` +
      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             data-id="${o.id}"
             onclick="selectCard('${step.id}', '${o.id}', this)">
          <div class="card-emoji">${o.emoji}</div>
          <div class="card-text">${o.text}</div>
        </div>`).join("") +
      `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chip-wrap">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}', this)">
          ${o.emoji} ${o.text}
        </div>`).join("") +
      `</div>
      <button class="btn" onclick="advanceQuiz()">Продолжить →</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-wrap">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}', ${o.id}, this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-label">${o.label}</div>
        </div>`).join("") +
      `</div>`;
  }

  const backBtn = quizStepIdx > 0
    ? `<button class="btn secondary" style="margin-top:12px" onclick="backQuiz()">← Назад</button>`
    : "";

  document.getElementById("screen-quiz").innerHTML = `
    <div class="quiz-step-label">Шаг ${current} из ${total}</div>
    <div class="quiz-progress-wrap">
      <div class="quiz-progress-bar" style="width:${pct}%"></div>
    </div>
    <div class="quiz-title">${step.title}</div>
    ${body}
    ${backBtn}
  `;
}

function selectCard(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".quiz-grid").querySelectorAll(".quiz-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 220);
}

function toggleChip(id, el) {
  if (quizSymptoms.has(id)) { quizSymptoms.delete(id); el.classList.remove("selected"); }
  else                       { quizSymptoms.add(id);    el.classList.add("selected"); }
}

function selectScale(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".scale-wrap").querySelectorAll(".scale-seg").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 270);
}

function advanceQuiz() {
  const step = quizActiveSteps[quizStepIdx];
  if (step.type !== "multiselect" && !quizAnswers[step.id]) { toast("Выбери один из вариантов"); return; }
  quizStepIdx++;
  quizActiveSteps = getActiveSteps();
  if (quizStepIdx >= quizActiveSteps.length) showSmartResults();
  else renderQuiz();
}

function backQuiz() {
  if (quizStepIdx > 0) { quizStepIdx--; renderQuiz(); }
}

async function showSmartResults() {
  const screen = document.getElementById("screen-quiz");
  screen.innerHTML = '<div class="spinner"></div>';

  const payload = {
    gender:       quizAnswers.gender       || "female",
    age:          quizAnswers.age          || "26-35",
    goal:         quizAnswers.goal         || "energy",
    symptoms:     [...quizSymptoms],
    stress:       quizAnswers.stress       || 1,
    sleep_q:      quizAnswers.sleep_q      || 4,
    diet:         quizAnswers.diet         || "balanced",
    women_health: quizAnswers.women_health || null,
  };

  const data     = await api("POST", "/api/quiz/smart-result", payload);
  const products = data.products || [];
  const analysis = data.analysis || [];

  if (!products.length) {
    screen.innerHTML = `<div class="empty-state"><div class="big">🤔</div><p>Ничего не нашли — напиши нам напрямую!</p></div>`;
    return;
  }

  const analysisHtml = analysis.length ? `
    <div class="analysis-block">
      <div class="analysis-title">📋 Что мы выявили</div>
      <ul class="analysis-list">${analysis.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>` : "";

  const productsHtml = products.map(p => {
    const benefits = (p.benefits || []).map(b => `<li>${b}</li>`).join("");
    const added    = addedToTracker.has(p.id);
    return `
      <div class="product-card">
        <div class="product-emoji">${p.emoji}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-tag">${p.tagline}</div>
        <div class="product-reason">💡 ${p.reason}</div>
        <ul class="product-benefits">${benefits}</ul>
        <div class="product-links">
          <a class="link-wb"   href="${p.wb_url}"   target="_blank">WB</a>
          <a class="link-ozon" href="${p.ozon_url}" target="_blank">Ozon</a>
        </div>
        <button class="btn-add-tracker ${added ? 'added' : ''}"
                id="add-btn-${p.id}"
                onclick="addToTracker('${p.id}')">
          ${added ? "✓ Добавлено в трекер" : "+ Добавить в трекер"}
        </button>
      </div>`;
  }).join("");

  screen.innerHTML = `
    <button class="quiz-back" onclick="restartQuiz()">← Пройти заново</button>
    <div class="header">
      <h1>Твоя программа ✅</h1>
      <p>Персональный подбор на основе твоих ответов</p>
    </div>
    ${analysisHtml}
    ${productsHtml}
  `;
}

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "✓ Добавлено в трекер"; btn.classList.add("added"); }
  toast("Добавлено в трекер 🌿");
}

function restartQuiz() {
  quizAnswers  = {};
  quizStepIdx  = 0;
  quizSymptoms = new Set();
  renderWelcome();
}

function renderWelcome() {
  const name = user.first_name ? `, ${user.first_name}` : "";
  document.getElementById("screen-quiz").innerHTML = `
    <div style="min-height:calc(100vh - 100px);display:flex;flex-direction:column;justify-content:center;padding:8px 0 24px">

      <div style="text-align:center;margin-bottom:32px">
        <div style="font-size:56px;margin-bottom:16px">🌿</div>
        <div style="font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:20px">Biolar Organics</div>
        <div style="font-size:26px;font-weight:800;line-height:1.25;color:var(--text);margin-bottom:12px">
          Привет${name}! 👋<br>Ты уверен, что пьёшь<br>то, что нужно именно тебе?
        </div>
        <div style="font-size:14px;color:var(--muted);line-height:1.6;max-width:280px;margin:0 auto">
          Большинство берут добавки наугад.<br>
          Мы зададим 8 вопросов и подберём программу точно под твой организм.

}

renderWelcome();

// ── ТРЕКЕР ────────────────────────────────────────────────────────────────────

async function loadTracker() {
  const screen = document.getElementById("screen-tracker");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/tracker");
  const products = data.products || [];

  if (!products.length) {
    screen.innerHTML = `
      <div class="empty-state">
        <div class="big">📅</div>
        <p>Пока ничего нет.<br>Пройди квиз и добавь продукты в трекер.</p>
      </div>
      <button class="btn secondary" onclick="showScreen('quiz')">Пройти квиз</button>`;
    return;
  }

  const today = new Date().toLocaleDateString("ru", { day: "numeric", month: "long" });
  let html = `
    <div class="header">
      <h1>📅 Трекер</h1>
      <p>Сегодня, ${today}</p>
    </div>`;

  for (const p of products) {
    const fire = p.streak >= 7 ? " 🔥" : p.streak >= 3 ? " ✨" : "";
    const streakText = p.streak > 0 ? `${p.streak} дн. подряд${fire}` : "Начни сегодня";
    html += `
      <div class="tracker-item" id="tracker-${p.product_id}">
        <button class="tracker-check ${p.taken_today ? 'done' : ''}"
                onclick="logIntake('${p.product_id}', this)">
          ${p.taken_today ? "✓" : ""}
        </button>
        <div class="tracker-info">
          <div class="tracker-name">${p.product_name}</div>
          <div class="tracker-streak">${streakText}</div>
        </div>
        <button class="tracker-del" onclick="removeProduct('${p.product_id}')">×</button>
      </div>`;
  }
  screen.innerHTML = html;
}

async function logIntake(productId, btn) {
  if (btn.classList.contains("done")) { toast("Уже отмечено на сегодня ✓"); return; }
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) { toast("Уже отмечено на сегодня ✓"); return; }

  btn.classList.add("done");
  btn.textContent = "✓";
  const item = btn.closest(".tracker-item");
  const streakEl = item.querySelector(".tracker-streak");
  const s = data.streak;
  const fire = s >= 7 ? " 🔥" : s >= 3 ? " ✨" : "";
  streakEl.textContent = `${s} дн. подряд${fire}`;
  if (s > 0 && s % 7 === 0) toast(`${s} дней подряд! 🔥`);
  else toast("Отмечено ✓");
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено из трекера");
}

// ── РЕФЕРАЛКА ─────────────────────────────────────────────────────────────────

async function loadReferral() {
  const screen = document.getElementById("screen-referral");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/referral");

  const nextCount  = data.next_level?.count  || data.levels[data.levels.length - 1].count;
  const nextReward = data.next_level?.reward || "Максимальный уровень достигнут! 🎉";
  const progress   = Math.min((data.ref_count / nextCount) * 100, 100);

  const botUsername = "Biolarapp_bot";
  const refLink = `https://t.me/${botUsername}?start=ref_${data.ref_code}`;
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Подбери добавки под свою цель 🌿")}`;

  const levelsHtml = data.levels.map(l => `
    <li>
      <span class="level-badge ${data.ref_count >= l.count ? 'done' : ''}">${l.count} чел.</span>
      ${l.reward}
      ${data.ref_count >= l.count ? "✅" : ""}
    </li>`).join("");

  screen.innerHTML = `
    <div class="header">
      <h1>🔗 Приглашай друзей</h1>
      <p>Получай скидки за каждого приглашённого</p>
    </div>

    <div class="ref-progress">
      <div class="ref-count">${data.ref_count}</div>
      <div class="ref-label">приглашённых друзей</div>
      <div class="ref-bar-wrap">
        <div class="ref-bar" style="width:${progress}%"></div>
      </div>
      <div class="ref-next">До следующей награды: <strong>${nextReward}</strong></div>
    </div>

    <div class="card">
      <div class="card-title">Уровни наград</div>
      <ul class="levels">${levelsHtml}</ul>
    </div>

    <button class="btn" onclick="window.open('${shareUrl}', '_blank')">
      📤 Поделиться ссылкой
    </button>
    <button class="btn secondary" onclick="copyRef('${refLink}')">
      📋 Скопировать ссылку
    </button>`;
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована!"));
}

  btn.closest(".screen").querySelector(".participants-count").textContent = count;
  btn.replaceWith(Object.assign(document.createElement("div"), {
    className: "card",
    style: "text-align:center;color:var(--green);font-weight:700",
    textContent: "✅ Ты в игре! Удачи 🍀",
  }));
