<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:     #f7f3ed;
    --card:   #ffffff;
    --green:  #2c4a2e;
    --green2: #4a7c59;
    --gold:   #c4965a;
    --gold2:  #dab07a;
    --text:   #1c1c1a;
    --muted:  #8c8070;
    --border: rgba(44,74,46,0.1);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(247,243,237,0.94);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1; padding: 16px 4px 13px;
    font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: #c0b4a4; background: none; border: none; cursor: pointer;
    transition: color .15s; position: relative;
  }
  .nav-btn::before {
    content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 1.5px;
    background: linear-gradient(90deg, var(--green), var(--green2));
    opacity: 0; transition: opacity .2s;
  }
  .nav-btn.active { color: var(--green); }
  .nav-btn.active::before { opacity: 1; }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px 16px; animation: fadeIn .18s; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* ── PRIMITIVES ── */
  .label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);
  }
  .serif { font-family: 'DM Serif Display', Georgia, serif; }

  .btn {
    display: block; width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    color: #f7f3ed; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; letter-spacing: .3px;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { opacity: .82; transform: scale(.99); }
  .btn.outline {
    background: transparent; color: var(--green);
    border: 1.5px solid rgba(44,74,46,0.22);
  }
  .btn.gold-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
    color: #1c1c1a;
  }
  .btn + .btn { margin-top: 8px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(44,74,46,0.05);
  }

  .spinner { display: flex; justify-content: center; padding: 60px; }
  .spinner::after {
    content: ""; width: 24px; height: 24px;
    border: 2px solid rgba(44,74,46,0.12); border-top-color: var(--green);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #f7f3ed;
    padding: 10px 22px; border-radius: 99px;
    font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ══ ГЛАВНАЯ ════════════════════════════════════════════════════════════════ */

  .home-greeting { margin-bottom: 20px; }
  .home-greeting .label { margin-bottom: 6px; }
  .home-greeting-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px; letter-spacing: -.3px; line-height: 1.1;
  }

  .streak-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 6px 24px rgba(44,74,46,0.18);
  }
  .streak-card-left .label { color: rgba(247,243,237,0.55); margin-bottom: 4px; }
  .streak-num {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 48px; color: #f7f3ed; line-height: 1; letter-spacing: -2px;
  }
  .streak-sub { font-size: 12px; color: rgba(247,243,237,0.65); margin-top: 2px; }
  .streak-card-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .stat-pill {
    background: rgba(247,243,237,0.15); border-radius: 99px;
    padding: 5px 12px; font-size: 11px; color: rgba(247,243,237,0.8);
    font-weight: 600; letter-spacing: .3px;
  }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head .label { color: var(--muted); }
  .section-link {
    font-size: 11px; font-weight: 700; color: var(--green);
    letter-spacing: .3px; background: none; border: none; cursor: pointer; padding: 0;
  }

  /* Мини-курс на главной */
  .mini-task {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 8px;
    box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .mini-check {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .mini-check.done {
    background: linear-gradient(135deg, var(--green), var(--green2));
    border-color: transparent; color: #f7f3ed;
  }
  .mini-task-name { font-size: 13px; font-weight: 600; flex: 1; }

  /* Wellness виджет на главной */
  .wellness-widget {
    background: linear-gradient(135deg, #fdf9f4 0%, #f0f5ef 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 10px;
  }
  .wellness-scores { display: flex; gap: 12px; margin-top: 12px; }
  .ws-item { flex: 1; text-align: center; }
  .ws-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 28px; line-height: 1; margin-bottom: 4px;
  }
  .ws-val.energy { color: #e8a020; }
  .ws-val.sleep  { color: var(--green2); }
  .ws-val.mood   { color: var(--gold); }
  .ws-label { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }

  /* Контент-карточки */
  .content-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 8px;
    box-shadow: 0 1px 8px rgba(44,74,46,0.04);
    cursor: pointer;
  }
  .content-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green2); margin-bottom: 8px; }
  .content-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .content-preview { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .content-body { font-size: 13px; color: var(--text); line-height: 1.7; margin-top: 10px; display: none; }
  .content-body.open { display: block; }
  .content-toggle {
    font-size: 11px; font-weight: 700; color: var(--green);
    background: none; border: none; cursor: pointer;
    margin-top: 10px; padding: 0; letter-spacing: .3px;
  }

  /* ══ ПРОГРАММА ══════════════════════════════════════════════════════════════ */

  /* 30-day progress */
  .course-banner {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
    border-radius: 18px; padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(196,150,90,0.25);
    color: #1c1c1a;
  }
  .course-banner .label { color: rgba(28,28,26,0.55); margin-bottom: 4px; }
  .course-day-num {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 48px; line-height: 1; letter-spacing: -2px; margin-bottom: 8px;
  }
  .course-prog-wrap { height: 4px; background: rgba(28,28,26,0.15); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .course-prog-bar  { height: 100%; background: rgba(28,28,26,0.55); border-radius: 99px; transition: width .5s; }
  .course-prog-sub  { font-size: 11px; color: rgba(28,28,26,0.55); font-weight: 600; letter-spacing: .3px; }

  /* Quiz inside program */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .quiz-counter { font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
  .quiz-prog-wrap { height: 2px; background: rgba(196,150,90,0.2); border-radius: 99px; margin-bottom: 32px; overflow: hidden; }
  .quiz-prog-bar  { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .4s; }
  .quiz-q {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; line-height: 1.2; letter-spacing: -.2px; margin-bottom: 24px;
  }
  .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .quiz-card {
    position: relative;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 18px 14px; font-size: 14px; font-weight: 500; text-align: center;
    cursor: pointer; color: var(--text); line-height: 1.35;
    transition: all .18s; box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .quiz-card:active { transform: scale(.97); }
  .quiz-card.selected {
    background: linear-gradient(135deg, var(--green) 0%, #3d6b4a 100%);
    border-color: transparent; color: #f7f3ed;
    box-shadow: 0 4px 16px rgba(44,74,46,0.22);
  }
  .quiz-card.selected::after {
    content: "✓"; position: absolute; top: 9px; right: 11px;
    font-size: 10px; color: rgba(247,243,237,0.6); font-weight: 700;
  }
  .quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .quiz-chip {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 99px;
    padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: all .18s;
  }
  .quiz-chip.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; color: #f7f3ed; }
  .scale-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 13px 4px; text-align: center;
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all .18s;
  }
  .scale-seg.selected { background: linear-gradient(135deg, var(--green), #3d6b4a); border-color: transparent; box-shadow: 0 4px 14px rgba(44,74,46,0.2); }
  .scale-num { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: #f7f3ed; }
  .scale-lbl { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .scale-seg.selected .scale-lbl { color: rgba(247,243,237,0.7); }
  .back-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0; margin-top: 16px; }

  /* Results */
  .results-hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 24px 22px; margin-bottom: 20px;
    box-shadow: 0 8px 28px rgba(44,74,46,0.2);
  }
  .results-hero .label { color: rgba(247,243,237,0.55); margin-bottom: 6px; }
  .results-hero-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 28px; color: #f7f3ed; line-height: 1.1; }

  .analysis-block {
    background: linear-gradient(135deg, #eef5ee 0%, #f7f3ed 100%);
    border: 1px solid rgba(44,74,46,0.1); border-left: 3px solid var(--green);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .analysis-block .label { color: var(--green); margin-bottom: 10px; }
  .analysis-list { list-style: none; margin-top: 10px; }
  .analysis-list li { font-size: 13px; padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .analysis-list li::before { content: ""; display: inline-block; flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--green); margin-top: 8px; }

  .product-card {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(44,74,46,0.06);
  }
  .product-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .product-tag  { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
  .product-reason-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .product-reason-txt { font-size: 13px; line-height: 1.6; padding-left: 12px; border-left: 2.5px solid var(--gold); margin-bottom: 16px; }
  .product-benefits { list-style: none; margin-bottom: 18px; }
  .product-benefits li { font-size: 13px; color: var(--muted); padding: 3px 0; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .product-benefits li::before { content: ""; display: inline-block; flex-shrink: 0; width: 3px; height: 3px; border-radius: 50%; background: #c8bfb2; margin-top: 9px; }
  .product-links { display: flex; gap: 8px; margin-bottom: 10px; }
  .product-links a { flex: 1; padding: 10px; text-align: center; border-radius: 9px; font-size: 12px; font-weight: 700; text-decoration: none; letter-spacing: .3px; }
  .link-wb   { background: rgba(203,17,171,.08); color: #b050a0; border: 1px solid rgba(203,17,171,.18); }
  .link-ozon { background: rgba(0,91,255,.07); color: #4070e0; border: 1px solid rgba(0,91,255,.18); }
  .btn-course {
    width: 100%; padding: 11px; background: transparent;
    border: 1.5px solid rgba(44,74,46,0.18); border-radius: 9px;
    color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: all .18s;
  }
  .btn-course.added { background: linear-gradient(135deg, #eef5ee, #f7f3ed); border-color: var(--green2); color: var(--green); }

  /* Tracker list */
  .course-item {
    background: linear-gradient(180deg, #fff 0%, #faf7f2 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 2px 10px rgba(44,74,46,0.04);
  }
  .course-check {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .2s;
  }
  .course-check.done { background: linear-gradient(135deg, var(--green), var(--green2)); border-color: transparent; color: #f7f3ed; box-shadow: 0 3px 10px rgba(44,74,46,0.2); }
  .course-info { flex: 1; }
  .course-name   { font-size: 14px; font-weight: 600; }
  .course-streak { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .course-del { background: none; border: none; color: #c0b4a4; font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

  /* ══ ДНЕВНИК ════════════════════════════════════════════════════════════════ */

  /* ── Check-in (charge) ── */
  .checkin-card {
    background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
    border-radius: 18px; padding: 22px; margin-bottom: 12px;
    box-shadow: 0 6px 24px rgba(44,74,46,0.18);
  }
  .checkin-card .label { color: rgba(247,243,237,0.55); margin-bottom: 8px; }
  .charge-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 24px; color: #f7f3ed; line-height: 1.2; margin-bottom: 6px; }
  .charge-sub { font-size: 12px; color: rgba(247,243,237,0.52); margin-bottom: 26px; line-height: 1.55; }
  .charge-dots { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .charge-dot { border-radius: 50%; background: rgba(247,243,237,0.13); cursor: pointer; transition: all .18s; flex-shrink: 0; }
  .charge-dot.d1 { width: 26px; height: 26px; }
  .charge-dot.d2 { width: 34px; height: 34px; }
  .charge-dot.d3 { width: 42px; height: 42px; }
  .charge-dot.d4 { width: 50px; height: 50px; }
  .charge-dot.d5 { width: 58px; height: 58px; }
  .charge-dot.lit { background: rgba(247,243,237,0.65); }
  .charge-dot.lit.d4 { background: rgba(247,243,237,0.82); }
  .charge-dot.lit.d5 { background: #f7f3ed; box-shadow: 0 0 16px rgba(247,243,237,0.32); }
  .charge-lbl { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: rgba(247,243,237,0.48); text-align: center; margin-bottom: 18px; min-height: 14px; transition: opacity .2s; }
  .charge-done-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .charge-done-text { font-family: 'DM Serif Display', Georgia, serif; font-size: 22px; color: #f7f3ed; }
  .checkin-edit-btn { font-size: 11px; color: rgba(247,243,237,0.55); background: none; border: none; cursor: pointer; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; margin-top: 14px; display: block; }

  /* ── Supplement timeline ── */
  .suppl-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .suppl-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .suppl-day-lbl { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .suppl-phasebar { position: relative; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(44,74,46,0.08); margin-bottom: 6px; }
  .suppl-dates { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .4px; text-transform: uppercase; margin-bottom: 10px; }
  .suppl-status { font-size: 12px; color: var(--text); line-height: 1.55; padding: 10px 12px; background: rgba(44,74,46,0.05); border-radius: 8px; border-left: 2px solid var(--green2); }
  .suppl-badge { font-size: 10px; font-weight: 700; border-radius: 99px; padding: 4px 10px; }

  /* ── Insight card ── */
  .insight-card { background: linear-gradient(135deg, #1e3a20 0%, var(--green) 100%); border-radius: var(--radius); padding: 20px; margin-bottom: 10px; color: #f7f3ed; }
  .insight-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(247,243,237,0.45); margin-bottom: 8px; }
  .insight-heading { font-family: 'DM Serif Display', Georgia, serif; font-size: 22px; line-height: 1.25; margin-bottom: 4px; }
  .insight-sub { font-size: 12px; color: rgba(247,243,237,0.6); line-height: 1.55; margin-bottom: 14px; }
  .insight-nums { display: flex; align-items: center; gap: 16px; }
  .insight-num-block { text-align: center; }
  .insight-num-val { font-family: 'DM Serif Display', Georgia, serif; font-size: 36px; line-height: 1; }
  .insight-num-lbl { font-size: 9px; color: rgba(247,243,237,0.45); font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-top: 4px; }
  .insight-arr { font-size: 20px; color: rgba(247,243,237,0.3); }
  .insight-note { font-size: 11px; color: rgba(247,243,237,0.55); margin-top: 12px; line-height: 1.55; }

  /* ── Food log ── */
  .food-cam-btn {
    width: 100%; padding: 14px; border-radius: var(--radius);
    border: 1.5px dashed rgba(44,74,46,0.25); background: none;
    cursor: pointer; color: var(--green); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px;
  }
  .food-cam-btn:active { background: rgba(44,74,46,0.04); }
  .food-preview { width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; margin-bottom: 12px; }
  .kbju-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .kbju-item { flex: 1; text-align: center; background: rgba(44,74,46,0.06); border-radius: 8px; padding: 8px 4px; }
  .kbju-val { font-size: 15px; font-weight: 700; color: var(--green); line-height: 1.2; }
  .kbju-lbl { font-size: 9px; color: var(--muted); font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-top: 2px; }
  .food-log-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }

  .food-log-sub { font-size: 11px; color: var(--muted); }
  .food-del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; }
  .food-total { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 4px; }

  /* ── Food Calendar ── */
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav-btn { background:none; border:none; cursor:pointer; color:var(--green); font-size:20px; font-weight:700; padding:4px 10px; line-height:1; }
  .cal-month-lbl { font-size:14px; font-weight:700; }
  .cal-wd-row { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px; }

  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-cell { aspect-ratio:1; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; cursor:pointer; transition:transform .15s; color:var(--text); }
  .cal-cell.empty { background:none !important; cursor:default; }

  .cal-cell.c1 { background:#d4e8d4; }
  .cal-cell.c2 { background:#a4c7a4; }
  .cal-cell.c3 { background:#70ad70; color:#fff; }
  .cal-cell.c4 { background:#46914a; color:#fff; }
  .cal-cell.c5 { background:var(--green); color:#f7f3ed; }
  .cal-cell.is-today { box-shadow:0 0 0 2px var(--gold); }

  .cal-legend { display:flex; align-items:center; gap:5px; margin-top:10px; }
  .cal-leg-lbl { font-size:9px; color:var(--muted); font-weight:700; }
  .cal-leg-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .cal-day-detail { margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .cal-day-title { font-size:13px; font-weight:700; margin-bottom:8px; color:var(--green); }

  /* ── Trend 30 days ── */
  .trend30-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 12px; }
  .trend30-bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; min-width: max-content; padding-bottom: 2px; }
  .tb { width: 9px; border-radius: 3px 3px 0 0; flex-shrink: 0; min-height: 3px; }
  .tb.empty { background: rgba(44,74,46,0.09); height: 3px; }
  .tb.c1 { background: #cfe0cf; }
  .tb.c2 { background: #a4c7a4; }
  .tb.c3 { background: #70ad70; }
  .tb.c4 { background: #469146; }
  .tb.c5 { background: var(--green); }
  .trend30-footer { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); font-weight: 700; margin-top: 6px; letter-spacing: .3px; }

  /* AI chat */
  .chat-wrap { display: flex; flex-direction: column; height: 360px; }
  .chat-messages { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .msg { margin-bottom: 10px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 16px;

  }
  .msg.bot .msg-bubble  { background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, var(--green), var(--green2)); color: #f7f3ed; border-bottom-right-radius: 4px; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input {

  }
  .chat-input:focus { border-color: var(--green2); }

  /* ══ КЛУБ ═══════════════════════════════════════════════════════════════════ */

  /* Level hero */
  .level-hero {
    border-radius: 20px; padding: 24px 22px; margin-bottom: 14px;
    color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,0.18); position: relative; overflow: hidden;
  }
  .level-hero::after {

  .level-prog-wrap { height: 4px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
  .level-prog-bar  { height: 100%; background: rgba(255,255,255,0.8); border-radius: 99px; transition: width .6s; }
  .level-next { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 600; letter-spacing: .3px; }

  /* Spin wheel */
  .wheel-section { text-align: center; margin-bottom: 16px; }
  .wheel-outer {
    position: relative; width: 260px; height: 260px;
    margin: 0 auto 16px;
  }
  .wheel-el {
    width: 260px; height: 260px; border-radius: 50%;
    background: conic-gradient(
      rgba(255,255,255,.25) 0deg 1deg,
      #2c4a2e 1deg 44deg,
      rgba(255,255,255,.25) 44deg 45deg,
      #c4965a 45deg 89deg,
      rgba(255,255,255,.25) 89deg 90deg,
      #4a7c59 90deg 134deg,
      rgba(255,255,255,.25) 134deg 135deg,
      #e2b55a 135deg 179deg,
      rgba(255,255,255,.25) 179deg 180deg,
      #2c4a2e 180deg 224deg,
      rgba(255,255,255,.25) 224deg 225deg,
      #c4965a 225deg 269deg,
      rgba(255,255,255,.25) 269deg 270deg,
      #4a7c59 270deg 314deg,
      rgba(255,255,255,.25) 314deg 315deg,
      #1a3a1c 315deg 359deg,
      rgba(255,255,255,.25) 359deg 360deg
    );
    transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    box-shadow: 0 8px 32px rgba(44,74,46,0.28), inset 0 0 0 3px rgba(255,255,255,0.12);
  }
  .wheel-svg {
    position: absolute; top: 0; left: 0; width: 260px; height: 260px;
    pointer-events: none; transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .wheel-svg text { fill: rgba(255,255,255,.92); font-size: 10px; font-weight: 800; font-family: -apple-system, sans-serif; }
  .wheel-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg); box-shadow: 0 0 0 3px rgba(255,255,255,.2), 0 3px 12px rgba(0,0,0,.2);
    z-index: 2;
  }
  .wheel-pointer {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 3;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 18px solid var(--gold);
    filter: drop-shadow(0 2px 4px rgba(196,150,90,.5));
  }
  .spin-btn-wrap { margin-top: 4px; }
  .spin-already { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0; }

  /* Prize reveal popup */
  .prize-popup {
    display: none; position: fixed;
    inset: 0; z-index: 300;
    background: rgba(28,28,26,.55);
    backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
  }
  .prize-popup.show { display: flex; }
  .prize-card {
    background: linear-gradient(135deg, var(--green), var(--green2));
    border-radius: 24px; padding: 36px 30px; text-align: center;
    color: #fff; max-width: 300px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    animation: popIn .4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from { transform: scale(.5); opacity:0; } to { transform: scale(1); opacity:1; } }
  .prize-card-icon { font-size: 56px; margin-bottom: 12px; }
  .prize-card-label { font-family: 'DM Serif Display', serif; font-size: 28px; margin-bottom: 8px; }
  .prize-card-sub { font-size: 13px; color: rgba(255,255,255,.7); margin-bottom: 6px; }
  .prize-card-promo {
    background: rgba(255,255,255,.15); border-radius: 8px;
    padding: 8px 14px; font-size: 16px; font-weight: 800;
    letter-spacing: 2px; margin: 10px 0; display: inline-block;
  }
  .prize-card-total { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 10px; }

  /* Challenges */
  .challenge-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 6px rgba(44,74,46,0.04);
  }
  .challenge-icon {
    width: 42px; height: 42px; border-radius: 11px;
    background: linear-gradient(135deg, var(--bg), #f0ebe4);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .challenge-info { flex: 1; min-width: 0; }
  .challenge-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .challenge-desc  { font-size: 11px; color: var(--muted); margin-bottom: 7px; line-height: 1.4; }
  .challenge-prog-wrap { height: 3px; background: rgba(44,74,46,0.1); border-radius: 99px; overflow: hidden; }
  .challenge-prog-bar  { height: 100%; border-radius: 99px; transition: width .5s;
    background: linear-gradient(90deg, var(--green), var(--green2)); }
  .challenge-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .challenge-reward { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: .3px; }
  .claim-btn {
    padding: 7px 12px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
  }
  .claim-btn.ready   { background: linear-gradient(135deg, var(--green), var(--green2)); color: #f7f3ed; }
  .claim-btn.claimed { background: rgba(44,74,46,0.08); color: var(--green); cursor: default; }
  .claim-btn.locked  { background: var(--bg); color: #c0b4a4; border: 1px solid var(--border); cursor: default; }

  /* Leaderboard */
  .lb-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .lb-item:last-child { border: none; }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
  }
  .lb-rank.r1 { background: #ffd700; color: #6a4000; }
  .lb-rank.r2 { background: #d4d4e0; color: #404060; }
  .lb-rank.r3 { background: #cd7f32; color: #fff; }
  .lb-rank.rn { background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-size: 10px; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-pts  { font-weight: 700; color: var(--green); }
  .lb-me   { background: rgba(44,74,46,0.06); border-radius: 8px; padding: 0 6px; }

  /* Achievements */
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .ach-card {
    background: linear-gradient(180deg,#fff 0%,#faf7f2 100%);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center;
    box-shadow: 0 1px 6px rgba(44,74,46,.04);
  }
  .ach-card.locked { opacity: .4; filter: grayscale(1); }
  .ach-icon { font-size: 24px; margin-bottom: 6px; }
  .ach-name { font-size: 11px; font-weight: 700; margin-bottom: 3px; }
  .ach-desc { font-size: 10px; color: var(--muted); line-height: 1.3; }

  /* Referral */
  .ref-stat-card {
    background: linear-gradient(135deg, var(--green), var(--green2));
    border-radius: 18px; padding: 22px 20px; margin-bottom: 14px;
    box-shadow: 0 8px 28px rgba(44,74,46,.2); color: #f7f3ed;
  }
  .ref-big { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; letter-spacing: -2px; margin-bottom: 4px; }
  .ref-sub  { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(247,243,237,.55); }
  .ref-prog-wrap { height: 2px; background: rgba(247,243,237,.2); border-radius: 99px; margin: 14px 0 6px; overflow: hidden; }
  .ref-prog-bar  { height: 100%; background: rgba(247,243,237,.7); border-radius: 99px; transition: width .5s; }
  .ref-next { font-size: 12px; color: rgba(247,243,237,.7); }
  .ref-levels { list-style: none; }
  .ref-levels li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ref-levels li:last-child { border: none; }
  .ref-lvl-badge { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; white-space: nowrap; min-width: 50px; text-align: center; }
  .ref-lvl-badge.done { border-color: var(--green2); color: var(--green); }
  .ref-link-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 12px; color: var(--muted); word-break: break-all; line-height: 1.6; }

  /* Giveaway */
  .giveaway-card {
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-radius: 18px; padding: 28px 22px; text-align: center;
    color: #1c1c1a; box-shadow: 0 8px 28px rgba(196,150,90,.28); margin-bottom: 14px;

</style>
</head>
<body>

<div id="screen-home"    class="screen active"></div>
<div id="screen-program" class="screen"></div>
<div id="screen-diary"   class="screen"></div>
<div id="screen-ai"      class="screen"></div>
<div id="screen-club"    class="screen"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('home')"    id="nav-home">Главная</button>
  <button class="nav-btn"        onclick="showScreen('program')" id="nav-program">Курс</button>
  <button class="nav-btn"        onclick="showScreen('diary')"   id="nav-diary">Дневник</button>
  <button class="nav-btn"        onclick="showScreen('ai')"      id="nav-ai">AI Нутри</button>
  <button class="nav-btn"        onclick="showScreen('club')"    id="nav-club">Клуб</button>
</nav>

<div class="toast" id="toast"></div>

<!-- Prize popup -->
<div class="prize-popup" id="prizePopup" onclick="closePrizePopup()">
  <div class="prize-card" onclick="event.stopPropagation()">
    <div class="prize-card-icon" id="prizeIcon">🎉</div>
    <div class="prize-card-label" id="prizeLbl">+100 баллов</div>
    <div class="prize-card-sub" id="prizeSub">Начислено на твой счёт</div>
    <div class="prize-card-promo" id="prizePromo" style="display:none"></div>
    <div class="prize-card-total" id="prizeTotal"></div>
    <button class="btn" style="margin-top:18px;background:rgba(255,255,255,.18);color:#fff" onclick="closePrizePopup()">Отлично!</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── Utils ──────────────────────────────────────────────────────────────────

function api(method, path, body) {
  return fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json());
}

function toast(msg, ms = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "home")    loadHome();
  if (name === "program") loadProgram();
  if (name === "diary")   loadDiary();
  if (name === "ai")      loadAI();
  if (name === "club")    loadClub();
}

const urlParams = new URLSearchParams(location.search);
const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;
api("POST", "/api/user/init", { ref }).catch(() => {});

// ══════════════════════════════════════════════════════════════════════════
// ГЛАВНАЯ
// ══════════════════════════════════════════════════════════════════════════

let CONTENT_CARDS = [];

async function loadHome() {
  const screen = document.getElementById("screen-home");
  screen.innerHTML = '<div class="spinner"></div>';

  const [data, articlesData] = await Promise.all([
    api("GET", "/api/home"),
    api("GET", "/api/articles"),
  ]);
  CONTENT_CARDS = articlesData.articles || [];
  const name = user.first_name || "";
  const streak     = data.global_streak || 0;
  const courseDays = data.course_days || 0;
  const refCount   = data.ref_count || 0;
  const products   = data.products  || [];
  const wellness   = data.wellness_today;

  // Streak card
  const streakHtml = `
    <div class="streak-card">
      <div class="streak-card-left">
        <span class="label">Дней в курсе подряд</span>
        <div class="streak-num">${streak}</div>
        <div class="streak-sub">${streak === 0 ? "Начни сегодня" : streak >= 30 ? "Невероятно" : streak >= 7 ? "Отличная серия" : "Продолжай"}</div>
      </div>
      <div class="streak-card-right">
        <div class="stat-pill">${courseDays} дней всего</div>
        <div class="stat-pill">${refCount} друзей</div>
      </div>
    </div>`;

  // Сегодняшний курс
  let courseHtml = "";
  if (products.length) {
    const items = products.map(p => `
      <div class="mini-task" id="mini-${p.product_id}">
        <button class="mini-check ${p.taken_today ? 'done' : ''}"
                onclick="homeLogIntake('${p.product_id}', this)">
          ${p.taken_today ? "✓" : ""}
        </button>
        <div class="mini-task-name">${p.product_name}</div>
      </div>`).join("");
    courseHtml = `
      <div class="section-head">
        <span class="label">Сегодняшний курс</span>
        <button class="section-link" onclick="showScreen('program')">Весь курс →</button>
      </div>
      ${items}`;
  } else {
    courseHtml = `
      <div class="section-head"><span class="label">Программа</span></div>
      <div class="card" style="text-align:center;padding:24px">
        <div style="font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.6">
          Пройди анализ, чтобы получить<br>персональный курс добавок
        </div>
        <button class="btn" onclick="showScreen('program')">Пройти анализ</button>
      </div>`;
  }

  // Самочувствие
  let wellnessHtml = "";
  if (wellness) {
    wellnessHtml = `
      <div class="section-head" style="margin-top:4px">
        <span class="label">Самочувствие сегодня</span>

];

let quizAnswers     = {};
let quizStepIdx     = 0;
let quizActiveSteps = [];
let quizSymptoms    = new Set();
const addedToTracker = new Set();

function getActiveSteps() {
  return QUIZ_BASE_STEPS.filter(s => !(s.femaleOnly && quizAnswers.gender !== "female"));
}

async function loadProgram() {
  const screen = document.getElementById("screen-program");
  screen.innerHTML = '<div class="spinner"></div>';

  const [trackerData, homeData] = await Promise.all([
    api("GET", "/api/tracker"),
    api("GET", "/api/home"),
  ]);
  const products   = trackerData.products || [];
  const today_logs = await api("GET", "/api/tracker").then(() =>
    homeData.products.filter(p => p.taken_today).map(p => p.product_id)
  );
  const courseDays = homeData.course_days || 0;
  const pct = Math.min(Math.round((courseDays / 30) * 100), 100);

  let courseBanner = "";
  if (courseDays > 0 || products.length > 0) {
    courseBanner = `
      <div class="course-banner">
        <span class="label">30-дневный курс</span>
        <div class="course-day-num">${courseDays}</div>
        <div class="course-prog-wrap">
          <div class="course-prog-bar" style="width:${pct}%"></div>
        </div>
        <div class="course-prog-sub">${courseDays} из 30 дней пройдено${courseDays >= 30 ? " — курс завершён!" : ""}</div>
      </div>`;
  }

  let courseList = "";
  if (products.length) {
    const today = homeData.products || [];
    const todayMap = Object.fromEntries(today.map(p => [p.product_id, p.taken_today]));
    courseList = `
      <div class="section-head">
        <span class="label">Твой курс</span>
      </div>
      ${products.map(p => {
        const done = todayMap[p.product_id] || false;
        return `
          <div class="course-item" id="tracker-${p.product_id}">
            <button class="course-check ${done ? 'done' : ''}"
                    onclick="logIntake('${p.product_id}', this)">
              ${done ? "✓" : ""}
            </button>
            <div class="course-info">
              <div class="course-name">${p.product_name}</div>
              <div class="course-streak">Добавлено в курс</div>
            </div>
            <button class="course-del" onclick="removeProduct('${p.product_id}')">×</button>
          </div>`;
      }).join("")}
      <div style="height:12px"></div>`;
  }

  screen.innerHTML = `
    ${courseBanner}
    ${courseList}
    <div class="section-head">
      <span class="label">${products.length ? "Пересмотреть анализ" : "Персональный анализ"}</span>
    </div>
    <div class="card" style="cursor:pointer;padding:20px;margin-bottom:4px" onclick="startQuiz()">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">
        ${products.length ? "Обновить программу" : "Пройти анализ"}
      </div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6">
        ${products.length
          ? "Ответь на 8 вопросов заново — обновим рекомендации"
          : "8 вопросов → персональный протокол добавок под твой организм"}
      </div>
    </div>
    <button class="btn" style="margin-top:10px" onclick="startQuiz()">
      ${products.length ? "Обновить программу" : "Начать анализ"}
    </button>
  `;
}

function startQuiz() {
  quizAnswers = {}; quizStepIdx = 0; quizSymptoms = new Set();
  renderQuiz();
}

function renderQuiz() {
  quizActiveSteps = getActiveSteps();
  const step = quizActiveSteps[quizStepIdx];
  if (!step) { showSmartResults(); return; }

  const total = quizActiveSteps.length, current = quizStepIdx + 1;
  const pct = Math.round((quizStepIdx / total) * 100);

  let body = "";
  if (step.type === "grid") {
    body = `<div class="quiz-grid">` +
      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             onclick="selectCard('${step.id}','${o.id}',this)">${o.text}</div>`).join("") + `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chips">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}',this)">${o.text}</div>`).join("") +
      `</div><button class="btn" onclick="advanceQuiz()">Продолжить</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-row">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}',${o.id},this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-lbl">${o.label}</div>
        </div>`).join("") + `</div>`;
  }

  const backBtn = quizStepIdx > 0
    ? `<button class="back-btn" onclick="backQuiz()">← Назад</button>`
    : `<button class="back-btn" onclick="loadProgram()">← Назад</button>`;

  document.getElementById("screen-program").innerHTML = `
    <div class="quiz-head">
      <span class="label">Анализ</span>
      <span class="quiz-counter">${String(current).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
    </div>
    <div class="quiz-prog-wrap"><div class="quiz-prog-bar" style="width:${pct}%"></div></div>
    <div class="quiz-q">${step.title}</div>
    ${body}
    ${backBtn}
  `;
}

function selectCard(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".quiz-grid").querySelectorAll(".quiz-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 220);
}
function toggleChip(id, el) {
  if (quizSymptoms.has(id)) { quizSymptoms.delete(id); el.classList.remove("selected"); }
  else                       { quizSymptoms.add(id);    el.classList.add("selected"); }
}
function selectScale(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".scale-row").querySelectorAll(".scale-seg").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 270);
}
function advanceQuiz() {
  const step = quizActiveSteps[quizStepIdx];
  if (step.type !== "multiselect" && !quizAnswers[step.id]) { toast("Выбери один из вариантов"); return; }
  quizStepIdx++;
  quizActiveSteps = getActiveSteps();
  if (quizStepIdx >= quizActiveSteps.length) showSmartResults();
  else renderQuiz();
}
function backQuiz() { if (quizStepIdx > 0) { quizStepIdx--; renderQuiz(); } }

async function showSmartResults() {
  const screen = document.getElementById("screen-program");
  screen.innerHTML = '<div class="spinner"></div>';

  const payload = {
    gender: quizAnswers.gender || "female", age: quizAnswers.age || "26-35",
    goal: quizAnswers.goal || "energy", symptoms: [...quizSymptoms],
    stress: quizAnswers.stress || 1, sleep_q: quizAnswers.sleep_q || 4,
    diet: quizAnswers.diet || "balanced", women_health: quizAnswers.women_health || null,
  };

  const data = await api("POST", "/api/quiz/smart-result", payload);
  const products = data.products || [], analysis = data.analysis || [];

  const analysisHtml = analysis.length ? `
    <div class="analysis-block">
      <span class="label" style="color:var(--green)">Что мы выявили</span>
      <ul class="analysis-list" style="margin-top:10px">${analysis.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>` : "";

  const productsHtml = products.map(p => {
    const benefits = (p.benefits || []).map(b => `<li>${b}</li>`).join("");
    const added = addedToTracker.has(p.id);
    return `
      <div class="product-card">
        <div class="product-name">${p.name}</div>
        <div class="product-tag">${p.tagline}</div>
        <div class="product-reason-lbl">Почему тебе это нужно</div>
        <div class="product-reason-txt">${p.reason}</div>
        <ul class="product-benefits">${benefits}</ul>
        <div class="product-links">
          <a class="link-wb" href="${p.wb_url}" target="_blank">Wildberries</a>
          <a class="link-ozon" href="${p.ozon_url}" target="_blank">Ozon</a>
        </div>
        <button class="btn-course ${added ? 'added' : ''}" id="add-btn-${p.id}" onclick="addToTracker('${p.id}')">
          ${added ? "Добавлено в курс" : "+ Добавить в курс"}
        </button>
      </div>`;
  }).join("");

  screen.innerHTML = `
    <div class="results-hero">
      <span class="label">Персональный анализ</span>
      <div class="results-hero-title">Твоя программа<br>готова.</div>
    </div>
    ${analysisHtml}
    ${productsHtml}
    <button class="btn outline" onclick="loadProgram()" style="margin-top:8px">← Вернуться в программу</button>
  `;
}

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "Добавлено в курс"; btn.classList.add("added"); }
  toast("Добавлено в курс");
}

async function logIntake(productId, btn) {
  if (btn.classList.contains("done")) { toast("Уже отмечено сегодня"); return; }
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) { toast("Уже отмечено сегодня"); return; }
  btn.classList.add("done"); btn.textContent = "✓";
  const s = data.streak;
  const row = btn.closest(".course-item");
  if (row) row.querySelector(".course-streak").textContent = `${s} ${s===1?'день':s<5?'дня':'дней'} подряд`;
  toast("Отмечено");
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено из курса");
}

  chargeVal = initVal || 0;
  const LABELS = ["", "Разряжен", "Устал", "Норм", "Хорошо", "Заряжен!"];
  const dots = [1,2,3,4,5].map(n =>
    `<div class="charge-dot d${n}${n <= chargeVal ? ' lit' : ''}" id="cd${n}" onclick="selectCharge(${n})"></div>`
  ).join("");
  return `
    <div class="checkin-card">
      <span class="label">Сегодня</span>
      <div class="charge-title">Как твой<br>заряд сегодня?</div>

      <div class="charge-lbl" id="chargeLbl">${chargeVal ? LABELS[chargeVal] : 'Выбери уровень заряда'}</div>

function buildCheckinDone(today) {
  const charge = Math.round((today.energy + today.sleep_q + today.mood) / 3);
  const LABELS = ["", "Разряжен", "Устал", "Норм", "Хорошо", "Заряжен!"];
  const dots = [1,2,3,4,5].map(n =>
    `<div class="charge-dot d${n}${n <= charge ? ' lit' : ''}"></div>`
  ).join("");
  return `
    <div class="checkin-card">
      <span class="label">Сегодня зафиксировано</span>
      <div class="charge-done-row">
        <div class="charge-dots" style="margin-bottom:0;align-items:center">${dots}</div>
        <div class="charge-done-text">${LABELS[charge] || '—'}</div>
      </div>
      <button class="checkin-edit-btn" onclick="loadDiaryEdit()">Изменить</button>
    </div>`;
}

function loadDiaryEdit() {
  diaryForceEdit = true;
  loadDiary();
}

function selectCharge(n) {
  chargeVal = n;
  const LABELS = ["", "Разряжен", "Устал", "Норм", "Хорошо", "Заряжен!"];
  for (let i = 1; i <= 5; i++) {
    const el = document.getElementById("cd" + i);
    if (el) { if (i <= n) el.classList.add("lit"); else el.classList.remove("lit"); }
  }
  const lbl = document.getElementById("chargeLbl");
  if (lbl) lbl.textContent = LABELS[n];
}

async function saveCharge() {
  if (!chargeVal) { toast("Выбери уровень заряда"); return; }
  await api("POST", "/api/wellness/log", { energy: chargeVal, sleep_q: chargeVal, mood: chargeVal });
  toast("Заряд зафиксирован +10 баллов");
  loadDiary();
}

function buildSupplTimeline(product, days) {
  const totalDays = 30;
  const pct = Math.min((days / totalDays) * 100, 100);
  const dotPct = Math.min(pct, 97);

function buildInsight(history, daysInCourse) {
  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  if (history.length < 7) {
    const left = Math.max(0, 7 - history.length);
    return `
      <div class="card" style="text-align:center;padding:20px;margin-bottom:10px">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px">Пока нет данных для инсайта</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">Ещё ${left} ${left===1?'день':left<5?'дня':'дней'} — и появится твой первый<br>персональный прогресс-инсайт</div>
      </div>`;
  }
  const chron   = [...history].reverse();
  const w1      = chron.slice(0, 7).map(getCharge);
  const wLast   = chron.slice(-7).map(getCharge);
  const avg1    = (w1.reduce((a,b) => a+b, 0) / w1.length).toFixed(1);
  const avgNow  = (wLast.reduce((a,b) => a+b, 0) / wLast.length).toFixed(1);
  const diff    = (parseFloat(avgNow) - parseFloat(avg1)).toFixed(1);
  const up      = parseFloat(diff) > 0.2;
  const flat    = Math.abs(parseFloat(diff)) <= 0.2;

  return `
    <div class="insight-card">
      <div class="insight-eyebrow">Прогресс · ${daysInCourse} дней курса</div>
      <div class="insight-heading">${up ? 'Заряд растёт' : flat ? 'Стабильный заряд' : 'Продолжаем курс'}</div>
      <div class="insight-sub">${up
        ? `За ${daysInCourse} дней средний заряд вырос на ${diff} п.`
        : flat
          ? 'Твой уровень стабилен — накопительный эффект продолжается'
          : 'Добавки работают накопительно — первый эффект появится на 3-4 неделе'
      }</div>
      <div class="insight-nums">
        <div class="insight-num-block">
          <div class="insight-num-val">${avg1}</div>
          <div class="insight-num-lbl">Начало</div>
        </div>
        <div class="insight-arr">→</div>
        <div class="insight-num-block">
          <div class="insight-num-val">${avgNow}</div>
          <div class="insight-num-lbl">Сейчас</div>
        </div>
      </div>
    </div>`;
}

function buildTrend30(history, courseStart) {
  if (!history.length) {
    return `<div style="font-size:13px;color:var(--muted);text-align:center;padding:20px 0;line-height:1.7">Начни фиксировать заряд каждый день —<br>здесь появится твой тренд</div>`;
  }
  const getCharge = e => Math.round((e.energy + e.sleep_q + e.mood) / 3);
  const chron = [...history].reverse(); // oldest → newest

  const bars = chron.map(e => {
    const c = getCharge(e);
    const h = Math.round((c / 5) * 58) + 4;
    return `<div class="tb c${c}" style="height:${h}px" title="${e.date}: ${c}/5"></div>`;
  });

  return `<div class="trend30-bars">${bars.join("")}</div>`;
}

async function sendChat(text) {

const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                   'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

let calMonth = null; // "2026-06"
let calSel   = null; // "2026-06-14"

async function initCalendar() {
  if (!calMonth) {
    const now = new Date();
    calMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  await loadCalendar();
}

async function loadCalendar() {
  const lbl = document.getElementById("cal-month-lbl");
  const wrap = document.getElementById("cal-grid-wrap");
  if (!lbl || !wrap) return;

  const [y, m] = calMonth.split('-').map(Number);
  lbl.textContent = `${MONTHS_RU[m-1]} ${y}`;

  try {
    const data = await api("GET", `/api/diary/food/month?month=${calMonth}`);
    renderCalGrid(y, m, data.days || {});
  } catch(e) {
    console.error("Calendar load error:", e);
    if (wrap) wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0">Ошибка: ${e.message}</div>`;
  }
}

function renderCalGrid(year, mon, days) {
  const wrap = document.getElementById("cal-grid-wrap");
  if (!wrap) return;

  const daysInMonth = new Date(year, mon, 0).getDate();
  const firstDow    = (new Date(year, mon - 1, 1).getDay() + 6) % 7; // Mon=0
  const today       = new Date().toISOString().slice(0, 10);

  const calColor = cal => {
    if (!cal) return 'c0';
    if (cal < 500)  return 'c1';
    if (cal < 1000) return 'c2';
    if (cal < 1500) return 'c3';
    if (cal < 2000) return 'c4';
    return 'c5';
  };

  let cells = Array(firstDow).fill('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const ds  = `${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cal = days[ds]?.calories || 0;
    const cls = [
      'cal-cell', calColor(cal),
      ds === today  ? 'is-today' : '',
      ds === calSel ? 'is-sel'   : '',
    ].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" data-date="${ds}" onclick="selectCalDay('${ds}')">${d}</div>`);
  }

  wrap.innerHTML = `<div class="cal-grid">${cells.join('')}</div>`;
}

async function selectCalDay(ds) {
  calSel = ds;
  // обновить визуальный выбор
  document.querySelectorAll('.cal-cell[data-date]').forEach(el => {
    el.classList.toggle('is-sel', el.dataset.date === ds);
  });

  const detail = document.getElementById("cal-day-detail");
  if (!detail) return;
  detail.innerHTML = `<div style="padding:10px 0;color:var(--muted);font-size:12px">Загружаю...</div>`;

  const data = await api("GET", `/api/diary/food?date=${ds}`);
  const logs = data.logs || [];
  const d    = new Date(ds + 'T12:00:00');
  const lbl  = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });

  if (!logs.length) {
    detail.innerHTML = `<div class="cal-day-detail"><div class="cal-day-title">${lbl}</div><div style="font-size:12px;color:var(--muted)">Нет записей</div></div>`;
    return;
  }

  const t = logs.reduce((a,l) => ({cal:a.cal+l.calories,p:a.p+l.protein,f:a.f+l.fat,c:a.c+l.carbs}),{cal:0,p:0,f:0,c:0});
  const items = logs.map(l => `
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600">${l.food_name}</div>
      <div style="font-size:12px;color:var(--muted);flex-shrink:0;margin-left:8px">${l.calories} ккал</div>
    </div>`).join('');

  detail.innerHTML = `
    <div class="cal-day-detail">
      <div class="cal-day-title">${lbl}</div>
      ${items}
      <div class="food-total" style="margin-top:10px">
        <div class="food-total-item"><div class="food-total-val">${Math.round(t.cal)}</div><div class="food-total-lbl">ккал</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.p.toFixed(1)}г</div><div class="food-total-lbl">белки</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.f.toFixed(1)}г</div><div class="food-total-lbl">жиры</div></div>
        <div class="food-total-item"><div class="food-total-val">${t.c.toFixed(1)}г</div><div class="food-total-lbl">углев.</div></div>
      </div>
    </div>`;
}

function calChangeMonth(dir) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + dir, 1);
  const nm = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if (nm > new Date().toISOString().slice(0,7)) return; // не в будущее
  calMonth = nm;
  calSel = null;
  document.getElementById("cal-day-detail").innerHTML = "";
  loadCalendar();
}

}

async function compressImage(file, maxWidth = 800) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75).split(",")[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Wheel state
let wheelRotation = 0;
let wheelSpinning  = false;

// Prizes labels on wheel (must match backend SPIN_PRIZES order idx 0-7)
const WHEEL_LABELS = [
  {line1:"+25",   line2:"баллов"},
  {line1:"+50",   line2:"баллов"},
  {line1:"+100",  line2:"баллов"},
  {line1:"Промо", line2:"−10%"},
  {line1:"+50",   line2:"баллов"},
  {line1:"+200",  line2:"баллов"},
  {line1:"+25",   line2:"баллов"},
  {line1:"Джек!", line2:"+500"},
];

const CHALLENGE_ICONS = {
  first_product: "🌱", week_streak: "📅", month_streak: "🏆",
  diary_30: "📓", ref_3: "🤝", spin_10: "🍀",
};

const LEVEL_COLORS = {
  Bronze:   "linear-gradient(135deg,#b87333,#d4943f)",
  Silver:   "linear-gradient(135deg,#8888a0,#a8a8c0)",
  Gold:     "linear-gradient(135deg,#c4965a,#e8b060)",
  Platinum: "linear-gradient(135deg,#5080a0,#8090b8)",
};

function buildWheelSVG() {
  const cx = 130, cy = 130, r = 84;
  return WHEEL_LABELS.map((p, i) => {
    const angle = (i * 45 + 22.5) * Math.PI / 180;
    const x = cx + r * Math.sin(angle);
    const y = cy - r * Math.cos(angle);
    const rot = i * 45 + 22.5;
    return `<text x="${x.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" transform="rotate(${rot},${x.toFixed(1)},${y.toFixed(1)})">${p.line1}</text>
            <text x="${x.toFixed(1)}" y="${(y+9).toFixed(1)}" text-anchor="middle" transform="rotate(${rot},${x.toFixed(1)},${y.toFixed(1)})" style="font-size:8px;opacity:.75">${p.line2}</text>`;
  }).join("");
}

function getSpinAngle(segIdx) {
  const A = segIdx * 45 + 22.5;
  const targetBase = (360 - A + 360) % 360;
  const currentBase = wheelRotation % 360;
  let delta = targetBase - currentBase;
  if (delta <= 0) delta += 360;
  return wheelRotation + 5 * 360 + delta;
}

async function loadClub() {
  const screen = document.getElementById("screen-club");
  screen.innerHTML = '<div class="spinner"></div>';

  const data = await api("GET", "/api/club/data");

  const { total_points, level, can_spin, spin_count, challenges,
          leaderboard, ref_code, ref_count, giveaway_total,
          giveaway_participating, achievements_data } = data;

  // ── Level card ────────────────────────────────────────────────────────
  const lvlGrad = LEVEL_COLORS[level.name] || LEVEL_COLORS.Bronze;
  const lvlHtml = `
    <div class="level-hero" style="background:${lvlGrad}">
      <span class="label" style="color:rgba(255,255,255,.55)">Biolar Club</span>
      <div class="level-name">${level.name}</div>
      <div class="level-pts"><strong>${total_points}</strong> баллов${level.next ? ` · до ${level.next}: ${level.next_threshold - total_points}` : " · Максимум!"}</div>
      <div class="level-prog-wrap">
        <div class="level-prog-bar" style="width:${level.progress_pct}%"></div>
      </div>
      <div class="level-next">${level.next ? `${level.next_threshold} баллов → ${level.next}` : "Высший уровень достигнут"}</div>
    </div>`;

  // ── Spin wheel ────────────────────────────────────────────────────────
  const spinHtml = `
    <div class="section-head"><span class="label">Колесо удачи</span></div>
    <div class="wheel-section card" style="padding:22px 16px">
      <div class="wheel-outer">
        <div class="wheel-el" id="wheelEl"></div>
        <svg class="wheel-svg" id="wheelSvg">${buildWheelSVG()}</svg>
        <div class="wheel-center"></div>
        <div class="wheel-pointer"></div>
      </div>
      <div class="spin-btn-wrap">
        ${can_spin
          ? `<button class="btn" id="spinBtn" onclick="doSpin()">Получить ежедневный бонус</button>`
          : `<div class="spin-already">Уже получил сегодня — возвращайся завтра</div>`}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">Прокруток всего: ${spin_count}</div>
    </div>`;

  // ── Challenges ────────────────────────────────────────────────────────
  const challengesHtml = `
    <div class="section-head" style="margin-top:4px"><span class="label">Испытания</span></div>
    ${challenges.map(c => {
      const pct = Math.round((c.progress / c.total) * 100);
      let btnState, btnText;
      if (c.claimed)      { btnState = "claimed"; btnText = "✓ Получено"; }
      else if (c.met)     { btnState = "ready";   btnText = "Забрать"; }
      else                { btnState = "locked";  btnText = `${c.progress}/${c.total}`; }
      return `
        <div class="challenge-card" id="chal-${c.id}">
          <div class="challenge-icon">${CHALLENGE_ICONS[c.id] || "⭐"}</div>
          <div class="challenge-info">
            <div class="challenge-title">${c.title}</div>
            <div class="challenge-desc">${c.desc}</div>
            <div class="challenge-prog-wrap">
              <div class="challenge-prog-bar" style="width:${pct}%"></div>
            </div>
          </div>
          <div class="challenge-right">
            <div class="challenge-reward">+${c.reward} pts</div>
            <button class="claim-btn ${btnState}" onclick="claimChallenge('${c.id}',this)">${btnText}</button>
          </div>
        </div>`;
    }).join("")}`;

  // ── Leaderboard ───────────────────────────────────────────────────────
  const lbHtml = leaderboard.length ? `
    <div class="section-head" style="margin-top:4px"><span class="label">Топ участников</span></div>
    <div class="card">
      ${leaderboard.map(p => {
        const rankClass = p.rank === 1 ? "r1" : p.rank === 2 ? "r2" : p.rank === 3 ? "r3" : "rn";
        const name = p.first_name || p.username || "Участник";
        const shortName = name.length > 14 ? name.slice(0, 13) + "…" : name;
        return `
          <div class="lb-item">
            <div class="lb-rank ${rankClass}">${p.rank}</div>
            <div class="lb-name">${shortName}</div>
            <div class="lb-pts">${p.total_points.toLocaleString("ru")} pts</div>
          </div>`;
      }).join("")}
    </div>` : "";

  // ── Achievements ──────────────────────────────────────────────────────
  const { streak, course_days, has_products } = achievements_data;
  const ACHIEVEMENTS = [
    { icon:"🌱", name:"Первый шаг",   desc:"Добавь продукт",     unlocked: has_products },
    { icon:"📅", name:"7 дней",       desc:"7 дней подряд",      unlocked: streak >= 7 },
    { icon:"🌿", name:"Месяц",        desc:"30 дней подряд",     unlocked: streak >= 30 },
    { icon:"🤝", name:"Советник",     desc:"1 приглашённый",     unlocked: ref_count >= 1 },
    { icon:"💫", name:"Амбассадор",   desc:"5 приглашённых",     unlocked: ref_count >= 5 },
    { icon:"🏆", name:"Преданность",  desc:"60 дней всего",      unlocked: course_days >= 60 },
  ];
  const achHtml = `
    <div class="section-head" style="margin-top:4px"><span class="label">Достижения</span></div>
    <div class="ach-grid">
      ${ACHIEVEMENTS.map(a => `
        <div class="ach-card ${a.unlocked ? "" : "locked"}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
        </div>`).join("")}
    </div>`;

  // ── Giveaway ──────────────────────────────────────────────────────────
  const giveHtml = `
    <div class="section-head" style="margin-top:4px"><span class="label">Розыгрыш месяца</span></div>
    <div class="giveaway-card">
      <div class="giveaway-num" id="giveCount">${giveaway_total}</div>
      <div class="giveaway-lbl">участников</div>
    </div>
    ${giveaway_participating
      ? `<div class="card" style="text-align:center;padding:18px">
           <div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div>
           <div style="font-size:12px;color:var(--muted);margin-top:4px">Итоги в конце месяца. Удачи.</div>
         </div>`
      : `<button class="btn gold-btn" onclick="joinGiveaway(this)">Участвовать в розыгрыше</button>`}`;

  // ── Referral ──────────────────────────────────────────────────────────
  const REF_LEVELS = [
    {count:3,  reward:"Промокод −15%"},
    {count:7,  reward:"Промокод −25%"},
    {count:15, reward:"Бесплатный продукт"},
  ];
  const nextRef    = REF_LEVELS.find(l => l.count > ref_count);
  const refPct     = nextRef ? Math.min((ref_count / nextRef.count) * 100, 100) : 100;
  const botUsername = "Biolarapp_bot";
  const refLink    = `https://t.me/${botUsername}?start=ref_${ref_code}`;
  const shareUrl   = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Пройди персональный анализ нутриентов в Biolar")}`;

  const refHtml = `
    <div class="section-head" style="margin-top:4px"><span class="label">Приглашай друзей</span></div>
    <div class="ref-stat-card">
      <div class="ref-big">${ref_count}</div>
      <div class="ref-sub">Приглашено</div>
      <div class="ref-prog-wrap"><div class="ref-prog-bar" style="width:${refPct}%"></div></div>
      <div class="ref-next">${nextRef ? `До следующей награды: ${nextRef.reward}` : "Все награды получены!"}</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <span class="label" style="margin-bottom:14px">Уровни наград</span>
      <ul class="ref-levels" style="margin-top:14px">
        ${REF_LEVELS.map(l => `
          <li>
            <span class="ref-lvl-badge ${ref_count >= l.count ? "done" : ""}">${l.count} чел.</span>
            <span style="flex:1">${l.reward}</span>
            ${ref_count >= l.count ? `<span style="color:var(--green);font-weight:700;font-size:14px">✓</span>` : ""}
          </li>`).join("")}
      </ul>
    </div>
    <span class="label">Твоя ссылка</span>
    <div class="ref-link-box" style="margin-top:8px;margin-bottom:12px">${refLink}</div>
    <button class="btn" onclick="window.open('${shareUrl}','_blank')">Поделиться ссылкой</button>
    <button class="btn outline" style="margin-top:8px" onclick="copyRef('${refLink}')">Скопировать</button>`;

  // ── Render all ────────────────────────────────────────────────────────
  screen.innerHTML = `
    <div style="margin-bottom:16px">
      <span class="label" style="margin-bottom:6px">Biolar Club</span>
      <div class="serif" style="font-size:26px;letter-spacing:-.2px;margin-top:4px">Твой профиль</div>
    </div>
    ${lvlHtml}
    ${spinHtml}
    ${challengesHtml}
    ${lbHtml}
    ${achHtml}
    ${giveHtml}
    <div style="height:8px"></div>
    ${refHtml}
    <div style="height:8px"></div>
  `;
}

async function doSpin() {
  if (wheelSpinning) return;
  wheelSpinning = true;
  const btn = document.getElementById("spinBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Крутится..."; }

  const data = await api("POST", "/api/club/spin");

  if (data.already_spun) {
    toast("Уже получил сегодня");
    wheelSpinning = false;
    if (btn) { btn.disabled = false; btn.textContent = "Получить ежедневный бонус"; }
    return;
  }

  // Spin animation
  const targetRot = getSpinAngle(data.segment);
  wheelRotation = targetRot;
  const wheelEl = document.getElementById("wheelEl");
  const wheelSvg = document.getElementById("wheelSvg");
  if (wheelEl) wheelEl.style.transform = `rotate(${targetRot}deg)`;
  if (wheelSvg) wheelSvg.style.transform = `rotate(${targetRot}deg)`;

  // Wait for animation (4.5s) then show prize popup
  setTimeout(() => {
    wheelSpinning = false;
    showPrizePopup(data.prize, data.new_total);
    // Swap button to "already spun"
    if (btn) {
      btn.outerHTML = `<div class="spin-already">Возвращайся завтра за новым бонусом</div>`;
    }
  }, 4600);
}

function showPrizePopup(prize, newTotal) {
  const icons = [null, "+25", "+50", "+100", "🎟", "+50", "+200", "+25", "🏆"];
  const iconMap = { 25:"✨", 50:"⚡", 100:"💎", 200:"🔥", 500:"🏆" };
  document.getElementById("prizeIcon").textContent  = prize.promo ? "🎟" : (iconMap[prize.points] || "✨");
  document.getElementById("prizeLbl").textContent   = prize.label;
  document.getElementById("prizeSub").textContent   = prize.promo ? "Твой промокод:" : "Баллы начислены на счёт";
  const promoEl = document.getElementById("prizePromo");
  if (prize.promo) { promoEl.textContent = prize.promo; promoEl.style.display = "inline-block"; }
  else             { promoEl.style.display = "none"; }
  document.getElementById("prizeTotal").textContent = `Всего баллов: ${newTotal}`;
  document.getElementById("prizePopup").classList.add("show");
}

function closePrizePopup() {
  document.getElementById("prizePopup").classList.remove("show");
}

async function claimChallenge(challengeId, btn) {
  if (btn.classList.contains("claimed") || btn.classList.contains("locked")) return;
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/club/challenge/claim", { challenge_id: challengeId });
  if (data.already_claimed) { btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено"; return; }
  if (!data.ok) { btn.disabled = false; btn.textContent = "Забрать"; return; }
  btn.classList.replace("ready", "claimed"); btn.textContent = "✓ Получено";
  toast(`+${data.reward} баллов! Всего: ${data.new_total}`);
  // Update level card points
  const lvlPtsEl = document.querySelector(".level-pts strong");
  if (lvlPtsEl) lvlPtsEl.textContent = data.new_total;
}

async function joinGiveaway(btn) {
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/giveaway/join");
  const el = document.getElementById("giveCount");
  if (el) el.textContent = data.total_participants;
  const card = document.createElement("div");
  card.className = "card"; card.style.cssText = "text-align:center;padding:18px";
  card.innerHTML = `<div class="serif" style="font-size:18px;color:var(--green)">Ты участвуешь.</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Итоги в конце месяца. Удачи.</div>`;
  btn.replaceWith(card);
  toast("Ты в розыгрыше");
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована"));
}

// ── Старт ──────────────────────────────────────────────────────────────────
loadHome();
</script>
