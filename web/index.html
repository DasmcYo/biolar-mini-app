<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Biolar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --card:    #21262d;
    --accent:  #3ecf8e;
    --adim:    rgba(62,207,142,0.1);
    --text:    #e6edf3;
    --muted:   #7d8590;
    --border:  rgba(240,246,252,0.1);
    --danger:  #f85149;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 68px;
  }

  /* ── NAV ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; padding: 12px 4px 10px;
    font-size: 10px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
    color: var(--muted); background: none; border: none; cursor: pointer;
    transition: color .15s; position: relative;
  }
  .nav-btn::before {
    content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 1.5px;
    background: var(--accent); opacity: 0; transition: opacity .15s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn.active::before { opacity: 1; }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px 16px; animation: fadeIn .18s; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* ── LABEL ── */
  .label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.3px;
    text-transform: uppercase; color: var(--muted); display: block;
  }

  /* ── BUTTONS ── */
  .btn {
    display: block; width: 100%; padding: 15px;
    background: var(--accent); color: #0d1117;
    border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: .2px; transition: opacity .15s;
  }
  .btn:active { opacity: .8; }
  .btn.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
  }
  .btn + .btn { margin-top: 8px; }

  /* ── CARD ── */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  }

  /* ── QUIZ ── */
  .quiz-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .quiz-counter {
    font-size: 13px; font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: .5px;
  }
  .quiz-prog-wrap {
    height: 2px; background: var(--border); border-radius: 99px;
    margin-bottom: 28px; overflow: hidden;
  }
  .quiz-prog-bar {
    height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease;
  }
  .quiz-q {
    font-size: 22px; font-weight: 700; line-height: 1.25;
    letter-spacing: -.3px; margin-bottom: 24px;
  }

  /* Option cards */
  .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .quiz-card {
    position: relative;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 18px 14px;
    font-size: 14px; font-weight: 500; text-align: center;
    cursor: pointer; color: var(--text); line-height: 1.3;
    transition: border-color .15s, background .15s, color .15s;
  }
  .quiz-card.selected {
    border-color: var(--accent); background: var(--adim); color: var(--accent);
  }
  .quiz-card.selected::after {
    content: "✓"; position: absolute; top: 8px; right: 10px;
    font-size: 10px; color: var(--accent); font-weight: 700;
  }

  /* Multi-select chips */
  .quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .quiz-chip {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 99px; padding: 9px 16px;
    font-size: 13px; font-weight: 500; color: var(--text);
    cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  }
  .quiz-chip.selected { border-color: var(--accent); background: var(--adim); color: var(--accent); }

  /* Scale */
  .scale-row { display: flex; gap: 6px; margin-bottom: 24px; }
  .scale-seg {
    flex: 1; padding: 12px 4px; text-align: center;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .scale-seg.selected { border-color: var(--accent); background: var(--adim); }
  .scale-num { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .scale-seg.selected .scale-num { color: var(--accent); }
  .scale-lbl { font-size: 10px; color: var(--muted); line-height: 1.2; }

  .quiz-back-btn {
    display: inline-flex; align-items: center;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 13px; padding: 0; margin-top: 16px;
  }

  /* ── RESULTS ── */
  .analysis-block {
    border: 1px solid var(--border); border-left: 2px solid var(--accent);
    border-radius: var(--radius); padding: 14px 16px;
    background: var(--adim); margin-bottom: 20px;
  }
  .analysis-list { list-style: none; margin-top: 10px; }
  .analysis-list li {
    font-size: 13px; color: var(--text); padding: 3px 0;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .analysis-list li::before {
    content: ""; display: inline-block; width: 4px; height: 4px;
    background: var(--accent); border-radius: 50%;
    flex-shrink: 0; margin-top: 7px;
  }

  .product-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 10px;
  }
  .product-name { font-size: 16px; font-weight: 700; letter-spacing: -.2px; margin-bottom: 4px; }
  .product-tag  { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .product-reason-lbl {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .product-reason-txt {
    font-size: 13px; line-height: 1.55;
    padding-left: 12px; border-left: 2px solid var(--accent); margin-bottom: 16px;
    color: var(--text);
  }
  .product-benefits { list-style: none; margin-bottom: 16px; }
  .product-benefits li {
    font-size: 13px; color: var(--muted); padding: 3px 0;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .product-benefits li::before {
    content: ""; display: inline-block; width: 3px; height: 3px;
    background: var(--muted); border-radius: 50%;
    flex-shrink: 0; margin-top: 8px;
  }
  .product-links { display: flex; gap: 8px; margin-bottom: 10px; }
  .product-links a {
    flex: 1; padding: 10px; text-align: center; border-radius: 8px;
    font-size: 12px; font-weight: 700; text-decoration: none; letter-spacing: .3px;
  }
  .link-wb   { background: rgba(203,17,171,.1);  color: #d060c0; border: 1px solid rgba(203,17,171,.2); }
  .link-ozon { background: rgba(0,91,255,.1);    color: #6090ff; border: 1px solid rgba(0,91,255,.2); }
  .btn-tracker {
    width: 100%; padding: 11px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
    transition: border-color .15s, color .15s;
  }
  .btn-tracker.added { border-color: var(--accent); color: var(--accent); }

  /* ── TRACKER ── */
  .tracker-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 8px; display: flex; align-items: center; gap: 14px;
  }
  .tracker-check {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: none;
    font-size: 14px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent; transition: all .15s;
  }
  .tracker-check.done { background: var(--accent); border-color: var(--accent); color: #0d1117; }
  .tracker-info { flex: 1; }
  .tracker-name   { font-size: 14px; font-weight: 600; }
  .tracker-streak { font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .2px; }
  .tracker-del {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; opacity: .4;
  }
  .tracker-del:active { opacity: 1; }

  /* ── REFERRAL ── */
  .ref-big { font-size: 52px; font-weight: 800; letter-spacing: -2px; margin-bottom: 2px; }
  .ref-bar-wrap {
    height: 2px; background: var(--border); border-radius: 99px; margin: 14px 0 6px; overflow: hidden;
  }
  .ref-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s; }
  .levels { list-style: none; }
  .levels li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .levels li:last-child { border: none; }
  .level-badge {
    font-size: 11px; font-weight: 700; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 8px; white-space: nowrap; min-width: 52px; text-align: center;
  }
  .level-badge.done { border-color: var(--accent); color: var(--accent); }
  .ref-link-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 12px; color: var(--muted);
    word-break: break-all; line-height: 1.6; margin-bottom: 10px;
  }

  /* ── GIVEAWAY ── */
  .give-count { font-size: 52px; font-weight: 800; letter-spacing: -2px; margin-bottom: 2px; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty p { font-size: 14px; line-height: 1.7; }

  /* ── SPINNER ── */
  .spinner { display: flex; justify-content: center; padding: 60px; }
  .spinner::after {
    content: ""; width: 24px; height: 24px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--card); color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="screen-quiz"     class="screen active"></div>
<div id="screen-tracker"  class="screen"></div>
<div id="screen-referral" class="screen"></div>
<div id="screen-giveaway" class="screen"></div>

<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('quiz')"     id="nav-quiz">Квиз</button>
  <button class="nav-btn"        onclick="showScreen('tracker')"  id="nav-tracker">Трекер</button>
  <button class="nav-btn"        onclick="showScreen('referral')" id="nav-referral">Друзья</button>
  <button class="nav-btn"        onclick="showScreen('giveaway')" id="nav-giveaway">Розыгрыш</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const user     = tg.initDataUnsafe?.user || {};

// ── Utils ──────────────────────────────────────────────────────────────────

function api(method, path, body) {
  return fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json());
}

function toast(msg, ms = 2000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.getElementById("nav-"    + name).classList.add("active");
  if (name === "tracker")  loadTracker();
  if (name === "referral") loadReferral();
  if (name === "giveaway") loadGiveaway();
}

const urlParams = new URLSearchParams(location.search);
const ref = urlParams.get("ref") || tg.initDataUnsafe?.start_param?.replace("ref_", "") || null;
api("POST", "/api/user/init", { ref }).catch(() => {});

// ── QUIZ ───────────────────────────────────────────────────────────────────

const QUIZ_BASE_STEPS = [
  {
    id: "gender", title: "Укажи свой пол", type: "grid", options: [
      {id:"female", text:"Женщина"},
      {id:"male",   text:"Мужчина"},
    ]
  },
  {
    id: "age", title: "Сколько тебе лет?", type: "grid", options: [
      {id:"18-25", text:"18–25"},
      {id:"26-35", text:"26–35"},
      {id:"36-45", text:"36–45"},
      {id:"45+",   text:"45+"},
    ]
  },
  {
    id: "goal", title: "Какая основная цель?", type: "grid", options: [
      {id:"energy",       text:"Энергия и бодрость"},
      {id:"sleep",        text:"Улучшить сон"},
      {id:"immunity",     text:"Иммунитет"},
      {id:"brain",        text:"Мозг и фокус"},
      {id:"women_health", text:"Женское здоровье"},
      {id:"thyroid",      text:"Щитовидная железа"},
      {id:"beauty",       text:"Кожа и волосы"},
      {id:"weight",       text:"Контроль веса"},
    ]
  },
  {
    id: "symptoms", title: "Отметь симптомы, если есть", type: "multiselect", options: [
      {id:"fatigue",    text:"Постоянная усталость"},
      {id:"anemia",     text:"Анемия / дефицит железа"},
      {id:"hair_loss",  text:"Выпадение волос"},
      {id:"often_sick", text:"Часто болею"},
      {id:"low_sun",    text:"Мало бываю на солнце"},
      {id:"brain_fog",  text:"Туман в голове"},
      {id:"anxiety",    text:"Тревожность / раздражительность"},
    ]
  },
  {
    id: "stress", title: "Уровень стресса", type: "scale", options: [
      {id:1, label:"Нет"},
      {id:2, label:"Умер."},
      {id:3, label:"Высокий"},
      {id:4, label:"Хрон."},
    ]
  },
  {
    id: "sleep_q", title: "Качество сна", type: "scale", options: [
      {id:1, label:"Плохо"},
      {id:2, label:"Неплохо"},
      {id:3, label:"Хорошо"},
      {id:4, label:"Отлично"},
    ]
  },
  {
    id: "diet", title: "Как питаешься?", type: "grid", options: [
      {id:"balanced", text:"Сбалансированно"},
      {id:"low_meat", text:"Редко ем мясо"},
      {id:"vegan",    text:"Веганство"},
      {id:"sugary",   text:"Много сладкого"},
    ]
  },
  {
    id: "women_health", title: "Уточни по женскому здоровью", type: "grid", femaleOnly: true, options: [
      {id:"normal",    text:"Всё в порядке"},
      {id:"pms",       text:"ПМС"},
      {id:"pcos",      text:"СПКЯ"},
      {id:"thyroid_f", text:"Щитовидная железа"},
      {id:"fertility", text:"Фертильность / ЭКО"},
    ]
  },
];

let quizAnswers     = {};
let quizStepIdx     = 0;
let quizActiveSteps = [];
let quizSymptoms    = new Set();
const addedToTracker = new Set();

function getActiveSteps() {
  return QUIZ_BASE_STEPS.filter(s => !(s.femaleOnly && quizAnswers.gender !== "female"));
}

function renderWelcome() {
  const name = user.first_name ? `, ${user.first_name}` : "";
  document.getElementById("screen-quiz").innerHTML = `
    <div style="min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center">
      <span class="label" style="margin-bottom:24px">Biolar Organics</span>
      <div style="font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-bottom:16px">
        Привет${name}.<br>Ты уверен,<br>что пьёшь то,<br>что нужно<br>именно тебе?
      </div>
      <div style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:40px">
        Большинство берут добавки наугад.<br>
        Ответь на несколько вопросов — подберём<br>
        программу точно под твой организм.
      </div>
      <button class="btn" onclick="renderQuiz()">Начать подбор</button>
      <div style="text-align:center;font-size:10px;color:var(--muted);margin-top:12px;letter-spacing:.5px">
        2 МИНУТЫ · БЕСПЛАТНО
      </div>
    </div>
  `;
}

function renderQuiz() {
  quizActiveSteps = getActiveSteps();
  const step = quizActiveSteps[quizStepIdx];
  if (!step) { showSmartResults(); return; }

  const total   = quizActiveSteps.length;
  const current = quizStepIdx + 1;
  const pct     = Math.round((quizStepIdx / total) * 100);
  const cStr    = String(current).padStart(2, "0");
  const tStr    = String(total).padStart(2, "0");

  let body = "";

  if (step.type === "grid") {
    body = `<div class="quiz-grid">` +
      step.options.map(o => `
        <div class="quiz-card ${quizAnswers[step.id] === o.id ? 'selected' : ''}"
             onclick="selectCard('${step.id}', '${o.id}', this)">
          ${o.text}
        </div>`).join("") +
      `</div>`;
  } else if (step.type === "multiselect") {
    body = `<div class="quiz-chips">` +
      step.options.map(o => `
        <div class="quiz-chip ${quizSymptoms.has(o.id) ? 'selected' : ''}"
             onclick="toggleChip('${o.id}', this)">
          ${o.text}
        </div>`).join("") +
      `</div>
      <button class="btn" onclick="advanceQuiz()">Продолжить</button>`;
  } else if (step.type === "scale") {
    body = `<div class="scale-row">` +
      step.options.map(o => `
        <div class="scale-seg ${quizAnswers[step.id] == o.id ? 'selected' : ''}"
             onclick="selectScale('${step.id}', ${o.id}, this)">
          <div class="scale-num">${o.id}</div>
          <div class="scale-lbl">${o.label}</div>
        </div>`).join("") +
      `</div>`;
  }

  const backBtn = quizStepIdx > 0
    ? `<button class="quiz-back-btn" onclick="backQuiz()">← Назад</button>`
    : `<button class="quiz-back-btn" onclick="renderWelcome()">← На главную</button>`;

  document.getElementById("screen-quiz").innerHTML = `
    <div class="quiz-meta">
      <span class="label">Шаг</span>
      <span class="quiz-counter">${cStr} / ${tStr}</span>
    </div>
    <div class="quiz-prog-wrap">
      <div class="quiz-prog-bar" style="width:${pct}%"></div>
    </div>
    <div class="quiz-q">${step.title}</div>
    ${body}
    ${backBtn}
  `;
}

function selectCard(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".quiz-grid").querySelectorAll(".quiz-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 220);
}

function toggleChip(id, el) {
  if (quizSymptoms.has(id)) { quizSymptoms.delete(id); el.classList.remove("selected"); }
  else                       { quizSymptoms.add(id);    el.classList.add("selected"); }
}

function selectScale(stepId, value, el) {
  quizAnswers[stepId] = value;
  el.closest(".scale-row").querySelectorAll(".scale-seg").forEach(s => s.classList.remove("selected"));
  el.classList.add("selected");
  setTimeout(advanceQuiz, 270);
}

function advanceQuiz() {
  const step = quizActiveSteps[quizStepIdx];
  if (step.type !== "multiselect" && !quizAnswers[step.id]) { toast("Выбери один из вариантов"); return; }
  quizStepIdx++;
  quizActiveSteps = getActiveSteps();
  if (quizStepIdx >= quizActiveSteps.length) showSmartResults();
  else renderQuiz();
}

function backQuiz() {
  if (quizStepIdx > 0) { quizStepIdx--; renderQuiz(); }
}

async function showSmartResults() {
  const screen = document.getElementById("screen-quiz");
  screen.innerHTML = '<div class="spinner"></div>';

  const payload = {
    gender:       quizAnswers.gender       || "female",
    age:          quizAnswers.age          || "26-35",
    goal:         quizAnswers.goal         || "energy",
    symptoms:     [...quizSymptoms],
    stress:       quizAnswers.stress       || 1,
    sleep_q:      quizAnswers.sleep_q      || 4,
    diet:         quizAnswers.diet         || "balanced",
    women_health: quizAnswers.women_health || null,
  };

  const data     = await api("POST", "/api/quiz/smart-result", payload);
  const products = data.products || [];
  const analysis = data.analysis || [];

  if (!products.length) {
    screen.innerHTML = `<div class="empty"><p>Ничего не нашли.<br>Напиши нам напрямую.</p></div>`;
    return;
  }

  const analysisHtml = analysis.length ? `
    <div class="analysis-block">
      <span class="label" style="color:var(--accent)">Что мы выявили</span>
      <ul class="analysis-list">${analysis.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>` : "";

  const productsHtml = products.map(p => {
    const benefits = (p.benefits || []).map(b => `<li>${b}</li>`).join("");
    const added    = addedToTracker.has(p.id);
    return `
      <div class="product-card">
        <div class="product-name">${p.name}</div>
        <div class="product-tag">${p.tagline}</div>
        <div class="product-reason-lbl">Почему тебе это нужно</div>
        <div class="product-reason-txt">${p.reason}</div>
        <ul class="product-benefits">${benefits}</ul>
        <div class="product-links">
          <a class="link-wb"   href="${p.wb_url}"   target="_blank">Wildberries</a>
          <a class="link-ozon" href="${p.ozon_url}" target="_blank">Ozon</a>
        </div>
        <button class="btn-tracker ${added ? 'added' : ''}"
                id="add-btn-${p.id}"
                onclick="addToTracker('${p.id}')">
          ${added ? "Добавлено в трекер" : "+ Добавить в трекер"}
        </button>
      </div>`;
  }).join("");

  screen.innerHTML = `
    <div style="margin-bottom:24px">
      <span class="label" style="margin-bottom:6px">Твоя программа</span>
      <div style="font-size:24px;font-weight:800;letter-spacing:-.3px;margin-top:4px">Персональный подбор</div>
    </div>
    ${analysisHtml}
    ${productsHtml}
    <button class="btn secondary" onclick="restartQuiz()" style="margin-top:8px">Пройти заново</button>
  `;
}

async function addToTracker(productId) {
  if (addedToTracker.has(productId)) return;
  await api("POST", "/api/tracker/add", { product_id: productId });
  addedToTracker.add(productId);
  const btn = document.getElementById("add-btn-" + productId);
  if (btn) { btn.textContent = "Добавлено в трекер"; btn.classList.add("added"); }
  toast("Добавлено в трекер");
}

function restartQuiz() {
  quizAnswers  = {};
  quizStepIdx  = 0;
  quizSymptoms = new Set();
  renderWelcome();
}

renderWelcome();

// ── TRACKER ────────────────────────────────────────────────────────────────

async function loadTracker() {
  const screen = document.getElementById("screen-tracker");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/tracker");
  const products = data.products || [];

  if (!products.length) {
    screen.innerHTML = `
      <span class="label" style="margin-bottom:20px">Трекер</span>
      <div class="empty">
        <p>Пока ничего нет.<br>Пройди квиз и добавь продукты.</p>
      </div>
      <button class="btn secondary" onclick="showScreen('quiz')">Пройти квиз</button>`;
    return;
  }

  const today = new Date().toLocaleDateString("ru", { day: "numeric", month: "long" });
  let html = `
    <span class="label" style="margin-bottom:4px">Трекер</span>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">${today}</div>`;

  for (const p of products) {
    const s = p.streak;
    const streakTxt = s > 0 ? `${s} ${s === 1 ? 'день' : 'дней'} подряд` : "Начни сегодня";
    html += `
      <div class="tracker-item" id="tracker-${p.product_id}">
        <button class="tracker-check ${p.taken_today ? 'done' : ''}"
                onclick="logIntake('${p.product_id}', this)">
          ${p.taken_today ? "✓" : ""}
        </button>
        <div class="tracker-info">
          <div class="tracker-name">${p.product_name}</div>
          <div class="tracker-streak">${streakTxt}</div>
        </div>
        <button class="tracker-del" onclick="removeProduct('${p.product_id}')">×</button>
      </div>`;
  }
  screen.innerHTML = html;
}

async function logIntake(productId, btn) {
  if (btn.classList.contains("done")) { toast("Уже отмечено сегодня"); return; }
  const data = await api("POST", "/api/tracker/log", { product_id: productId });
  if (data.already_taken) { toast("Уже отмечено сегодня"); return; }
  btn.classList.add("done"); btn.textContent = "✓";
  const s = data.streak;
  btn.closest(".tracker-item").querySelector(".tracker-streak").textContent =
    `${s} ${s === 1 ? 'день' : 'дней'} подряд`;
  toast("Отмечено");
}

async function removeProduct(productId) {
  await api("DELETE", `/api/tracker/${productId}`);
  const el = document.getElementById("tracker-" + productId);
  if (el) el.remove();
  toast("Удалено");
}

// ── REFERRAL ───────────────────────────────────────────────────────────────

async function loadReferral() {
  const screen = document.getElementById("screen-referral");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/referral");

  const nextCount  = data.next_level?.count  || data.levels[data.levels.length - 1].count;
  const nextReward = data.next_level?.reward || "Максимальный уровень";
  const progress   = Math.min((data.ref_count / nextCount) * 100, 100);
  const botUsername = "Biolarapp_bot";
  const refLink  = `https://t.me/${botUsername}?start=ref_${data.ref_code}`;
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent("Подбери добавки под свою цель")}`;

  const levelsHtml = data.levels.map(l => `
    <li>
      <span class="level-badge ${data.ref_count >= l.count ? 'done' : ''}">${l.count} чел.</span>
      <span style="flex:1;color:var(--text)">${l.reward}</span>
      ${data.ref_count >= l.count ? `<span style="color:var(--accent);font-size:12px;font-weight:700">✓</span>` : ""}
    </li>`).join("");

  screen.innerHTML = `
    <span class="label" style="margin-bottom:4px">Приглашай друзей</span>
    <div style="font-size:13px;color:var(--muted);margin-bottom:24px">Получай скидки за каждого</div>

    <div class="card" style="margin-bottom:20px">
      <div class="ref-big">${data.ref_count}</div>
      <span class="label">Приглашённых</span>
      <div class="ref-bar-wrap">
        <div class="ref-bar" style="width:${progress}%"></div>
      </div>
      <div style="font-size:12px;color:var(--muted)">До следующей: ${nextReward}</div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <span class="label" style="margin-bottom:12px">Уровни наград</span>
      <ul class="levels" style="margin-top:12px">${levelsHtml}</ul>
    </div>

    <span class="label" style="margin-bottom:8px">Твоя ссылка</span>
    <div class="ref-link-box" style="margin-top:8px">${refLink}</div>

    <button class="btn" onclick="window.open('${shareUrl}', '_blank')" style="margin-top:4px">Поделиться</button>
    <button class="btn secondary" onclick="copyRef('${refLink}')">Скопировать ссылку</button>
  `;
}

function copyRef(link) {
  navigator.clipboard.writeText(link).then(() => toast("Ссылка скопирована"));
}

// ── GIVEAWAY ───────────────────────────────────────────────────────────────

async function loadGiveaway() {
  const screen = document.getElementById("screen-giveaway");
  screen.innerHTML = '<div class="spinner"></div>';
  const data = await api("GET", "/api/giveaway");

  screen.innerHTML = `
    <span class="label" style="margin-bottom:4px">Розыгрыш</span>
    <div style="font-size:13px;color:var(--muted);margin-bottom:24px">Каждый месяц разыгрываем набор продуктов</div>

    <div class="card" style="margin-bottom:20px">
      <div class="give-count">${data.total_participants}</div>
      <span class="label">Участников</span>
    </div>

    <div class="card" style="margin-bottom:20px">
      <span class="label" style="margin-bottom:12px">Как участвовать</span>
      <div style="margin-top:12px;font-size:13px;color:var(--muted);line-height:2">
        Подпишись на Telegram-канал<br>
        Нажми кнопку участия<br>
        За каждого приглашённого — дополнительный шанс<br>
        Итоги в конце месяца
      </div>
    </div>

    ${data.participating
      ? `<div class="card" style="text-align:center;color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.2px">Ты участвуешь. Удачи.</div>`
      : `<button class="btn" onclick="joinGiveaway(this)">Участвовать</button>`
    }
  `;
}

async function joinGiveaway(btn) {
  btn.disabled = true; btn.textContent = "...";
  const data = await api("POST", "/api/giveaway/join");
  btn.closest(".screen").querySelector(".give-count").textContent = data.total_participants;
  btn.replaceWith(Object.assign(document.createElement("div"), {
    className: "card",
    style: "text-align:center;color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.2px",
    textContent: "Ты участвуешь. Удачи.",
  }));
  toast("Ты в розыгрыше");
}
</script>
